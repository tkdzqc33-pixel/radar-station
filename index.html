<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📡 AI 情报雷达站</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#050505" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
</head>
<body style="background:#050505;color:#CCFF00;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
<div style="text-align:center;">
  <div style="font-size:40px;">📡</div>
  <div style="margin-top:10px;">情报雷达站加载中...</div>
</div>
<script>
// 引导页：读版本号 → 跳转到 app.html?v=版本（不同版本URL不同，绕开缓存）
(function () {
  var cached = null;
  try { cached = localStorage.getItem('radar_version'); } catch (e) {}
  fetch('./version.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (v) {
      v = v.trim();
      try { localStorage.setItem('radar_version', v); } catch (e) {}
      location.replace('./app.html#v=' + v);
    })
    .catch(function () {
      location.replace('./app.html' + (cached ? '#v=' + cached : ''));
    });
})();
</script>
</body>
</html>
