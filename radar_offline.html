分析师电话会上，集团CEO吴泳铭表示，平头哥已建立覆盖GPU、CPU、网络芯片的全栈自研芯片组合。真武芯片到8月初已经服务了超过650家客户。基于新一代平头哥芯片真武M890的超节点实例，近日已上线阿里云进行规模化销售，下半年将持续放量以满足客户的旺盛需求。\", \"published\": \"Thu, 20 Aug 2026 11:44:18 GMT\", \"source\": \"36氪 - 快讯\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"industry\", \"level\": \"B\", \"why\": \"芯片供应影响AI工具成本，间接相关\", \"action\": \"留意芯片价格趋势\", \"opportunity\": \"无\", \"risk\": \"无\"}, {\"title\": \"元立光电北交所IPO过会\", \"link\": \"https://www.36kr.com/newsflashes/3947770454965633\", \"summary\": \"36氪获悉，北交所上市审核委员会召开2026年第77次上市审核委员会审议会议，审议结果显示，东莞市元立光电股份有限公司首发符合发行条件、上市条件和信息披露要求。\", \"published\": \"Thu, 20 Aug 2026 11:34:42 GMT\", \"source\": \"36氪 - 快讯\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"other\", \"level\": \"B\", \"why\": \"无关业务，仅行业动态\", \"action\": \"忽略\", \"opportunity\": \"无\", \"risk\": \"无\"}, {\"title\": \"斗鱼26年Q2财报发布：总收入9.81亿元，毛利润同比增长12%\", \"link\": \"https://36kr.com/p/3947666391301504?f=rss\", \"summary\": \"8月20日，斗鱼发布2026年第二季度未经审计财务报告。 本季度斗鱼总收入9.81亿元，环比增长19.4%，受本季度内容投入阶段性增长影响，第二季度GAAP净亏损为7235万元，调整后净亏损为1345万元。依托收入结构及运营成本效率提升，毛利润为1.59亿元，同比增长12%，毛利率为16.2%，同比、环比均有所改善。创新业务、广告及其他收入为4.78亿元，占总收入48.7%，同比增长0.4%，环比增长32.2%，连续六个季度占总收入比重40%以上。 斗鱼CEO任思敏表示：“第二季度，尽管外部环境仍存挑战，我们在多个方面取得了稳步进展。直播收入实现环比增长，用户参与度有所提升，进一步体现了我们核心直播生态的韧性。创新业务、广告及其他业务收入继续增长，反映出我们在收入多元化方面保持了良好势头。季度内，我们成功举办了斗鱼嘉年华，初步验证了自有IP在激活主播生态、提升品牌认知及深化厂商合作方面的长期价值。未来我们将继续采取聚焦且审慎的投资策略，同时持续提升活动及内容供给的质量、成本效率和变现能力。通过这些举措，我们将进一步夯实直播业务，并推动平台实现健康、可持续的增长。” 版权+自制双轨并进，持续深耕电竞内容矩阵 2026年第二季度，斗鱼累计完成63场版权电竞赛事转播，同步落地37场自制赛事及特色直播活动。平台通过覆盖头部版权与原创自制的多元电竞内容矩阵，充分满足核心用户的观赛需求，在持续优化用户观赛体验的基础上，稳步提升赛事运营效率与内容供给吸引力。 版权赛事方面，平台持续引入高关注度电竞内容，包括KPL春季赛、王者荣耀挑战者杯、CS2科隆Major等头部电竞系列赛事，在激活垂类分区热度的同时，推动赛事期间用户流量与平台运营表现提升。同时平台依托头部主播资源配套推出二路解说、轻量互动观赛活动，为用户提供了更多元的观赛选择，进一步提升了平台电竞内容供给的丰富度。 斗鱼线上线下生态正在齐头并进 自制赛事方面，斗鱼持续深化内容IP运营能力，围绕头部游戏品类和核心用户社区打造多元化的电竞直播内容。第二季度，平台推出三角洲行动鱼跃杯武神挑战赛、CS2妹力对决、斗鱼DOTA2宝可梦、英雄联盟驴酱杯和星际争霸2斗鱼嘉年华传奇邀请赛等自制赛事，依托主播联动参与、线下落地决赛及全周期系列化运营，在版权赛事之外形成有效内容补充，稳步提升平台社区整体活跃度。 直播收入环比增长，收入多元化协同赋能 本季度，斗鱼依托平台运营资源，推出一系列跨分区主播联动的PGC直播内容，包括伐木训练营S2、红蓝对抗赛等，通过不同分区主播优势互补，提升了直播效果与用户体验，其中伐木训练营S2吸引数千万用户观看，推动相关活动取得了良好的商业化成效。本季度斗鱼直播收入为5.03亿元，环比增长9.3%，进一步验证了“内容运营+商业转化”的协同效果，展现出斗鱼核心直播业务的长期运营韧性。 电竞内容持续为平台带来新鲜热度 与此同时，创新、广告及其他收入4.78亿元，占总收入的48.7%，同比增长0.4%，环比增长32.2%，连续六个季度占总收入比重的40%以上。其中语音社交业务继续优化流量分发与资源配置效率，在商业化效率与社区生态健康之间保持平衡，第二季度收入2.72亿元，平均MAU为31.43万，月度平均付费用户为6.62万，展现出可持续的发展态势，协同推动平台营收结构优化升级。 战略加码重点自有IP，斗鱼嘉年华落地深化线下影响力 本季度，斗鱼加大重点自有IP项目投入，斗鱼嘉年华时隔7年重启，充分发挥平台以游戏为核心的社区优势、主播生态及内容运营能力，汇聚多家头部游戏厂商及行业生态伙伴，如《和平精英》《三角洲行动》《盛世天下》《猛兽派对》等，设置游戏展台、电竞赛事、主播互动、明星舞台等多元活动板块，为到场用户打造了超10万平方米的集游戏电竞互动、音乐演出于一体的综合线下体验空间。 斗鱼嘉年华 活动落地武汉4天共吸引游客超22万人次，外地游客占比达75%，进一步强化了平台与游戏厂商、主播、行业合作伙伴及核心用户的协同连接，成为各大品牌触达年轻群体、提升品牌影响力的优质场景，也打造出游戏文化与地方文旅深度融合的标杆案例。得益于Q2线上、线下内容及活动供给的持续完善，平台用户体验稳步优化，本季度平均MAU超4500万，环比增长2.6%。 斗鱼嘉年华 斗鱼副总裁曹昊表示：“第二季度，斗鱼总收入环比增长19.4%，同比降幅继续收窄。受收入结构优化及成本效率提升的推动，毛利润同比增长12%，毛利率提升至16.2%。本季度我们对重大品牌及内容活动进行了较为集中的投入，带动期间营业费用上升。展望未来，我们将继续坚持审慎投资，在支持内容生态和创新业务发展的同时，持续提升经营质量和财务韧性，推动盈利能力逐步改善。” 第二季度，斗鱼持续优化线上内容生态，推动斗鱼嘉年华等标杆自有IP线下落地，进一步优化用户和主播的社区生态，强化游戏厂商和行业伙伴的协同联动，积极拓展平台长期运营的价值空间。今后，斗鱼将继续以稳健的运营节奏，一步步夯实直播赛道的核心优势，驱动整体业务实现健康可持续发展。\", \"published\": \"2026-08-20 18:18:10  +0800\", \"source\": \"36氪\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"other\", \"level\": \"B\", \"why\": \"直播行业动态，非核心业务\", \"action\": \"忽略\", \"opportunity\": \"无\", \"risk\": \"无\"}, {\"title\": \"一个扭转命运的决定：5000 亿智谱如何「逆风改命」|深氪\", \"link\": \"https://36kr.com/p/3947451908357257?f=rss\", \"summary\": \"文 | 周鑫雨 张雨忻 编辑 | 张雨忻 杨轩 GLM 5.3 发布后不到一小时，智谱一名销售的电话和微信都爆了：十几个来询问 API 上线时间的，以及吸取了 Kimi K3 教训，想提前锁定智谱推理算力的客户也不少。这种状况一直持续了整个周末。 8 月 14 日下午，智谱突然发布了新一代模型，在测评榜单上再次刷新国产模型的 Coding 表现，与不久前发布的 Kimi K3 并列开源第一，与Claude Fable 5、GPT-5.6 Sol 等闭源旗舰模型处于同一水平。这瞬间引爆了客户们的热情。 &nbsp;Artificial Analysis 榜单。图源：智谱公众号 周末过去，消息和电话并没有停——原定 8 月 18 日要上线的 GLM 5.3 API 推迟了，销售再一次被客户“围攻”。“客户在电话里对我喊：内部预算和开发运维都到位了，delay 一天我们的管理成本就多好几万！” 上述销售回忆，如此这般的 “API 哄抢”大概是从 2026 年 2 月开始的——这是智谱发布大版本更新模型 GLM 5 的时间，当时多家外媒都评价其“第一次真正把中国开源模型推到全球前沿模型附近”。在那以后的 GLM 5.1 来到全球第一模型梯队，GLM 5.2 拿到全球开源模型 SOTA（最佳）。可以说，每一个版本都在显著提升。 这期间，越来越多人开始问，这些模型背后的智谱，是一家怎样的公司？ 其实，在中国 2023 年开始兴起的大模型浪潮中，智谱原本是一个“不够主流叙事”的存在。 它不够年轻——2019 年就已经成立，在推崇“小天才”的气氛下看起来不够酷； 它不够“公司化”——几乎完全脱胎于清华，带着鲜明的学院派和实验室气质； 它的商业化路径看起来不够性感——长期给政企客户做模型私有化部署，不是互联网的“可复制、规模化”逻辑。 但是，如果你是近一年才关注到这家公司，对它的认知大概率会是：全球大模型第一股，最高曾摸到 1.3 万亿港元市值，堪比好几个美团；拥有开源 SOTA 的模型，口碑全球出圈；ARR（年度经常性收入） 目前在中国模型厂里位列第一...... 这种大转变的核心，就在模型的 Coding 能力上——当全球大模型都沉浸在 Anthropic 带来的 Coding 狂欢中时，智谱是中国最早拿到 Coding 门票的大模型公司，靠着足够好的 Coding 模型迎来口碑爆发和收入激增，并且一定程度上推高了过去半年国内大语言模型的竞争烈度。 智谱做了什么？率先拿到 Coding 门票的，为什么会是智谱？ 要解答这些问题，需要先回到 2025 年 5 月，“智谱押中 Coding” 的前两个月。 一、���水一战，和意外的 Coding 爆发 2025 年 5 月，智谱紧急召开了一次战略会。“只有核心高管和少数股东参与了，核心议题之一是，智谱下一阶段的模型要往哪个方向走。” 一位知情者告诉 36 氪。 这个议题，在那个时间点几乎决定了智谱的接下来的命运。 一方面， 在 2025 年春节横空出世的 DeepSeek R1 几乎一刀悬在了智谱的商业化大动脉上。 这个性能比肩 OpenAI o1，但价格只有 o1 1/30 的模型，冲击了当时整个 B 端市场，而面向 B 端做定制化模型部署是智谱当时最重要的商业化方向。 一位智谱做商业交付的员工告诉36氪，他就没能过个好年：“一天接 5、6 个客户的电话，但大部分是来问能不能部署 DeepSeek 的。” 他心里有些五味杂陈，“DeepSeek 一夜之间全民知晓，不少客户的老板都交代下面的人改用 DeepSeek。” 另有智谱员工告诉 36 氪，“保守估计，当时智谱近 30% 的客户流向了 DeepSeek，对公司打击很大。”他提到，为了留住客户，智谱给一些客户开出了非常低的折扣。 而另一方面，国内的大模型市场也在悄然转向。Chatbot 的热度褪去，当时与智谱同为“六小虎”成员的月之暗面、MiniMax 都在押注以调用工具、执行复杂任务能力见长的旗舰模型。 面对危机和变化，智谱的这次战略会做出了一个扭转命运的决定：改变原本针对文本、多模态、编程等能力各自做垂直模型的路线，押注 Reasoning（推理）、Coding（编程）、Agentic（智能体） 三类数据融合的大参数、三合一模型。 智谱意识到，必须走出舒适区，寻找属于下一阶段的新机会，而新机会只会从效果足够好的、能解决更复杂的生产力需求的大模型里长出来。 这个决定对智谱来说并不容易。“不少股东都反对继续 scale up 模型（即推高模型参数），因为投入太高了。”一位知情者告诉36 氪。智谱的财务压力一直都不小——2025 年财报显示，智谱净亏损高达 47.18 亿元，仅研发一项就花费了 31.82 亿元，是当年总营收的 4 倍。 另一个原因则在于， 多数据融合的模型，与智谱走 B 端定制的商业模式天然相悖。 一名智谱 B 端业务人士告诉我们，为了匹配客户的具体业务场景，智谱此前将模型能力做了很清晰的垂直场景划分——对话、生图、生视频、Coding 等各有对应的模型和产品。若用一个融合模型匹配所有场景，那么部署成本会变得非常高。 这个“三合一”模型，就是在 2025 年 7 月上线的 GLM 4.5 。“原本 4 月就要上线的，但因为临时调整了模型方向，硬生生拖到了 7 月。” 一位知情人士告诉 36 氪。 这是智谱的背水一战。为了训练“三合一”的模型， 智谱准备了 15 万亿 Token 的通用数据，以及 8 万亿 Token 的 Coding、Reasoning 和 Agentic 数据，总训练数据量几乎是同期模型的 1.5 倍 。 焦虑几乎弥漫在所有人身上。多位智谱员工告诉 36 氪，GLM 4.5 发布前的几个月，AI 院（智谱的技术和产研部门）的所有算法几乎住在公司，“4.5 发布那天，我凌晨下班，早上上班的时候，算法那边坐的整整齐齐，和昨晚我走的时候几乎一模一样。”还有市场侧员工在发布日通宵到早上 8 点，“太焦虑了，不知道 GLM 4.5 的市场反响会怎么样。” 后来的故事人尽皆知： GLM 4.5 成为了智谱第一个在 Coding 上收获口碑的大模型，也让智谱成了国内最早押中 Coding 赛道的大模型公司之一。它真的帮智谱找到了属于下一竞争阶段的新机会——Coding。 其实在国内，不少大模型公司在 2024 年 6 月 Claude 3.5 Sonnet 发布时就已经关注到了 Coding 的苗头，但却没敢入局。 MiniMax 创始人闫俊杰两年前就曾问过 DeepSeek 创始人梁文锋：“你们要不要做 AI Coding。” 梁给出了否定的答案。 “当时大家的共识是，全中国会写代码的人可能只有 100-200 万，这似乎不是一个足够大的市场。”闫俊杰在一场活动上回忆道。但他们没想到的是，当 AI Coding 成为改变生产方式的变量，200 万人的市场也可以变成 2000 万人。 不过，智谱的率先押中，也并非是“一切尽在计划中”。 一名智谱员工告诉我们，“三合一”刚开始训的时候，Reasoning、Coding 和 Agentic 之间的优先级没有明显差别， 模型最终聚焦到 Coding 上，一个直接的诱因是，用户的选择。 据 36 氪了解，研发过程中团队内部反复讨论提到，模型要贴近用户的真实需求，不要围着榜单来，模型真正的能力需要在真实任务中得到验证。所以算法团队会频繁参考用户/客户反馈，了解他们的需求点。其中， “提高研发效率”，是一个被高频提及的需求。 而恰好，这也与管理层所强调的“追求更高智能上限”方向一致。 GLM 4.5 发布后，一位销售记得，当时不断有 KA 客户提需求，将 GLM 4.5 接入程序员的工作流。社交媒体上，“Claude 平替”的声音也开始出现——毕竟，GLM 4.5 的 Coding 能力逼近 Claude Sonnet 4，价格却只要后者的 1/7。 Coding 成了 GLM 4.5 市场反响最好的能力 。2025 年 9 月，智谱推出了“GLM Coding Plan”， 成为国内第一个推出 Coding Plan 的大模型公司 。10 月，“GLM Coding Plan 企业版”上线， 同月推出的新模型 GLM 4.6，据官方说法，特别强化了 Coding 能力。 到这里，智谱的新故事线逐渐清晰——在又重又难以复制的 B 端模型部署生意之外，抓住了能规模化、且商业价值较高的 Coding 生意。 “Chatbot 的故事，从 DeepSeek 出来后，就已经结束了。我们应该思考的是下一个 bet 是什么。” 在 2025 年初的一场活动上，智谱创始人唐杰曾提到。现在回头看，这个 bet 就是 Coding。 二、GLM 5.2 和万亿市值 智谱今年1月在香港挂牌上市、成为“全球大模型第一股”这天，CEO 张鹏给每位员工发了 200 元的红包。但这份喜悦只维持了一天——一天后，MiniMax 上市，股价首日暴涨 109%，市值突破千亿元，几乎是智谱的两倍。 当两家基因完全不同的大模型公司被同一时间放到公开市场上被审视，智谱在市值上暂时落了下风。“在国内，当时 MiniMax 聚焦的 C 端市场被认为有更大的想象力，被贴上 toB、toG 标签的智谱看上去就没那么性感。”一名大模型投资人对36氪说。 但仅过了 5 个月，智谱用一个开源的 SOTA 模型再次扭转局势，而这一次，比 GLM 4.5 那次更为彻底：收入、口碑、股价，迎来全面爆发。 2026 年 6 月 13 日，智谱发布了新一代旗舰模型 GLM 5.2 。这个依旧以 Coding 为最主要能力的模型在 Artificial Analysis 综合榜单上位列开源模型 SOTA，仅次于闭源的 Claude Fable 5、Claude Opus 4.8（max），以及 GPT 5.5（xhigh）。 用户的钱包是最诚实的。 GLM 5.2 让智谱的 API 收入快速攀升。 智谱股东告诉 36 氪，2026 年 5 月，智谱的 ARR 还在 5-6 亿美元左右，对年底 ARR 的预期为 10-15 亿美元。而在 GLM 5.2 发布后一个月，36 氪再度独家获悉， 7 月智谱的 ARR 已飙升至 10 亿美元，相较 2 个月前几乎翻倍，而年底的 ARR 预期也提升至 25 亿美元。 针对这一数据，智谱暂无回应。 能够从销售第三方模型里获得分成的云厂商们也快速捕捉到了 GLM 5.2 带来的机会。一名智谱人士告诉 36 氪，阿里云、火山引擎、甚至小米和金山云，“推销 GLM 5.2 比智谱自己都狠”，因为“客户都是来问 GLM 5.2 的”。 阿里云一名销售也证实了这件事：由于下游需求太旺盛，到了 7 月，阿里云“直接给客户推 GLM 5.2” 。 智谱迎来了自己的“DeepSeek 时刻”。 不仅国内，海外影响力也因 GLM 5.2 被快速打开。云端部署与托管平台 Vercel 的监测显示， GLM 5.2 调用量的增长速度是 2026 年以来所有模型中最快的，超过了 4 月发布的 DeepSeek V4。 “智谱没多少营销预算，我们的做法就是免费给潜在 KA 和 KOL early access（试用名额），让他们直观感受模型能力。”一位销售告诉 36 氪。另有市场推广业人士告诉我们， 在 GLM 5.2 发布前，智谱的中高层一有机会就飞去海外见 KA 客户和科技 KOL，邀请他们参与内测。 “当时不少海外客户用过之后发现，GLM 5.2 的综合能力超过了 DeepSeek V4，海外口碑就是这么逆转的 GLM 5.2 发布后，智谱总部搜狐网络大厦外墙的 LOGO，从汉字“智谱”，换成了“Z”。图源：作者拍摄 股价也飞升了。 GLM 5.2 发布后的第一个交易日，智谱股价大涨 32%，并在一周后，达成万亿市值。 在这个时间点下，智谱的市值大约是2.5 个美团，和 3.5 个京东。 回溯到年初股价节节攀升的时期，智谱在商业化上就做了一个决定： 大幅提升 MaaS 业务的优先级。实际上，不少股东都认为，智谱原有的（B 端）定制化生意，撑不起太高的市值。 一方面，定制化业务没有规模效应，想接更多单子，就必须加更多人。 据一位智谱员工的测算，B 端业绩每年稳定在 1.5 倍的增长幅度——稳健，但天花板就在那。 并且，每一笔订单都是高度非标的。“有时候为了尽快拿到验收单，我们工作之余还要付出很多额外的情绪和体力劳动：替客户开会，帮他们制作汇报 PPT，甚至帮他们接孩子......说白了，就是要付出大量人力把客户服务好。” 另一方面，现在模型的迭代速度太快，可能一个模型在开始部署时还是行业内最领先，但花几个月部署完之后已经被别的模型远远超过。越来越多客户也认为购买 MaaS 服务是更灵活的方式。 其实早在 2021 年，智谱内部就讨论过未来的商业模式，当时内部已经认为，应该对标（彼时的）OpenAI，把重点放在 API 调用收费上。但由于当时国内 MaaS 市场太早期，也没有真正能打的模型，所以没有条件推下去。 5 年后的现在，张鹏选择把对标对象明确为了 Anthropic。但对比 Anthropic 来看，智谱的 MaaS 业务还有巨大的收入鸿沟需要填补。根据最新的公开数据，智谱的市销率高达 Anthropic 的 5 倍多。 基于 Anthropic 的市销率，智谱的市值若想稳定在万亿港元，ARR 要达到 487.8 亿港元，约 62.2 亿美元。 而当下，智谱的 ARR 刚刚达到 10 亿美元。 图源：36 氪制作 三、取舍的胜利，“不犯错”的胜利 “为什么是智谱？” 当智谱用 GLM 4.5 踢开 Coding 的大门，并以 GLM 5.2 一飞冲天后，不少人开始问出这个问题。 36 氪也向多位智谱员工抛出了这个问题，得到的答案几乎一致： 克制地聚焦、没犯错、每一步基本做对了 ——“把每一步都做对，模型几乎不可能差”这个结论，在字节的 Seedance 的成功上也被验证过。 这些看起来偏“稳健”的风格和做法，与智谱这家公司的基因息息相关。回溯智谱在一些关键时刻做过的对的选择，有一个因素非常重要，那就是——尊重自己的基因。 张鹏曾这样评价智谱：“就像清华的理工男一样，很聪明、很能干，你让他干什么事情，他能干得很漂亮，但是就是没有太多的情绪价值。” 这符合一直以来外界对智谱的印象：有技术、有视野，但看起来不够有趣，不够性感。 而张鹏关于智谱“没有太多情绪价值”的评价，与智谱的模型和产品之间，形成了有趣的互文。 2024 年，智谱曾与一家硬件厂商合作，将 GLM 接入产品。当时，智谱拿出了 GLM “情商最高的系列”。但在内部测评中，当员工输入“我的心情有点 down”时，接入了 GLM 的产品的回复竟是：“打开空调”。 张鹏曾在媒体访谈中提到：“（杨）植麟（月之暗面创始人）知道怎么去理解普通人的需求和想法，我们在这方面可能做得没有那么好，这跟我们的定位有关系。” 智谱在这方面的弱势，使它 在 toC 产品上存在短板。 两个典型案例是 Chatbot “智谱清言”和视频生成模型“智谱清影”。根据“AI 产品榜”数据，截至 2025 年 3 月，Chatbot 大战约一年半后，智谱清言 App 端月活为 1043 万；同时期，豆包的月活是9736 万。而“清影”的销售情况则可以用“惨淡”来形容，一位智谱销售告诉我们，“客户大多是从事艺术领域工作的，看不上清影的审美。” 不擅长聊天、不擅长视觉类审美这样的市场反馈，并没有让智谱失去战斗力。相反， 意识到自己的短板后，智谱果断将资源从这些方向上撤出，聚焦到了自己擅长的方向上。“智谱是一个非常理工科气质的公司，Coding 就是最适合他们的方向。”一位业内人士评价。 目前， 在智谱 AI 院中，负责多模态模型训练的算法降缩减 10 人左右；而聚焦文本、Coding 方向的算法则有百人。 一名知情人士透露， 智谱有较高的预算做 Coding、Agentic 的 RL 环境搭建和数据工程。 在当下算力资源、模型容量、模型数据量等现实掣肘下，模型厂商们都不可避免地要做选择题，为不同的模型能力排优先级。 如果既要又要，可能导致哪方能力面都不够突出的结果。 “模型每一种后训练目标都会占用其他目标的能力。 把提升 Coding 能力作为训练目标，意味着训练数据要少废话、高精度，这和正常人之间带有情感的交流是相悖的。” 智谱一名前算法员工举了个例子：GPT-5 和 DeepSeek V4 发布时，都因为提升了 Coding 和 Reasoning 能力，而被用户评价“情商变低”。 还有一个例子是 MiniMax。模型 M3 发布后，一名参与训练的算法反思，M3 各项能力都不突出，就在于训练目标没有收敛：“MiniMax 的优势业务都是 toC 的，虽然老板们知道 Coding 和 Agentic 重要，但也放不下模型的情商优化工程。” 最后的结果就是，M3 发布后行业反响平平。 不过近期，36 氪独家获悉 MiniMax 在 6 月底解散了后训练团队中的“泛娱乐组”，将人力和资源投入到了 Reasoning 和办公场景。 做对方向的取舍之后，在接下来模型训练的每一个关键环节中，智谱也基本做到了“不犯错”。一个核心原因在于，智谱搭建了精细的 A/B Test 体系。 一名智谱员工告诉我们，“遇到关键技术选型时，智谱会分两三波人马做 A/B Test，每个测试组放两三个研究员，就像实验室一样。” 另有员工提到， 智谱将训练阶段和训练路线拆得很细致，一旦无法确定技术选型，算法就会将每一条路线下的训练结果去测试集上跑一跑，择优而取。 另一个不犯错的原因，则来源于“经验”。早在 2021 年，唐杰就主导了智源研究院发起的万亿参数大模型“悟道 2.0”的训练。在一众大模型公司的创始人中，做过这个参数量模型的只有唐杰和杨植麟。 经验带给智谱的，是对数据和后训练的重视 。目前业界的共识是，提升 Coding 能力的关键，是做好 SFT（监督微调）和 Agentic RL（基于 Agent 任务环境做强化学习）。在这两个后训练环节，“ 至少对于一些前端任务，数据的作用比算法大。 ”一位大模型行业人士判断。 然而，制定数据策略有相当高的经验壁垒。“用哪些 query 去问，基于哪些 task 跑，合成的数据用来做 SFT 还是 RL，是用来生成训练的模拟环境，还是直接用于训练，这些决策都离不开经验。”一名 MiniMax 算法告诉我们，M3 发布后，MiniMax 内部开了场反思会，内部得出的一个结论就是：数据策略没做好。 早在 2024 年，智谱就在海外投入了一个团队，从事数据的采购。 在内部，负责模型训练和数据的张笑涵主导搭建了一个数据标注平台，名为“狂标”。在语言模型和多模态模型两个组轮训期间，待训组的核心任务，就是标数据。 另外，自GLM 4.5 起，算法团队开始愈发重视下游客户的反馈。 一位智谱员工记得，AI 院常常与销售和交付团队的负责人们开会，从而收集 KA 客户的反馈。 模型发版前，内部会设置两道测评 ：一道在 AI 院，做通用能力测试；另一道则在交付团队，基于目标用户高频场景做测评。“所以，GLM 的 Coding 能力在开发者群体中口碑很好。” 四、人才壁垒：师门下的组织 这套“不犯错”的体系背后，是智谱 AI 院的数百名算法人员。“ 智谱的算法用钱挖不动 。” 一名从事高招的猎头告诉 36 氪，“有大厂愿意开数千万元薪资包挖智谱 AI 院的核心算法，但最后以失败告终。” 一方面，智谱的核心算法确实很贵——公司市值快速攀升，核心算法手里的期权都值十几亿了。但更重要的原因是， 智谱与它的核心人才之间形成了一种金钱之外的深度关系，这是其它大模型公司难以复制的。 这种关系是怎么建立的？ 在国内一众大模型公司里，智谱是一个鲜明的存在：从创始人到各个岗位上的核心成员，几乎都来自清华，其中不乏大量同门和师生关系。很多行业人士在提到智谱的组织时都会提到几个词：学院派、清华系、唐杰和他的学生...... “它是一个公司、学校、研究院的结合体”，一名投资人如此评价智谱。 作为以模型训练为核心的组织，这个组织绕不开的人物，是它的创始人兼首席科学家唐杰。作为清华计算机系教授，唐杰是中国最早做机器学习、NLP（自然语言处理）的学者之一。多位投资人和 FA 评价，当他们在 2022 年底找对标 OpenAI 的标的时，脑海中最先跳出的清华学者是：唐杰、孙茂松、黄民烈。 在不少智谱员工看来，“唐杰热情、有信服力、执行力也强”，但同时对待技术和业务又要求极高。一名智谱 AI 院的算法记得，智谱 Agent 产品 AutoGLM 2.0 的训练结果不理想，唐杰直接推迟了上线时间。 这家公司的核心团队带有强烈的清华系人际羁绊。负责商业化的 CEO 张鹏，清华本、硕、博出身，与唐杰同属计算机系；负责政府关系的智谱总裁王绍兰和董事长刘德兵，也都毕业于清华，与创始团队在清华数据科学研究院大数据研究中心共事过。 智谱港交所挂牌上市当天，张鹏（左二）、王绍兰（左一）、刘德兵（发言者）等智谱核心成员到场。图源：智谱 而智谱的心脏——负责模型训练的 AI 院， 数百位位研究员中 70% 以上都是清华计算机系的本科生、硕士生或博士生 。 庞大清华师生构成的智谱形成了一个相对稳固的算法组织，被师门关系所包裹，“学院”文化鲜明。 学院文化一方面体现在工作方式上： AI 院层级扁平，比起公司，更像一个实验室 。据智谱员工，很多关键方向都是从一个技术问题或一次实验结果的讨论开始的，不同背景的研究人员会很自然地参与进来。对年轻研究员来说，有比较大的空间来提出问题、验证想法。 并且，不少学生都表示，出于对自己老师、学长的尊重和情感，不会轻易选择离开。“想在唐老师门下读硕士博士的学生里，有一些也会选择先来智谱工作。” 一位前智谱算法告诉我们。 源源不断的人才供给，加上较低的流失率，智谱的算法人才壁垒就这样形成。 据 36 氪了解，GLM 5 发布后，有智谱的算法实习生一天之内就收到近 10 通猎头的电话；字节的猎头曾对着 GLM 论文上的署名，一个个打电话；腾讯混元愿意开两倍的底薪，去挖一个智谱的硕士。而以上种种，成功率都不高。 大模型公司之间的竞争，只会越来越激烈。 8 月 19 日，唐杰在 X 上发帖，阐述他对 Scaling Law 的理解：模型能力已经不再单纯由参数量决定，它更像是一个控制变量的实验，而变量包括“用了多少数据”、“准备把算力花在哪里”、“模型最终由谁、在什么条件下运行”等。这个论述指向 GLM 5.3 相较于上一代，实际是在后训练环节下功夫，而非卷预训练参数。 而大比例推高模型参数的几乎是剩下的所有头部大模型。过去一个月，月之暗面、DeepSeek、阿里都相继发布了新版旗舰模型，参数在 1.6 亿-2.8 亿之间，是 GLM 5.3 的 2-4 倍。其中，月之暗面在 7 月 17 日发布的 K3，取代了 GLM 5.2 维持了一个月的开源 SOTA 之位；而仅过了 20 多天，智谱又用 GLM 5.3 再次夺回。 模型方向、训练路线、数据质量、算法人才......围绕大模型各个维度的争论和竞速，远没有到可以分出胜负的时候。 （36 氪作者邓咏仪、李炤峰对本文亦有贡献）\", \"published\": \"2026-08-20 15:12:42  +0800\", \"source\": \"36氪\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"industry\", \"level\": \"A\", \"why\": \"智谱模型能力提升影响AI工具选择\", \"action\": \"测试智谱GLM 5.3 API性能\", \"opportunity\": \"使用新模型开发工具\", \"risk\": \"模型竞争激烈，需持续跟进\"}, {\"title\": \"「广告位」时代已死，智能体商业开收「中介费」\", \"link\": \"http://www.geekpark.net/news/369078\", \"summary\": \"「意图」这两个字，在整场支付宝 AI 生态合作伙伴大会上被提及了超 40 次。 如果说 5 月的 AI 支付生态大会上，Token Pay、AI 钱包，加上此前推出的 AI 付与 AI 收，代表支付宝明确了「支付可以用 AI」；那么这一次，我们看到的是，支付宝内部对智能体商业化该怎么做已经形成明确预期，并且对各个阶段的节奏和内容，做出了新的判断与调整。 这一次，支付宝几乎没有发布太多新产品，而是在告诉坐在台下的商家、交易平台、手机和车机厂商们，智能体商业化将会是什么样的。蚂蚁集团 CEO 韩歆毅认为，AI 能力的提升、流量红利见顶后的需求跃迁，以及可持续价值闭环的出现，会推动智能体商业在未来 6 到 12 个月内爆发。 在现场，我们发现支付宝里的出行、支付、生活板块，全部藏到了其智能体阿宝身后，几句话就能通过支付宝的智能体阿宝进行点单、订机票、寄快递。当商家服务变成被调用的接口，平台本身收缩成一个对话框，商业的竞争点也随之改变。过去商家拼的是「被看见」，抢入口、买流量、堆 SEO；现在拼的是「被理解」，看你的服务有没有真正的差异化长板，能不能在 AI 选择供给时被挑选出来。 在我们看来， 这场大会真正宣布的，是一次「分发权」的重新分配，决定商家能不能做成生意的，不再是它在流量池里买到的位置，而是它能不能被一套意图理解体系选中。 对话框背后，支付宝正在搭建的新体系，从意图的补齐与理解，到一方与三方服务商的服务体系，再到连接用户、平台与商家的智能体网络。 我们在现场和支付宝出行、物流、开发者生态等多个板块的工作人员聊了聊，看到意图为核心的智能体商业正在改变人们的衣食住行。 一、智能体商业竞争关键，在意图理解 韩歆毅把人与服务的连接方式分成三个阶段，搜索时代，人学着用机器的语言表达需求；App 时代，服务被封装进应用；而智能体时代，是机器开始学着用人的语言理解需求。「 智能体时代，商家的竞争从抢占流量入口，转向争夺用户意图理解能力。」他说道。 过去的搜索分发是品牌词逻辑，用户要么搜品牌名，要么搜特定商品，商家的功课是写 SEO，把标题拉得巨长，堆满关键词，等着被匹配。而智能体时代，平台需要面对的是彻底的自然语义理解。 比如说，当用户说的是「昨天我喝的东西，再给我点一杯」模糊语义时，能够及时下单；当用户说点一杯柠檬水的时候，要清楚他想要的大概率是蜜雪冰城的柠檬水；在「我要打车去 T3」的意思下，平台要明白 T3 是指航站楼，结合过往出行习惯，大概率是指北京首都机场航站楼。 AI 生态多端互联业务负责人王翼飞把意图理解拆成两层：「一部分叫补齐，第二部分是你怎么理解用户说的这件事情。」 模型得懂人在生活中是怎么使用服务的，才能做好执行。 除了能够知道用户表达的是什么，智能体还得能看懂用户的言外之意。比如说，当用户表达自己即将去看演唱会的时候，她真正的意图不只是「买一张票」，而是看演唱会、拍到清晰好看的照片、发上小红书、最好收获 1000 个赞。 买票只是其中一环。当模型理解了这背后的心理，一些流量时代单点的服务开始重组，她未必会为拍照买一台影像旗舰，但愿意花几十块钱租三天；携程可以顺势把酒店、机票和演唱会门票组成套餐。 「意图理解不应该是一个独立的产品模块，在最初分析需求的阶段被调用后，脱离整个服务环节，而是在服务的过程中，不断的与不同的技术服务环节相结合，服务整个流程。 比如说，用户说「帮我叫一个玛丫的外卖」，玛丫是他的个人热词，但要是产品连玛丫两个词都不能打对，ASR 环节这两个字识别错了，后面所有执行都是错的。」他说道。 意图理解真正的复杂之处，还在于参与方变多了。过去是用户自己把意图直接执行；现在是用户把意图交给 AI，商家和平台各方也把前置的意图交给 AI，不同的意图在 AI 这里相互碰撞、权衡，甚至生成新的理解和推荐。 所以，意图理解的能力其实并不完全依托于模型能力，它既考察平台方对于用户的理解能力，同时也考察如何利用长期数据形成准确的用户图谱，以及更多 Harness 层的应用。 智能体商业的竞争，未必是模型最强者赢，而更可能是服务理解积累最深者赢 。 谁用一套新的机制更好地理解用户的意图，谁就站在了新的智能体商业生态的中心位置。超级入口之争的下一层，或许就是这场意图权衡机制的竞争。它分配的，是过去由广告位分配的东西，商家的获客预算，可以不再经过「买曝光」，直接兑换成订单。 二、「拍卖」变「委托」，商业模式变了 在大会现场的演示里，点单不再是打开小程序一层层点选，而是直接对阿宝说出需求，阿宝会主动把单点好；订机票也不用自己打开小程序比对航班，只要告诉阿宝时间、机场和价格需求，它核对确认后就能帮你下单。 据支付宝披露，阿宝上线两个月已完成万余项服务的 AI 化接入，覆盖出行、餐饮、文旅、政务等八大场景，麦当劳、蜜雪冰城、瑞幸、高德打车、德邦、丰巢等品牌陆续接入，部分商家的智能体开发需求已经排到了明年。 智能体时代，商品和服务的经营方式发生很大改变，从服务一类人，变成服务一个具体的人。 过去品牌企业服务的是一类目标用户，不同品牌有不同的目标人群；当分发以意图为核心，目标用户群体的边界就消失了，因为谁都可能在某个时刻成为你的用户。过去我服务的是年轻爱喝奶茶的人，现在可以触达所有在某一刻表达出想喝奶茶的人，前提是我的奶茶有足够鲜明的特征或品质，能在被阿宝这类超级入口挑选时胜出。 面对同一个需求，阿宝会先把什么结果给到用户？内部的呈现逻辑是分层的。 当用户明确说出某个品牌，阿宝就直接调用这个品牌的服务，帮用户快速执行。当用户没有指明品牌，阿宝会先尊重用户的偏好和习惯，你是携程的老用户，就用携程的方式服务你；对没有任何使用习惯的新用户，阿宝才会基于意图理解、比价等综合结果做匹配。在这个环节里，平台能否充分理解用户的意图，就成了关键。 就好比同程愿意接考研房、电竞房，高端亲子度假房是携程的强项，王翼飞把支付宝的态度说得很直白，「你只要把差异化定义清楚，我们就愿意把这些意图下的诉求给到你；如果没有任何差异化，那就还是先按照流量分配逻辑」。我们在现场了解到，作为平台方，阿宝内部仍然按场景组织团队，再分服务来源于一方服务和三方服务，去形成某个具体的场景体系服务，基本架构没变，变得是如何展开合作。 真正值得商家注意的是，这个对话框背后，做成生意的要素正在被逐一改写。 韩歆毅提到流量时代是典型的漏斗模型，曝光、点击、转化层层损耗，越往下越窄；智能体时代，意图理解让需求可以被满足、被延续甚至被放大。「今天买的东西，下周、再下周智能体能够持续去做，对商家来讲，这是另外一种形式的会员管理。」韩歆毅说道。过去，商家的成功来自流量池里的位置，再加上某个长板撞上了天时地利人和；现在，所有供给都被 AI 统一看见，位置优势清零了，但拼的依然是长板，只不过必须是真正有利润空间的差异化服务能力。 推荐机制本身也在被重写。流量时代的推荐是一套「拍卖逻辑」，商家出价买位置，平台按点击率和出价排序，推荐的本质是在候选池里选一个最赚钱的答案。而当竞争下沉到 Harness 层，推荐变成了一套「委托逻辑」，智能体先替用户补齐和权衡意图，你是谁的老用户、此刻价格敏感还是时间敏感、这个需求背后还连着哪些没说出口的需求，再去匹配供给。 排序的依据从「谁出价高」变成了「谁被理解得准」，推荐单位也从一个商品链接，变成了一个组合起来的解决方案。 三、做智能体商业「基建层」，支付宝拿阿宝打样 那么，什么时候能判断阿宝的智能体商业化做成了？在与支付宝技术部总经理赵航的交流中， 她给出三条早期观察角度：一是商家在里面确实获得了增量生意；二是多端有一定的渗透率；三是开放平台升级成 AI 原生的平台。从网关、服务市场，到智能体搭建、AI 能力管理，全部换代，让所有参与者感受到从数字化时代到 AI 时代的升级。 不过我们也发现，当下要刺激用户进入智能体生态，还需要一个更强的触发点。如果自己下单和让阿宝下单速度差不多，用户很难改变现有习惯。因此支付宝阿宝早期落地的重点是找到用户体验有明显增量的场景。 比如同城配送，一年只用一两次，没有品牌心智，价格又敏感，阿宝一次询价就能同时拿到 9 家报价，省去逐个比价的麻烦，」如果我们给阿宝提供的只是一个单一的服务，甚至不如去小程序下单体验好，物流行业负责人坦言，聚合询价才是阿宝的差异点。再比如毕业季，学生要把四年的东西打包寄走，德邦和支付宝直接进校园，用阿宝下单打 88 折。「一定要贴场景，不是发张券，你就有用阿宝寄快递的诉求。」 支付宝内部把这类早期突破点归成三类：你经常用的，比如咖啡、家庭采买这类基于习惯反复发生的需求；你应急要用的，比如突然寄快递、马桶堵了、找阿姨上门；以及参谋和启发，比如看演唱会时顺手租一台拍照更好的手机 。既要重视体验提升，也要看到体验本身就是意图激发的前提。 但这并不意味着接了智能体，商家的订单和转化就会立刻提升。在我们与多位板块负责人的交流中，大家都在主动管理商家预期，现阶段传统渠道和 AI 渠道的占比可能还是 99 比 1，接了一个智能体不一定带来流量快速增长。现在是接轨未来的时刻，不是验收成果的时候。这个预期，阿宝内部和正在接入的商家都需要提前看到。 落到商业模式上，目前支付宝不抽佣、不收导流费用，支付费率的基础逻辑也没有变化。相反，为了把生态先做起来，这次发布的智能经营激励计划里，商家接入智能体支付费率打 6 折，个人开发者免费，另有人均 1 亿免费 Token 算力、真实成交补贴，以及会员体系、商家券、芝麻信用、租赁等 57 项原子经营能力的免费开放。 至于未来怎么收费，支付宝目前的倾向是按服务调用收技术服务费，复杂服务消耗的 token 多，定价就高，单一服务定价低，不同行业利润率不同，标准也会不同，但整个行业目前都没有统一答案。 真正的智能体时代，可能不是以广告流量为主的商业模式。 当支付宝想清楚智能体商业化该是什么，它也想好了自己的位置：仍然做平台，修好高速公路。韩歆毅的说法是，每一次技术革命都会诞生属于那个时代的公路和设施，支付宝要铺的是信任的路基、连接的轨道和开放的规则。 有意思的是，一家做了二十年入口的公司，正在表现出对入口的不执念。 可以看出，支付宝赌的不是下一个超级 App，而是智能体时代的「基建层」，前端入口谁赢都行，但每一笔服务经过它理解、履约和结算。 &nbsp;支付宝并不与商户争生意，不与终端争用户，收的是交易本身的过路费。 落到产品上，就是全栈智能体商业底座的三级路径，没有 AI 能力的商家走智能托管，把页面、商品和服务流程转成可被调用的标准化单元，以天计接入；已完成 AI 化的商家走自主智能，自建智能体、编排技能；规模起来之后，进入多智能体协同的智能体网络。而阿宝和健康助手阿福、和小布、和千问的联动，就是这张网络的雏形。 当然，想收过路费的不止一家。美团的小美用类似的智能体互通方式接入了腾讯元宝，各家手机厂商也各有一套协议， 这场竞争最先分出胜负的地方，可能不在 C 端体验，而在商户默认按谁的协议改造自己。 &nbsp;标准即生态税的征收权，这一幕，在支付的二维码之战里也曾发生过一次。 再往深一层看，「平台」这个词本身的含义也在换代。搜索时代的平台是一本目录，组织的是信息，卖的是曝光；App 时代的平台是一座商场，组织的是流量和交易，卖的是位置，DAU 和用户时长就是它的地租。而智能体时代的平台，组织的对象变成了代理人之间的协作，用户的 agent 替人表达意图，商家的 agent 承接服务，平台要做的是让两端互相找到、互相信任、把事办成，保证执行不越界、过程可审计、出了问题可追责。 角色一换，商业模式的选择其实就不再是选择，而是必然。 &nbsp;当平台从流量的「撮合者」变成用户意图的「受托人」，它的收入就很难再来自向商家卖推荐位，一个替你做决策的代理人，如果同时向被推荐方收钱，客户的信任从第一天起就不再建立。这解释了为什么支付宝反复强调「不是以广告流量为主的商业模式」，而是按服务调用收技术服务费，本质是把收入和「把事办成」绑定，而不是和「把谁排前面」绑定。也因此，平台的核心资产正在从流量池迁移到另外两样东西上，对用户和服务的理解，以及可验证的履约信任。 四、智能体商业化爆发还有六个月 对商家来说，「下一个时代或许是意图理解的时代」这句话不难听懂，难的是下一句：它如何影响我现在的服务，我该做什么？多数人还没有答案。 回到开头，韩歆毅判断未来 6 到 12 个月会有一次智能体商业化的爆发。但在爆发到来之前，商家们真的理解未来会是什么样吗？ 从我们在现场的观察看，并不是。大家都能看到供给形态在变，但谁能成为新的供给、供给什么样的差异化内容，理解的深浅差距很大。 跑在最前面的是头部餐饮品牌。在现场展台，星巴克、肯德基这类大品牌已经完全跑通了 AI 点单。肯德基在多轮对话、记忆理解上做了不少思考，核心指向一件事：提高点单效率。但效率之外呢？ 我们的感受是，支付宝的上下游一体侧已经充分感知到意图的重要性，商家侧虽然明白理解用户意图很重要，落到怎么做，还在照猫画虎的阶段，不太明白在新的生态位上，自己应该给出哪些独特的理解能力。从这个角度看，商家的第一份功课不是搭一个对话框，而是把自己的差异化，翻译成智能体能读懂的语言。 理解走得更远一步的是丰巢。它直接在阿宝里做起了洗护业务，寄件地和取件地可以分开，还延伸出到家保洁、存包和即时零售，围绕「15 分钟生活需求圈」和「对话即服务」重构自己的能力。丰巢已经理解了 AI 能读懂用户需求、可以围绕场景重做服务，但再往下，要把哪些服务原子化、要怎么打造自己智能体的意图，想赚钱的意图、想留存的意图，该以什么方式表达给这张网络，仍在早期摸索。 至于政务、文旅这类更严肃场景的服务商，对 AI 的商业化有了一定构思，但理解还停留在「做一个对话框、一个数字人形象」的层面，尚未把智能体当作一种新的服务方式来构想。他们表现出积极拥抱的态度，还没太明白接下来是一个什么样的时代。 事实上，拉开这些商家差距的，与其说是对 AI 的态度，不如说是各自的服务此前被数字化、被拆解到什么颗粒度。点单的交易结构最简单，所以跑得最快；丰巢的服务天然可拆，所以能够重组；政务和文旅的服务从来没被原子化过，所以只能先从一个对话框做起。 智能体化的速度，取决于你的服务有多少是机器已经能读懂的。 行业整体的位置也印证着这种早期感。千问在做 AI 点外卖，美团的小美接入了元宝，豆包、微信小微都在尝试，市场教育确实铺开了，但到目前为止，没有任何一家公开过 AI 渠道的订单量、复购率或履约成功率。供给侧靠补贴进场，需求侧靠优惠券撬动，两头都还是「付费演习」。判断爆发是否到来的信号，不是接入商家的数量，而是第一个不靠补贴的案例什么时候出现。 更重要的是，我们发现从点击产品到表达意图，最关键的还有用户愿不愿意开口。所有人都在假设意图早已存在、只是没有转换，但对话是一种比点击更高成本的交互，GUI 用二十年把人训练成了「选择者」，智能体要把人改回「表达者」。王翼飞说用户的表达习惯「需要一起来养」，这个养的过程，6 到 12 个月未必够。 用户的需求一直都在，变的是表达需求的方式，和理解需求的能力。 &nbsp;支付宝已经把自己的思路完整摆了出来，接下来的 6 到 12 个月，是市场验证它的时间，也是所有玩家重新寻找位置的窗口期。 &nbsp;\", \"published\": \"Thu, 20 Aug 2026 11:26:08 +0800\", \"source\": \"极客公园\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"ai_tools\", \"level\": \"A\", \"why\": \"智能体商业化趋势影响AI工具变现模式\", \"action\": \"研究支付宝智能体生态接入方式\", \"opportunity\": \"开发智能体插件赚取分成\", \"risk\": \"平台规则变化快\"}, {\"title\": \"黑鲸鱼 DeepSeek Harness，从「赛博乐高」变成 Agent Store\", \"link\": \"http://www.geekpark.net/news/369003\", \"summary\": \"嘲讽与反转，是属于 DSH 同一个架构的因果两端。 作者｜ 张勇毅 编辑｜ 靖宇 &nbsp; 8 月 14 日上午， DeepSeek Harness 上线 GitHub 还不到十二小时 ，项目 GitHub Star 就突破了 5 万。跻身 GitHub 史上最速达成记录之列。 极客公园曾在首发实测总结它的「一切皆插件」的概念是，「Agent 界的 Android」，但这个评价的另一面，是当时社区围绕 DeepSeek Harness（下文简称 DSH）的巨大争议：「对非开发者不是很友好」与「毛边随处可见」是不少第一时间体验之后的评论；还有一些第三方测显示同样跑 V4 Flash，DSH 比别家 harness 多烧三倍 token。 但五天之后，DSH 在社交媒体平台上已经经历了一轮完整的「口碑反转」：不仅 GitHub 达到了 14.9 万星，1.5 万个 fork。「赛博乐高」的概念也已经被社区所接受，已经累积起了超过 5100 个插件与超过 3500 位作者。 DeepSeek Harness 开源第五天的 GitHub 仓库页，星标 14.9 万、fork 1.5 万｜图片来源：GitHub &nbsp; 乍一看，这是一次寻常的口碑回暖 &mdash;&mdash; 东西还行，用的人多了，风向自己会转。 但我觉得其实真正的原因，还得是 DSH 这个看起来非常工程师文化的「一切皆插件」概念，以及由此延伸出的更具想象力的使用方式： Harness 可以更加开箱即用，直接交付满足千人千面用户需求的 Agent &nbsp; 01 口碑反转靠社区 &nbsp; DSH 的口碑反转，其实从一开始就有迹可循：发布后的第二天夜里，一个名为 anywhere-labs 的团队把官方版本打包成了开箱即用的桌面应用。不用装 Node，不用敲命令行，服务自动拉起，插件能力和 Web 界面全保留。这个项目在两天内就收获了超过 4700 Star。 社区做的 DSH 桌面版，简介写着「万物皆『插件』，桌面本身也是『插件』」｜图片来源：GitHub &nbsp; 由于原本 webUI 以及代码部署的方式，对非代码用户来讲确实不够友好，因此不少人也立即投入了「为 DSH 造壳」的竞赛中：有开发者用 Tauri 重做一版安装包仅有 100MB 的版本；又有人用 Python 加 pywebview 压到更加离谱的 18MB。 8 月 16 日，有人发现 DeepSeek 把自家工程团队每天在用的十来个 Skill 也一并放了出来：有按仓库自己的标准做 code review 的，有专门抓过度设计和死代码的，还有清理文档里残留思维链的。 仓库 .agents/skills 目录下的十来个内部工程 Skill，从 code review 到文档规范｜图片来源：GitHub &nbsp; 有开发者评价到：资深工程师脑子里那些说不出口的经验，第一次变成了可以执行、可以复用、可以审计的「Skill」。 这个剧本其实我们也并不陌生：Stable Diffusion 刚出来那阵，所有人都在折腾 Python 环境和 CUDA，后来 AUTOMATIC1111 和 ComfyUI 来了，整合包来了，真正把它送到普通人手里的，还得是枝繁叶茂的第三方开发生态；Skill 能快速出圈也是同理。 毕竟大家虽然都喜欢当极客，但真的没人喜欢吃苦，大家都是来偷懒的。 这也是为什么这两天，你能在各种社交平台上看到无数网友根据自己喜好，发布的各种「DSH 十大插件榜」；这些榜单的前三名，往往是类似改前端 UI 的 dsh-web-ui，以及给纯文本模型装上眼睛的 modlens，还有把侧边栏改成完整的 IDE ；当然还有从 Claude Code 和 Cursor 搬家过来的迁移工具。 原本 DSH 相比其他 Harness 产品的明显劣势：界面丑、不能读图、没有 IDE 形态、没有 TUI、搬家麻烦。五天之内，已经全部被社区给填上了坑。如今已经迅速长成了有着超过 5100 个插件、超过 3500 位作者的庞大生态。 在旧的 Harness 开发生态中，「界面丑」「不能读图」是只有官方才有资格修复的缺陷。你提 issue，然后等。在这里，它变成了一道社区四十八小时就交卷的题。 产品没做完，头一回成了一个可以外包给社区的问题。甚至某种程度上成为了如今 DSH 的一项优势。 所有关于 DeepSeek Harness 的嘲讽和反转，其实本质上是同一个架构的因果两端。正因为它把自己拆得够碎，才既显得「毛坯房」，又能被社区在五天里快速补完。 &nbsp; 02 从赛博乐高到「 Agent &nbsp;广场」 &nbsp; 虽然「一切皆插件」是 DSH 的核心概念，但在此之前并不是一个大家广泛熟悉的认知。 要紧的是架构文档里的另一句话：没有可打补丁的特权内核。想扩展它，不是改源码，是在旁边挂一个插件；插件卸载时，在运行时里注册过的东西全部回滚 &mdash;&mdash; 就像拼乐高一样，你很难说其中哪块积木真的就是那个 「主心骨」。 官方架构文档原文：没有可打补丁的特权内核，扩展方式是在旁边挂一个插件｜图片来源：GitHub &nbsp; 对照着看，非开源的 Claude Code 给用户开放了四个接口：MCP、插件、Skill、Hook，外加七档权限。口子做得很成熟，但开在哪，始终是 Claude 官方说了算。 DeepSeek Harness 则完全没有这个中心。模型适配器、工具注册表、文件系统、沙箱、终端、任务调度，全在同一层，全能换&mdash;&mdash;连 agent 的主循环本身都是插件。 它只咬死一样东西：日志 。 模型看见过什么，就必须记下什么，任何进入模型请求的内容，都要能从日志里重建出来。 这套逻辑推到尽头，是一个极具试验性的「赛博乐高」概念：Agent 可以检查自己正在运行的插件树， 甚至现场给自己挂一个临时插件，用完再拆掉。 虽然目前这个权限默认没有打开，还要从源码构建才碰得到；挂进去的代码权限和 Bash 一样大，插件也只活在当前进程里。但 DeepSeek 已经将方向展示给了整个行业 &mdash;&mdash; 连「给自己加插件」这件事本身，也可以一个插件。 当社区逐渐接受这个概念后，就迅速在此基础上衍生出了另一个新概念「Preset 预设」：简单来讲就是一种基于 DeepSeek Harness 现有这套「赛博乐高」架构，直接分发 Agent 的模式。 基于预设概念延伸出的 DeepSeek Harness Agent 市场｜图片来源 DSH Desktop &nbsp; 区别于我们已经熟悉的 Skill，Preset 可以同时在 DSH 中整合不同插件，组装起同时包括 Skill、网页浏览/搜索、文件生成、上下文策略等几乎所有 Agent 能力，并一键将其交付出去。 换言之，预设交付给用户的，其实是一个完整的 Agent 能力。社区中甚至已经出现了专用于分发 Preset 的网站，用于一键部署对应的科研 Agent、视频制作 Agent 等预设。 直接交付 Agent 对 Harness 产品来讲仍然是颠覆性改变｜图片来源：DSHDesktop &nbsp; 另一层让 DSH 插件生态快速蓬勃发展的因素，是开源本身，你可以从源码本身看清整个系统架构中，事实归谁所有、权限卡在哪道闸、什么要落成持久记录、模型能看到哪部分、坏了怎么恢复。整套架构会成为未来所有想要借鉴 DSH 经验的 Harness 团队的基石。 这套交付模式显然比起「赛博乐高」要更加适合所有人，不少行业大牛立即意识到其中的潜力所在；曾写出 Flask 框架的 Armin Ronacher 如今在带队做 Pi，发布次日下午，他就在 X 上公开表态：DeepSeek Harness 并不完美，「但这确实是我头一回看到这个领域里的新东西，被触动到想重新审视我们自己的一些选择。开源的这一面，我太喜欢了」。 竞品 Pi 的掌舵者、Flask 之父 Armin Ronacher 的公开表态｜图片来源：X @mitsuhiko &nbsp; 五天时间里，社区把智谱 GLM、月之暗面 Kimi、Qwen、Claude、Gemini 全接了进来。有个视觉识别插件支持十五家以上的供应商，从阿里、智谱一路排到腾讯混元和火山豆包。 智谱、Kimi、Qwen、混元、豆包，全在 DeepSeek 的架子上｜图片来源：GitHub 虽然 V4 Pro 至今不支持多模态，但社区也没等 DeepSeek 补 &mdash;&mdash; 大家直接用插件把图像任务路由给智谱和阿里的模型，文本继续留在 DeepSeek 手里。 甚至已经有人，把 DeepSeek Harness 塞进 Claude Code 和 Codex 里，当一个真正的子 agent 用 &mdash;&mdash; 自带工具集和沙箱工作区，不是转发一次 API 调用；也有插件反着来，让 DeepSeek Harness 把活派给 Codex 和 Claude，还能续上之前的线程。 Harness 这一层，正在从各家的护城河逐渐「管道化」。 谁的模型在里面跑、谁给谁打下手，如今都变成了配置文件里的一行。 公平地讲，DeepSeek Harness 发布当天晚上的头十二个小时，社区里各种关于它的吐槽声音，其实都都没错。 它就是毛糙，就是没管非程序员的死活。但或许「没打算做完」一开始就是 DeepSeek 想要在自家 Harness 尝试中，想要交付出的核心产品 &mdash;&mdash; 把最该攥在手里的那一层拆开、摊平、公开，让所有人踩上去，甚至包括对手。 这个构想与所有爆款项目指标都无关，它很大程度上代表了 DeepSeek 对于 Harness 这类产品的一个更宏大的构想： Harness 本身不应该是产品，Agent 才是 。 *头图来源： DeepSeekHarness 本文为极客公园原创文章，转载请联系极客君微信 geekparkGO 极客一问 你更看好哪种做法： 官方把产品做完， 还是只定规矩、把剩下的交给所有人？ &nbsp;\", \"published\": \"Wed, 19 Aug 2026 10:33:05 +0800\", \"source\": \"极客公园\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"ai_tools\", \"level\": \"S\", \"why\": \"DSH插件生态爆发，直接提供工具开发机会\", \"action\": \"下载DSH并开发垂直插件\", \"opportunity\": \"上架插件赚取收入\", \"risk\": \"竞争激烈，需快速迭代\"}, {\"title\": \"TikTok带货博主卷疯快递：三天，从深圳到伦敦\", \"link\": \"http://www.geekpark.net/news/368962\", \"summary\": \"&nbsp; 今年6月26日，英国气温飙到了36摄氏度，创下十多年来的纪录。 26万台小电风扇，从中国出发，在不到两周的时间里涌进了欧洲人的家门。不少英国人从下单到收货，只用了两天半。 放在五年前，跨境卖家根本不敢想象这么快。而现在，这不得不成为&ldquo;基础&rdquo;。 8月5日，菜鸟集团正式发布\\\"全球三日达\\\"，在中国至欧洲、泛欧国家间、中东国家间等15条核心线路上，实现3个自然日门到门送达。0.5公斤欧洲小包，单票物流费只有标准国际快递的一半。 这是继2020年&ldquo;全球十日达&rdquo;和2023年&ldquo;全球五日达&rdquo;之后，跨境物流速度的又一次飞跃。 快递速度飞跃的背后，是跨境电商正在经历的一场深层变革。变革的源头，是以TikTok为代表的内容电商的崛起。 TikTok等内容平台上，一条爆款视频，可能只需要几个小时，就能卖掉几万件商品。一场直播带来的订单，可能在几个小时内突破过去一个月的销量；一个网红推荐的小风扇，可能在欧洲高温天气里瞬间成为爆款。流量来得越来越快，消费者的耐心却越来越短。 如今，对于跨境卖家来说，真正的挑战不仅是&ldquo;卖出去&rdquo;，更是&mdash;&mdash;消费者下单之后，能不能在他们失去兴趣之前收到货。 &nbsp; 内容电商的流量是&ldquo;脉冲式&rdquo;的 过去几年，跨境电商的生态被一个变量彻底改写：内容电商。 数据显示，2026年上半年，TikTok Shop全球商品交易总额突破503亿美元，同比增长92%；美国市场直播电商增长尤为迅猛，年中大促期间较去年同期增长超过225%。 内容电商和传统电商的增长模式完全不同。 传统货架电商的流量是相对平稳的，而内容电商的流量特征是&ldquo;脉冲式&rdquo;的&mdash;&mdash;一条突如其来的爆款短视频、一场知名达人的爆单直播，往往能在短短数小时内拉爆成千上万笔订单。 这种脉冲式增长给后端物流带来的压力，是传统跨境物流体系难以承受的。 一位跨境卖家分享了一个真实感受：&ldquo;以前通过大规模、低售价拿大单的方案已经行不通了，平台成本越来越高，合规成本越来越高，履约成本越来越高。大家普遍感受到一个点：单做了很多，但不一定赚到钱。&rdquo; 原因在于， 内容电商的消费者是&ldquo;冲动型消费&rdquo;。他们在刷视频时被种草、下单，期待的是即时满足。如果物流时效跟不上，退款和差评就会接踵而至。 &ldquo;平台上说五天，我们做到三天，产品比别人好，就能拿到单。你跟他说五天，他收到货十五天，母亲节过了，我妈还没收到礼物，那不行。&rdquo; 菜鸟集团跨境物流欧洲负责人李硕也观察到这一趋势：&ldquo;过去高价值产品一般都是本地海外仓发货，跨境的产品货值一般比较低。 但我们现在越来越多看到高货值的产品通过跨境的方式运到海外消费者手里。 &rdquo; 高货值产品意味着更高的客单价和更高的退货风险&mdash;&mdash;一旦时效跟不上，损失的不只是运费，还有品牌口碑。 内容电商的兴起，让跨境时效的期待&ldquo;从按周计算，再到按天、以小时计算&rdquo;。海外消费者在变，他们对时效的容忍度在急剧收窄。 菜鸟集团高级副总裁熊伟表示：&ldquo;疫情期间，消费者觉得两周能到就能买。大概三年时间，我们和商家一起努力，一周时间确定性送达就能激发很大销售增量。最近，消费者的需求已经按天在提速。&rdquo; 这种变化，倒逼物流侧做出根本性的响应。 &nbsp; 全球三日达，将带来更多&ldquo;中国直发&rdquo; &ldquo;全球三日达&rdquo;的快递服务，正是在这个背景下诞生的。 菜鸟集团跨境物流欧洲负责人李硕透露了一个细节：&ldquo;大概两年多以前，我们推出了晚必赔六日达的明星产品，觉得这个产品很牛。但拜访客户时，一次又一次被问：能不能更快一点？能不能到四天、五天？&rdquo; 客户持续追问的背后，是商家对时效价值的重新认知&mdash;&mdash; 时效不再只是一个履约参数，而是影响消费者选择、商家经营效率和行业竞争格局的关键变量。 李硕解释：&ldquo;过往卖家把货铺在全球各地，面临资金积压和库存周转风险，货物若无法卖出，在海外处理也是难题。&rdquo; 而物流速度的提升， 意味着卖家可以国内直发、按需补货，卖得好隔天就追单，周转更快、现金流更健康。新品也不必再&ldquo;赌一把&rdquo;，小批量试销跑通了再放量。 跨境卖家杨总在发布会上分享了一个真实案例：今年6月26日，英国气温飙升至36摄氏度，创下十多年来的纪录。 小风扇的需求瞬间井喷。通过菜鸟的72小时网络，两周内将26万台小风扇从中国发往欧洲消费者手中，三日达时效达成率超过90%，不少消费者两天半就收到了商品。&ldquo;太极端了，两天就送达了。&rdquo;杨总说，&ldquo;买家留下好评，记住了我们的店，以后需要什么都会来找我们。这就是被信任的感觉。&rdquo; 这种信任，就是品牌的价值。 &nbsp; 先从深圳、香港开始 而做到这一点，需要一张足够厚的物流网络。 菜鸟集团高级副总裁熊伟介绍，&ldquo;整个华南地区， 深圳和大湾区是跨境电商最活跃的区域，我们有超过一半的业务来自华南和大湾区。 &rdquo; 超过半数的跨境包裹从这里出发，飞向全球消费者。而香港，则是这条链路中不可替代的咽喉。 国泰航空货运销售总监游翊乾列出一组数据，来勾勒出香港的独特价值：&ldquo;从香港出发，飞行时间五个小时以内，我们可以覆盖全球50%的人口，十个小时以内，我们可以覆盖全球70%的人口，如果再加上13小时以内，我们可以覆盖全球80%到90%的人口。&rdquo; 菜鸟的全球三日达，正是从深圳和香港&ldquo;始发&rdquo;。 熊伟明确表示： &ldquo;今天我们首先立足于整个深圳、香港出发的产品，做到全球72小时。&rdquo; 具体来看，中国至欧洲的三日达产品，就是从香港eHub出发，通过菜鸟自建的香港枢纽分拨，装上国泰等航司的货机，直飞欧洲各大口岸。 游翊乾透露，国泰集团在香港及大湾区是最大的货运航空公司，拥有超过100个航点，每周从香港出发的航班接近1700个，其中飞往欧洲的航班每周35班直飞伦敦，&ldquo;差不多占我们整个欧洲的一半，英国是我们最主要的市场。&rdquo; 不仅如此，国泰还在持续扩充运力。游翊乾介绍，国泰已订购105架新飞机，包括32架A320、30架A330-900、35架777-9，以及8架A350F货机。这些新增运力，将直接服务于跨境电商物流需求。 从数据上看，大湾区的战略地位只会越来越重&mdash;&mdash;超过一半的业务来自这里、40%的全国跨境货源从这里出发、全球最繁忙的货运机场在这里、覆盖全球90%人口的航空网络从这里展开。 全球三日达的首条线路选择从深圳和香港出发，是地理禀赋、产业集聚和长期投入共同决定的必然。 &nbsp; 十年，跨境电商的三次跃迁 回顾过去十年跨境电商的演变，可以看到一条清晰的脉络。 十年前，跨境物流的基本盘是&ldquo;能送到就不错&rdquo;。熊伟回忆，2013年他刚加入菜鸟时，公司的愿景是&ldquo;用技术手段实现国内24小时达、全球72小时达&rdquo;。 当时这两个目标&ldquo;非常非常遥不可及&rdquo;。海外消费者能接受两周送达就算不错，海外基建几乎是一张白纸。那时候的跨境电商，核心逻辑是&ldquo;有货就能卖&rdquo;&mdash;&mdash;靠供应链的成本优势铺向全球。 变化在2020年前后开始加速。疫情带来的线上消费爆发，让海外电商渗透率从10%左右上升到了20%以上。 2020年，菜鸟率先推出&ldquo;全球十日达&rdquo;，承诺十个工作日送达、晚到必赔。&ldquo;当时十个工作日正好两周，很快十个工作日提升到十个自然日。&rdquo;这个产品直接盘活了跨境销售增量。 2023年，&ldquo;全球五日达&rdquo;推出。到2025年9月，该产品已覆盖越南、匈牙利、新加坡、卡塔尔、菲律宾及奥地利等欧亚核心国家。 2026年8月，&ldquo;全球三日达&rdquo;正式落地。从十日达到五日达再到三日达，与之同步的，是跨境电商本身的商业逻辑在变。 平台端，考核重心从流量规模转向履约体验。卖家端，从&ldquo;低价冲量&rdquo;转向品牌化运营。消费者端，从&ldquo;能买到就行&rdquo;转向&ldquo;体验要好&rdquo;，送达时间成为仅次于价格的核心决策因素。 据第三方行业研究，全球约46%的跨境网购者曾因&ldquo;配送时间过长&rdquo;而放弃下单。 三个变化彼此咬合、相互催化。内容电商的崛起放大了消费者对时效的敏感度，平台对履约的考核倒逼卖家提升物流标准，而物流的提速又反过来解锁了更多品类&mdash;&mdash; 过去只能卖100克以下的数据线，现在开始卖智能穿戴、潮玩、甚至高货值的智能硬件 。 越来越多的中国高科技、高客单价、高品牌价值的产品，开始进入全球。 全球三日达只是这个变化的一个注脚&mdash;&mdash;物流越来越快的背后，跨境电商的竞争，已经进入了一个全新的阶段。 &nbsp; &nbsp; &nbsp; &nbsp;\", \"published\": \"Tue, 18 Aug 2026 13:56:14 +0800\", \"source\": \"极客公园\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"short_drama\", \"level\": \"A\", \"why\": \"物流提速降低短剧出海履约成本\", \"action\": \"评估菜鸟全球三日达对短剧实物周边影响\", \"opportunity\": \"结合短剧推广实物商品\", \"risk\": \"物流成本仍需核算\"}, {\"title\": \"从「拍得到」到「拍得成」：大疆如何重塑全景影像天花板\", \"link\": \"http://www.geekpark.net/news/368932\", \"summary\": \"在天上，为全景影像打下地基。 作者｜张勇毅 编辑｜郑玄 即使你不怎么关注摩托车，今年你大概也刷到过张雪机车的故事：一支成立不到两年的中国车队，第一次征战世界超级摩托车锦标赛，今年 3 月底就在葡萄牙波尔蒂芒以近 4 秒的优势拿下队史首冠，周末连下两回合；到 6 月中旬，赛季第六冠已经到手。 比成绩更有戏剧性的是这支车队的来路。创始人张雪 14 岁在湖南山村骑上摩托，辍学进修理铺当学徒，20 岁左右就能闭着眼组装发动机；如今征战世界赛场的那台 820RR-RS，用的是自研的 819cc 直列三缸发动机，车架和电控全部国产。一个修车学徒，把「自己造」这件事做到了世界冠军的领奖台上。 7 月 23 日，大疆在重庆&mdash;&mdash;也是张雪机车的大本营&mdash;&mdash;办了一场全景技术分享会。这支团队出现在讲台上，讲的却是一个和赛场无关的细节：对机车内容团队来说，最痛的从来不是画质差一点，而是没拍到。 骑行中很难确认构图，回去才发现角度不对，几十公里的山路就得重新跑一遍；赛场和练习里的高光更不讲情面，错过就真的错过了。 机车、滑雪和户外这些彼此不相干的场景，其实共享同两条核心需求：解放双手，以及无死角记录。传统形态的相机很难同时满足，而这两件事恰好都是全景相机的最长板：先把所有方向记录下来，再决定镜头看向哪里。 我自己在日常骑行时，就注意到一个细节：不少外卖骑手不会用特别贵的手机，却会专门购置一台全景相机顶在头盔上，当行车记录仪用。这些看似「边缘」、又难以在传统相机上实现的需求汇聚起来，撑起了手持全景相机的市场。 在大疆的手持产品线里，Osmo 360 系列也因此是最特立独行的一支：它不像 Pocket 和 Action 那样在既有品类里做覆盖，而是为传统平面影像拍不到的场景而生。也正是因为如此独特的行业定位，「自己造」这件事在 Osmo 360 上体现的同样明显。 8 月 13 日晚八点，大疆发布了 Osmo 360 II。 单看名字，会觉得这是一次寻常的年度迭代。但把 Osmo 360、Avata 360 和 Osmo 360 II 放在一起看，会看到一条比新品迭代更长的路径：三代技术同源，每一代都落在一个此前没人解决的问题上。大疆在按自己的节奏，一层层抬高全景影像的上限。 Osmo 360 II｜图片来源：极客公园 01 从天空到技术 &nbsp; 在全景相机市场，如果只看发布时间，大疆是不折不扣的「新手」：初代 Osmo 360 直到 2025 年 7 月才亮相。但从能力积累看，它的准备要早得多。从 2014 年悟 Inspire 1 和如影初代算起，大疆在手持影像上已经探索了十二年。 无人机为了避障和航拍，很早就用上鱼眼镜头，也必须把多镜头画面校正畸变、无缝拼接成完整视野。高空光线剧烈变化、视差大、机身持续运动，恰好是拼接算法最难的工况。 测绘和三维重建业务又让大疆握有毫米级的空间理解能力；Ronin 系列专业稳定器把云台增稳做到了拿奥斯卡科学与技术奖的程度；Action 系列运动相机多代迭代，补齐了高速运动画质、散热和户外场景耐磨损等经验。 大疆 Mavic 3E 古建筑测绘、Action 6 运动相机 | 图片来源：大疆 全景相机需要的关键技术，大疆此前已经在不同产品线上分别验证过一遍。全景影像的技术地基，是在天上打下的。 但当时整个全景行业的地基，是从手机行业借来的。大疆的产品经理在那场分享会上算过一笔账：当时市面上几乎所有全景相机，都是沿用为手机设计的 4:3 矩形传感器，全景成像只用得到中间的内接圆，两侧近 25% 的面积白白消耗着体积和功耗。 影像能力同样是借的。手机平台 4K/120fps 的吞吐上限，换算过来就是 8K/30fps。全景相机那个「奇怪」的 5.7K 主流规格，正是矩形传感器 3K 的高度和手机芯片的吞吐共同框定的天花板。多年来，没有人真正去动它。 Osmo 360 起手打出的「王炸」，就是把这块天花板拆了。它从鱼眼镜头形成的圆形像场出发，重头研发一颗 1/1.1 英寸方形 CMOS：裁掉矩形传感器两侧的无效区域，再把高度方向的像素从 3K 重新切割成 4K，两颗镜头各出 4K，无需任何上采样，拼出原生 8K。按大疆在闭门会上给出的口径，这颗方形传感器的有效成像面积比行业当时最大的 1/1.3 英寸方案大 64%，单像素尺寸大 4 倍。 方形传感器成像及原生 8K 原理 | 图片来源：大疆 这颗传感器的难度不在「想到」，而在「做到」。立项时市面上没有现成方案，大疆与厂商组建联合研发团队，历经两年多个版本迭代才交付；方形构型没有先例，量产良率是硬仗，研发团队一度驻扎在产线上，和一线工人一起磨。 影像平台是另一个更大的赌注：彼时业界所有影像方案只承诺 8K/30fps，一代是抱着「可能就卡在 30 帧」的心理立项的，最后靠超频和压力测试，才在发布前把 8K/50fps 压榨出来。 这套做法，和行业惯常的「攒相机」是两种路线。攒相机是采购现成器件，再用算法尽量补足；大疆做的是从全景的真实需求反推底层硬件。技术不是目标，用户需求才是。 方形 CMOS 抬高的是成像效率的上限。而它此后被行业陆续跟进，包括深耕全景多年的资深厂商，等于市场替这条路线补投了一票。 02 从成像到出片 &nbsp; 第二次落点回到了天上。Avata 360，一台全景无人机。 手持拍摄时，人会本能地把镜头对准想拍的东西，把拼接缝留在不重要的方向。飞行拍摄没有这个余地：机身镜头一朝上一朝下，无论飞手怎么操控、后期怎么重新取景，拼接缝始终在画面里，观众对它近乎零容忍。 高速穿越门窗、洞口和近景障碍时，任何一次视差判断失误，都会变成肉眼可见的错位和形变。飞行场景由此成了全景算法的「风洞」：空间理解、运动估计、近景还原、拼接稳定性，全部要在极限工况下过一遍筛子。 这座风洞还顺带改变了研发方式：过去全景相机研发采集全景测试素材，要靠工程师举着相机在外面时快时慢地跑；有了 Avata 360，不同速度下的海量空间数据可以成批采集，直接喂给拼接算法做标定和训练。 Avata 360 突破的，是极端运动中的算法上限。在飞行强度下跑通的拼接方案，等于替地面上的摩托、滑雪和骑行提前备好了答案。 Avata 360 镜头一朝上一朝下｜图片来源：大疆 到了 Osmo 360 II，传感器、算法、工作流这三条各自成熟的技术线，第一次汇到同一颗影像平台上，并被同时用满。 大疆手持影像负责人在与极客公园的访谈里，把两代产品讲成一个「分两步走」的规划：一代解决镜头和传感器，二代补齐整条影像链路。二代的硬件从设计之初就奔着 8K/60fps 去，来获得更加原生的高帧率体验。 这多出来的 10 帧看似只是一个小差距，但在行业里其实无人接手：对手机来说，4K/120fps 已经到顶，额外做 8K/60fps 要付出很大的面积代价，投入产出不划算。大疆全景相机产品经理舒修给出的回答是：「如果大疆不去做，可能业内少有厂商会往这个方向走。」 10 帧的意义，要放到播放端才看得清；手机和电脑屏幕几乎都是 60Hz 或其倍数的刷新率，50fps 的素材播放时每 5 帧要补 1 帧，形成间歇性的顿挫。移动设备里的高刷屏普及后，人眼早被训练得对这种卡顿极其敏感。60 帧对 50 帧，补上的不是参数表上的一格，而是「看起来顺不顺」本身。 14.5 级动态范围是另一场拉锯。这颗传感器的 DCG 技术上限是 13.5 级；一代为了拼接容易，前后镜头用同一套曝光参数，二代改成前后独立曝光，才有机会把动态范围往上推。 但曝光差拉得越大，画面重叠区域的亮度和色彩就越难接上。舒修说，14.5 不是随便定的数&mdash;&mdash;「不是 15、16、17」，而是动态范围和拼接可融合之间反复权衡后的平衡点。发布前一个月，这个数字还卡在 14 出头，又迭代了很多轮才做到。 Osmo 360 II 拍摄样张 | 图源：大疆 多出来的是 10 帧和 1 级动态范围，被重新设计的是整条链路：传感器读出、带宽吞吐、降噪、散热、存储，一环都躲不掉。散热是最直观的例子。按舒修的说法，一代拍 8K/50fps 录半小时会过热，二代规格更高，均热材料全面升级后，在室内反而能一直录下去。 把这些数字放回行业坐标系：Osmo 360 之前，全景相机的主流规格是 5.7K，动态范围的普遍上限是 13.5 级；Osmo 360 II 给出的是原生 8K/60fps 和 14.5 级。这不是某个单项的领先，而是传感器、芯片、算法各自领先叠出来的差距。跟进者可以很快追齐某个参数，却很难同时追齐一条链路。 大疆 Osmo 360 II | 图源：大疆 不过，这一代真正面向普通人的变化，不在参数表里。 大疆全景相机团队在调研访谈了大量用户后，发现一个略显残酷的规律：社交媒体出片的内容里，八九成都是人物相关。但现实情况往往却是，家里的「摄影担当」出门玩一圈，回来发现拍的全是别人和风景，发朋友圈时才发现就差一个自己；一个人旅行更是如此。 而全景相机最重要的概念「全景拍摄」，恰恰是解决这个问题的完美答案：拍一次，就能完整记录人和现场的关系。 但这也带来了新的问题，使用全景相机「盲拍」的时候确实很爽，但在后期构图、找人、选视角的工作量却大大增加，剪一条片子动辄半小时起步。 主角跟随，就是给这个问题的答案。拍摄时相机自动锁定主角、记录视角信息，后期打开 App，自拍视角已经预先构图完毕，完整的 360&deg; 画面同时保留。跟随功能本身在行业里并不新鲜，大疆押的是「确定性」：先把用户最常用的自拍视角稳稳保住，剩下一两成想换视角的片段，再去自由取景。 软件的两端，也都在把这种「确定性」做厚。手机端的 DJI Mimo 新增了音频高光：靠识别笑声、欢呼和人声，自动标记出值得留下的时刻；精选时刻和一键成片再把这些片段挑出来、配上音乐，直接出片。 电脑端的 DJI Studio 则加入了多视角预览剪辑，几路视角摆在一起边看边切，一个人就能剪出导播台的效果。多维度美颜也做得很细，从肤质到五官都能精细调节，完成度不输专业修图 App 的付费版。 电脑端 DJI Studio 多视角预览剪辑 | 图源：大疆 配合 NFC 一碰即连、105GB 内置存储和用户可自行更换的镜片，这台相机想做的，是把全景的门槛压到「掏出来就能拍，拍完就能用」。与其说它在把相机变聪明，不如说它在教大家怎么用全景。 至此，三代技术在这里完成闭环：Osmo 360 抬高了成像效率的上限，Avata 360 抬高了极端运动中的算法上限，Osmo 360 II 让成像、算法、工作流汇流，抬高的是整个系统和成片的上限。 03 结语 &nbsp; 回看全景影像的发展，上半场解决的是拍得全、拍得稳、拍得清；下半场，竞争焦点正从单项参数转向体系能力：镜头、影像平台、算法、散热、软件，能不能组成一条完整链路。 这个产品逻辑看似简单，但已经在悄然改变全景相机市场格局：在 Osmo 360 II 发布 4 小时后，已拿下京东、天猫、抖音三大平台新品相关榜单 TOP1。 循着三代技术的演进路线，大疆手持影像的产品逻辑其实很清晰。无人机的拼接、测绘的空间理解、云台的增稳、运动相机的散热，这些看似与全景无关的研发储备，让它可以在全景这个最合适的形态上，从容地把每一项能力调出来用。 大疆全景相机产品团队分享的一个参照，是用户推荐值这个数据：Pocket 一代二代时只有 30% 出头，把槽点解决完的 Pocket 3 直接冲到 60% 以上；大疆在全景相机上的产品逻辑亦是如此，集中攻画质和易用这两个根本问题，只有槽点解决完，这个品类才有爆发的可能。 这更像一份产品经理眼中的路线图：全景相机离「像顺手拿起一台运动相机那样自然」还有距离，而缩短这段距离的方法，大疆已经用三代技术演示了一遍。 大疆 Osmo 360 II | 图源：大疆 张雪机车团队在那场闭门会的结尾说，全景相机给他们最大的安全感，是每一次出发，都更有把握把故事带回来。 对骑几十公里山路的人是如此，对每一个不想在自己的故事里缺席的普通人，也是如此。 *头图来源：大疆 本文为极客公园原创文章，转载请联系极客君微信 geekparkGO 极客一问 你会为「不漏拍」买一台全景相机吗？ &nbsp;\", \"published\": \"Tue, 18 Aug 2026 09:15:00 +0800\", \"source\": \"极客公园\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"other\", \"level\": \"B\", \"why\": \"全景相机技术趋势，与短剧出海无直接关联\", \"action\": \"无需行动\", \"opportunity\": \"无\", \"risk\": \"无\"}, {\"title\": \"问界「童车」上市，华为联合设计；DeepSeek 涨价策略今日实行；大学生用 AI 人脸视频盗刷 5 万元被判刑\", \"link\": \"http://www.geekpark.net/news/368859\", \"summary\": \"IPO 前 Anthropic CEO 达里奥 &middot; 阿莫迪罕见发长文回应质疑，预告未来 5-10 年 AI 将治愈多数疾病 Anthropic CEO 达里奥 &middot; 阿莫迪（Dario Amodei）几乎从不碰社交媒体。但就在 IPO 估值被推到 2 万亿美元的节骨眼上，他罕见地发了一篇长文，正面回应 Anthropic 如何看待监管。 长文中，达里奥 &middot; 阿莫迪回「我们设计的每一条政策，都让前沿公司承担更多成本，同时有利于规模更小的竞争者。」他同样支持 Demis Hassabis 提出的、建立一个 类似 FINRA（美国金融业监管局）的 AI 监管机构 的想法。 他认为，如果能够制定正确的「游戏规则」，完全有可能同时做到三件事： 1、应对 AI 在网络安全、生物安全以及对齐方面的风险； 2、通过制度约束前沿 AI 公司的权力； 3、为开放权重模型保留发展空间，同时针对它们特有的风险采取相应措施。 然后他话锋一转谈到 Anthropic 正全速加码生物医学 AI。 他的判断极其激进：未来 5-10 年，AI 将能治愈多数人类疾病。 他认为：到目前为止，对包括 Anthropic 在内的 AI 公司最准确、最有力的批评其实是： 我们还没有兑现那些关于「用 AI 造福世界」的宏大承诺。 唯一的解药不是喊口号，而是「 真能治好癌症，公众才会信任 AI 。」 Anthropic 正在迅速加大在生物学和医学领域的投入，我们希望在未来几年取得令人瞩目的成果，并在未来几个月内看到一些初步的曙光。（消息来源：新智元） Anthropic 营收暴涨 1400% 最新季度入账 115 亿美元 据彭博社报道，Claude 背后的 Anthropic，第二季度营收超过 115 亿美元，较去年同期的 7.87 亿美元暴涨逾 14 倍。 而与第一季度的 47.3 亿美元相比，其营收一个季度又增长了 143%。 报道还称，这是 Anthropic 第二季度的调整后营业利润首次转正。 也就是说，当大家还在担心 AI 的巨额资本开支何时才能兑现时，A 社在「某种程度上」已经开始赚钱了。 与此同时，就在此前两天，《金融时报》报道称，投资人正押注 Anthropic 以超过 2 万亿美元的估值冲刺 IPO。 除了第二季度营收暴涨，彭博社还透露了另一个关键数字：今年 5 月，Anthropic 的年化收入已经超过 470 亿美元。从 23 年开始到 25 年，就是每年近乎 10 倍的增速。而自去年年底到今年 5 月，仅仅五个月，Anthropic 的年化收入就从 90 亿美元冲到 470 亿美元，增加了整整 380 亿美元。（消息来源：量子位） &nbsp; DeepSeek API 峰谷定价方案今日生效，高峰时段价格翻倍 8 月 17 日消息，8 月 13 日，深度求索官方宣布将对 DeepSeek API 价格进行更新调整，采用峰谷定价，空闲时段价格为高峰时段价格的一半。今日起，该定价方案正式生效。 高峰时段为北京时间 9:00 - 12:00、14:00 - 18:00 。新价格于北京时间 2026 年 8 月 17 日 00:00 开始生效，具体如下： 筹备 IPO 之际，消息称 OpenAI 已解散旗下风险防范团队 8 月 17 日消息，据《金融时报》报道，OpenAI 已于上月末解散旗下风险防范团队。该团队的核心工作是评估公司模型是否存在重大风险，并制定风险缓解措施，比如模型失控入侵其他企业这类极端场景。报道称，相关职责现已按生物安全、网络安全等细分领域拆分，并入公司现有业务团队。（消息来源：IT 之家） 建模交易平台 CGTrader：AI 生成的 3D 模型数量激增，但销售额仅占 1% 8 月 17 日消息，随着「图生 3D 模型」AI 工具逐步流行，目前许多 3D 建模交易平台都遭到各种 AI 生成的 3D 模型「轰炸」，不过参考 CGTrader 报告显示，尽管此类 AI 内容正在平台上快速增加，但相关商品的实际销售情况却并未同步增长。 目前 CGTrader 平台约有六分之一的新上架商品由 AI 生成， 不过相应商品的销售表现却十分有限，其销售额仅占平台总销售额的 1% 左右 。 从 CGTrader 的调查结果来看， 质量正是买家拒绝 AI 生成商品的主要原因 。调查显示，只有约 5% 的买家对自己购买的 AI 生成资源感到满意，而整体用户中仅有 4% 认为 AI 生成内容「效果很好」。 这也意味着， 尽管 AI 生成的 3D 模型数量正在迅速增加，但供给增长并没有转化为相应的市场需求 。对于需要特定用途的 3D 资源而言，用户显然仍然更加关注模型的实际质量、可用性以及是否符合项目要求。（消息来源：IT 之家） &nbsp; 大学生用 AI 人脸伪造视频盗刷超 5 万元，最终获刑一年十个月 8 月 16 日，央视新闻披露一起 AI 人脸伪造视频盗刷案件。 大学生吴某在非法网站购买了一项「能将静态人脸照片转化为可通过某银行支付平台人脸识别验证的 AI 动态视频的技术」技术。 随后，吴某通过境外聊天软件加入黑灰产业群聊后，在群内发布接单信息，通过上线获取被害人姓名、身份证号码、手机号码、照片、支付平台验证码等信息。诈骗团伙通常冒充短视频平台客服或者游戏主播，以关闭自动扣费、赠送游戏装备为诱饵，诱导受害人下载控制软件，从而获取其个人信息。 吴某则再通过获取的手机号查看被害人是否在第三方平台进行注册，如有注册， 则把获取的被害人照片转换成 AI 动态人脸视频 。 视频制作完成后，吴某的团队会将被害人的支付密码重置，然后将被害人的付款码发送给「洗钱车队」。转移成功后，「洗钱车队」将盗取的资金按照一定的比例通过虚拟货币的形式返还给被告人。 在不到四个月的时间内， 三名被害人的银行账户先后被盗刷共计 5 万余元 。经过审理，湖南省长沙市雨花区人民法院综合考虑吴某具有自首情节，认罪悔罪表现及对被害人的经济赔偿等情况，最终判处吴某有期徒刑一年十个月，并处罚金 3000 元。目前，该案件判决已生效。（消息来源：IT 之家） 鸿蒙智行问界儿童车官宣即将上市：赛力斯、华为联合设计，网友戏称问界「M0.9」 8 月 16 日消息，鸿蒙智行问界汽车宣布， 问界儿童车即将上市 。据介绍，这款新车主打「成长陪伴，智趣探索」， 将延续家族经典外观 。 该车外观与问界旗舰车型&mdash;&mdash;问界 M9 极为相似， 有网友将其戏称为问界「M0.9」 。该车采用双座布局设计，配有标志性的大饼轮毂，同时前挡风玻璃上方还有一枚「激光雷达」（放大图片来看，这个部件内嵌有一枚摄像头）。 值得一提的是，预热海报显示， 问界儿童车由赛力斯汽车、华为联合设计 。 目前暂不知晓这款问界儿童车的上市时间，相关配置信息需待官方后续公布。 消息称英特尔计划推出入门级 Panther Lake 掌机芯片，配备 4 个 Xe3 核心 8 月 17 日消息，英特尔的掌机产品线可能即将迎来一款更便宜的小弟。 据爆料人士 Jaykihn 透露（这位爆料者此前曾多次准确曝光英特尔产品规格），英特尔似乎正在准备一款采用「4+0+4+4」架构布局的 Panther Lake 掌机芯片。这一配置意味着芯片拥有 4 个 P-Core 性能核心、0 个 E-Core 能效核心、4 个 LPE 低功耗核心以及 4 个 Xe3 图形核心。 相比之下，这一配置明显低于英特尔目前已经用于掌机的 Arc G3 和 Arc G3 Extreme 芯片。例如 MSI Claw 8 EX AI+ 搭载的就是这类芯片，其 CPU 采用 14 核设计，包括 2 个 P-Core、8 个 E-Core 和 4 个 LPE 核心，同时根据具体 SKU 配备 10 个或 12 个 Xe3 图形核心。 有意思的是，这套「4+0+4+4」配置其实并不是什么全新设计。它已经出现在 Panther Lake U 系列笔记本处理器中，例如 Core Ultra 7 355 和 Core Ultra 5 325，目前戴尔 XPS 14 和 XPS 16 等产品就搭载了相关芯片。因此，看起来英特尔或者某家 OEM 厂商可能只是将现有的笔记本芯片重新用于更低价的掌机产品线，而不是从头设计一款全新的掌机芯片。 目前还不清楚这款芯片用于掌机时的具体频率，不过参考 Ultra 7 355 在笔记本上的表现，大致可以推测它的性能水平。根据 Notebookcheck 的测试，在 Cinebench R20 中，Ultra 7 355 的单核性能大约是 Steam Deck OLED 所搭载 Zen 2 芯片的两倍，多核性能则接近后者的三倍。（消息来源：IT 之家） 斯坦福调查显示：84% 中国受访者对 AI 感到兴奋，美国比例仅为 38% 8 月 16 日消息，斯坦福大学发布的《AI Index 2026》报告显示，中国受访者对 AI 的态度明显比美国人积极。 数据显示，84% 的中国受访者表示对 AI 产品和服务感到兴奋，美国这一比例为 38%。另一项爱德曼信任度调查则显示，72% 的中国受访者表示信任 AI，美国仅为 32%。 在公众对政府监管 AI 的信任度上，美国以 31% 位居调查国家中最低。在公众与专家认知方面，73% 的 AI 专家预期 AI 对个人工作方式产生积极影响，而公众持此观点者仅 23%。在 AI 对经济和医疗的影响上，同样存在约 50 个百分点的认知差距。 彭博社指出，中美数据差异并不意味着中国民众看不到 AI 风险，也不代表美国人更少使用 AI，两国公众的主要差别在于对 AI 收益能否惠及自身，以及对科技企业是否「听政府话」的看法不同。 SurveyMonkey 2026 年第二季度调查显示，38% 的美国人已经每周或每天使用 AI，高于 2025 年第二季度的 30%；70% 的美国成年人表示曾经使用过 AI。不过，美国公众对 AI 的担忧并未因此消失。 美国公众近年来对 AI 的讨论，很大程度上集中在就业替代、虚假信息以及 AI 可能超越人类能力等问题上。中国同样存在对就业受到 AI 影响的担忧，但中国社会对 AI 的整体接受度仍然较高。（消息来源：IT 之家）\", \"published\": \"Mon, 17 Aug 2026 08:29:59 +0800\", \"source\": \"极客公园\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"industry\", \"level\": \"A\", \"why\": \"DeepSeek API 涨价直接影响我的 AI 工具成本\", \"action\": \"评估 DeepSeek 高峰时段用量，调整调用策略\", \"opportunity\": \"无\", \"risk\": \"API 成本上升，需优化调用时段\"}, {\"title\": \"MiniMax Design 来了，视频模型也有了自己的 Codex\", \"link\": \"https://www.ifanr.com/1675657?utm_source=rss&utm_medium=rss&utm_campaign=\", \"summary\": \"一款要抢走专业创作软件的应用 #欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。\", \"published\": \"Thu, 20 Aug 2026 02:03:30 +0000\", \"source\": \"爱范儿\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"ai_tools\", \"level\": \"S\", \"why\": \"视频生成新工具可能提升短剧制作效率\", \"action\": \"立即注册测试 MiniMax Design，评估其视频生成能力\", \"opportunity\": \"用 AI 快速生成短剧素材，降低制作成本\", \"risk\": \"工具效果未知，需对比现有方案\"}, {\"title\": \"OpenAI 紧急暂停新模型训练，AI 开始进入「越聪明越危险」阶段\", \"link\": \"https://www.ifanr.com/1675512?utm_source=rss&utm_medium=rss&ut 工具生态\", \"action\": \"关注支付宝 AI 动态，探索合作可能\", \"opportunity\": \"无\", \"risk\": \"无\"}, {\"title\": \"携手韶音，光帆的「AI OS 野心」已经藏不住了\", \"link\": \"https://www.leiphone.com/category/industrynews/UWWitkLdnH1adhl6.html\", \"summary\": \"导语：AI 硬件的分水岭已不再是大模型，而是更加系统化的“AI OS”。 2026 年 8 月 18 日，韶音在上海举办媒体沟通会，正式发布开放式耳机新品 OpenFit 2 AI。而光帆科技作为韶音重要的技术合作伙伴，为本款产品提供了 AI 技术支撑。 沟通会上，韶音宣布与光帆科技达成 AI 技术合作，将在 OpenFit 2 AI 中上线基于光帆自研 AI OS 的效率功能合集 ——“AI 实验室”，为智能对话、日程待办、快记快查、智能消息等创新类 AI 能力提供技术支撑，助力韶音为强沟通人群打造更高效的 AI 耳机体验。值得关注的是， 这是光帆 AI 技术能力首次正式落地第三方头部硬件品牌，标志着其系统化 AI 能力已从自有产品验证，进阶为可向行业伙伴输出。 基于光帆自研 AI OS 的效率功能合集——“AI 实验室”，即将在韶音 OpenFit 2 AI 耳机上线。 目前 AI 硬件正加速进入端侧规模化落地阶段。据 The Business Research Company 预测，2026 年全球 AI 耳机市场规模将达到 74.2 亿美元，2030 年有望增长至 173.4 亿美元。 在中国市场，开放式耳机是增长最快的细分品类之一，IDC 数据显示，2025 年中国开放式耳机出货量达 2996 万台，同比增长 20.2%。作为该品类的全球头部品牌，韶音此次与光帆的合作，也代表着开放式耳机率先从单点 AI 功能走向系统化 AI 能力。 与此同时，AI 硬件的竞争焦点正在迁移：接入大模型不再是稀缺能力，真正拉开体验差距的是 AI 体系化能力。多名业内人士对雷峰网·鲸犀表示，过去几年 AI 在耳机上的落地多为降噪、佩戴监测等单点功能，而真正的分水岭在于 AI 能否提供更主动智能、更多样化的能力，并依托系统化支撑实现跨应用调度。此次光帆与韶音的合作，正是这一行业趋势的代表性落地。 据雷峰网·鲸犀了解，光帆此次在 OpenFit 2 AI 耳机上落地的 AI 能力，以效率功能合集形式面向强沟通人群，包含智能对话、日程待办、快记快查、智能消息等。开启后，用户可通过双击按键唤醒智能助手“晓帆”，OpenFit 2 AI 可按需自动安排日程、添加定制化备忘；即使收到超长消息，也能筛选要点读给你听。据悉，相关功能将在近期推送给 OpenFit 2 AI 耳机用户，并通过持续 OTA 不断升级。 光帆为 OpenFit 2 AI 提供的 AI 技术支撑，区别于单点功能接入，是基于光帆自研 AI OS，通过端云协同、多模型调度、多 Agent 协作等系统化 AI 能力实现，而非单一功能的简单叠加。 光帆科技相关负责人对雷峰网 (公众号：雷峰网) ·鲸犀表示，韶音在开放式耳机领域有深厚的产品积累和用户理解，光帆科技专注于 AI 原生操作系统研发，双方的合作是技术能力与产品体验的强强联合。此次合作是光帆 AI 能力在开放式耳机上的一次重要落地，也是 “突破 AI 边界” 的一次实践。未来双方将持续探索，在更多场景中深化 AI 技术合作。 在圆桌讨论环节，韶音相关产品负责人分享了 AI 耳机未来发展的两大趋势。其一，AI 耳机的概念将不断延伸，未来可能会出现更多元的形态载体，硬件将承载语音输入与输出的任务，成为 AI 随身的入口。其二，AI 硬件的生态将更加开放。韶音 OpenFit 2 AI 已与千问大模型达成合作，此次又与光帆科技联合推出“AI 实验室”功能。未来韶音将与光帆携手持续探索，让 AI 硬件在真实场景中释放更大价值，更好地满足用户在更多场景下的真实需求。 在雷峰网·鲸犀看来，此次光帆科技与韶音的合作，是光帆自研 AI OS 从自有产品验证走向行业开放输出的重要一步。期待未来光帆持续突破 AI 边界，与更多硬件伙伴携手，让基于 AI OS 的系统化能力在更多真实场景中落地。 更多AI硬件行业内幕和一手信息，欢迎添加微信 Yolanda_Zuu 交流。 雷峰网\", \"published\": \"Thu, 20 Aug 2026 09:04:00 GMT\", \"source\": \"雷峰网\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"ai_tools\", \"level\": \"B\", \"why\": \"AI 硬件系统化趋势，与我的工具业务无直接关联\", \"action\": \"无需行动\", \"opportunity\": \"无\", \"risk\": \"无\"}, {\"title\": \"跨境圈爆火的 AI，潜入了淘宝商家的后台\", \"link\": \"https://www.leiphone.com/category/smartretailing/0w2SDhpkUaCdV6GK.html\", \"summary\": \"导语：未来，做电商，一个 Accio 就够了。 近几年，随着国内竞争加剧和全托管等新模式带动，越来越多内贸商家开始出海寻找新的生意机会。与此同时，很多从海外市场成长起来的品牌，也开始发力经营国内市场，比如消费电子相关的品牌 Anker 和一加手机等等。 双向流动下，内外贸一体化发展，正在成为越来越多企业的新常态。根据商务部数据，仅在规模以上工业企业中，就有 8.7 万家企业实现了内外贸一体化经营。 内外贸两条腿走路，带来了双倍的机会，但也使得经营复杂程度指数级上升。 国内电商、跨境电商、B2B、B2C，不同业务模式的运营逻辑完全不同；不同平台、渠道的人群特征和消费偏好也大相径庭；这些维度交织在一起，让经营难度陡然增加。仅仅依靠人力已经难以应对如此复杂的局面。 生意可以多平台，但是管理运营可不可以有且仅有一个平台？在这样的需求强烈推动之下，已经在跨境电商圈拥有 1000 万用户的 Accio，跨界打通了淘宝、天猫、拼多多、京东、抖店等国内主流平台。 多个电商平台，一个 AI 工作台，应运而生。 电商 AI Agent，也开始内外贸一体化 Accio 最早是阿里国际站面向外贸 B2B 商家推出的专门帮外贸老板做生意的 AI Agent。它能 7x24 小时在线、自主处理复杂的商业任务，帮企业、创业者自动化地运营生意，自主解决流程中遇到的各种难题。 自今年3月推出以来，Accio 的全球用户已经超过了 1000 万。 用户量爆发式增长的同时，Accio 不断拓展能力边界，逐渐从外贸 B2B 延伸到独立站、Amazon 等跨境 B2C 平台，覆盖了跨境全链路。现在，这款“外贸 AI”持续进化，正在悄悄潜入国内电商商家的后台。 昨晚，Accio 的一场国内电商的实战直播，让不少商家看到了 AI 在电商领域的可能。 有几个数字，也是可圈可点：做家居生意的吕修琼开了淘宝、京东、抖音、拼多多等十多个平台，过往想要了解全盘生意的全貌，人工要干 5 小时，Accio 接手后只用了 5 分钟； 干了 17 年电商的周明辉，十几个人的团队管几十个店铺，过往投流实时往外烧钱，每次计算 ROI 都是表格套表格。现在 Accio 帮他自动抓取多店铺的投流数据，交叉分析后直接给出调优建议，识别低效计划、建议关停或调整。单月节省推广费两到三万，这些钱就是实打实的利润。 不难看出，Accio 已经深入到国内电商生意运营环节中，而且淘宝、天猫、拼多多、京东、抖音等国内主流平台都可以直接打通。在功能上，Accio 现在已经可以支持多平台发品和多平台数据分析功能，未来还会开放更多能力。这意味着，国内商家第一次可以把所有渠道的生意，统一交给一个 AI 工作台来管。 具体来说，Accio 此次上线的“电商管家”Agent，可以帮商家做几件事情： 首先是看清数据、找准方向。 过去，商家在不同平台的数据是割裂的，想要进行跨平台的经营分析，往往需要人工导出报表、统一口径，耗时耗力且容易出错。 而 Accio 能够一键调取阿里国际站、淘宝、天猫、1688、抖音、拼多多等多平台的经营数据，自动生成跨平台分析报告。 Accio 不仅能汇总流量和销售额，还能深入分析各平台的流量漏斗、利润分布、库存效率等，甚至能发现商家未曾察觉的隐藏机会。这让经营分析从“事后复盘”变成了“实时校准”。 以广告转化分析为例。 广告投放是电商“烧钱”的重灾区：直通车里有计划报表、单元报表、人群报表、场景报表，层层嵌套，人工跨表分析几乎必然出错。Accio 能快速提炼投放效果、评估单品广告计划的有效性，针对效果差的投放直接给出优化方案。 除了广告转化分析，Accio 还能通过分析消费者旺旺聊天记录、产品评论等语料，帮助商家找到经营中的用户转化卡点，提升转化效率。 周明辉经营的拖鞋凉鞋品类的评价量极大，好评差评中评夹杂在一起，靠人工一条条翻，根本看不过来。周明辉让 Accio 的“电商管家”自动抓取各个平台的评价信息，并且进行语义分析总结，最后高频抓取到“磨脚”这个反馈，有的说磨脚、有的说刮脚、有的说走不到一百米就疼。Accio 把这些分散的声音归拢成一个清晰的产品问题。 短期内，周明辉让仓库每发一双鞋就配两片创可贴，先给用户一个有温度的回应；长期则拿着这些数据跟工厂调模具、改材质配比，从根源解决问题。更重要的是，评价里的高频词还能反哺到标题和关键词里，消费者用什么词描述需求，他就用什么词去占领搜索。 大到挖掘机、小到饺子机。邢台北强机械制造厂总经理姜玺介绍，他所在的行业客单价高、成交周期长，几乎每位客户都要经历客服接待和售前沟通，“谈单话术一旦出了问题，就很容易流失客户”。 姜玺把和客户的完整聊天记录丢给 Accio，AI 就能提取出采购预算、技术要求、交货时间等关键信息，给出谈单建议。它懂各国的谈判风格，知道从哪个痛点切进去。姜玺形容它“像手术刀一样精准”。 Accio 还会反过来审业务员：接待过程中有哪些卡点，哪些话术有效、哪些无效；客户最常问什么问题，价格优惠还是权益保障。这些信息最后又流回运营端——设标题、选关键词、修主图的时候，直接把客户真实的痛点写上去。 在竞品分析上，Accio 也是一把好手。 过去商家盯竞品全靠人工，商品主图、详情页、评论区，一条条翻，判断依赖于老运营的经验和直觉。现在 Accio 会自主分析竞对产品，快速理清其卖点、定位、优劣势，帮商家锚定差异化机会。 吕修琼举了个例子，他的竞对打着“零甲醛”的卖点，但&nbsp;Accio 从对方好几万条评价里捞出一个高频词：“有味道”。几万条评价，人工根本不可能逐条分析，但 Accio 几分钟就能提炼出来。这直接反哺到他的卖点策略：对手说零甲醛，评价却在说有味，那他就打“真无醛、真无味”。 一个合格的 AI Agent 除了要有灵活的“脑子”，还应该长出“手”，直接帮用户把事给办了。 Accio 的多平台发品功能就是如此。 它只需要商家准备一次资料，AI 就能自动适配不同平台的规则与特性——比如淘宝强调品质种草、生活场景和功能解释；拼多多强调利益直给、实用省心和高性价比；京东强调专业参数、技术结构和产品靠谱性——自动生成主图、使用视频、详情页等。 周明辉介绍，多平台发品曾经是他最大的痛点。“同一个商品要在多个平台分别发布，一份工要重复打 5 次。”有时候新品上架太慢还会错过最佳推广时机。 而现在，周明辉上架一个链接、全平台铺完只要 90 秒。 从“运营平台”到“经营商品” 当数据和操作在同一个 AI 工作台中实现闭环，商家的组织形态与经营逻辑正在经历一场深刻的重构。 过去，商家的组织架构往往是围绕“平台”建立的：国际站一个团队，淘宝一个团队，1688 又一个团队……这种各自为战的模式导致数据不互通、经验不共享，平台间的壁垒成为了生意增长的隐形天花板。 如今，随着 Accio 等全球电商 AI 工作台的打通，生意和商品重新回归为经营的核心单位。 商家可以借助 AI，基于全域数据来做出更理性的资源分配决策：哪个平台适合低成本测款，哪个平台适合规模化走量，哪个平台的利润空间更高，都能一目了然。 更深层的变化在于，商家正在打造一种“AI Native”的新型组织。在这个工作台中，商家可以像搭建团队一样，配置不同的 AI Agent 来分管不同的平台和环节。 这些Agent协同工作，使得原本需要几十人团队才能完成的跨平台运营，现在只需几个人的小团队甚至“一人企业”就能轻松驾驭。 比如，吕修琼正在公司的跨境业务中推行“Accio + 负责人”架构：每个小项目由一个负责人带着AI跑，他本人不再事无巨细地开会协调，而是通过数据来遥控全局。 吕修琼现在每天工作五六个小时，其中大部分时间在研究 AI。他的终极目标是：每天一张表看清全场战役，每天花五分钟就能了解全盘生意，剩下的时间用来喝茶、思考、做战略。 这种组织重构的本质，是将过去只有大型企业才建得起的跨平台数据中台和运营能力，变成了中小商家即插即用的“水电煤”。 未来做电商，一个 Accio 就够了 今天，中国企业正在成长为真正的全球化企业，而内外贸一体化，是这条路上绕不开的必经之路。 回望上一代全球化企业，支撑它们把生意铺向世界的，是 ERP 等 IT 系统 —— 把流程标准化、把数据搬上线，就能跑通跨国业务的基本盘。但这一代全球化企业面对的，是更碎片化的渠道、更瞬时的决策、更复杂的全域运营。靠 IT 系统已经不够了，它们必须借助 AI Agent 的力量。 AI Agent 和 AI 功能是两回事。单点功能解决一个问题，Agent 则要把数据、操作、决策串成一个闭环，这要求平台级的商家生态和全链路数据。 阿里服务中国商家二十多年，从生意参谋到千牛，商家工作台的基因一脉相承；再加上国际站、速卖通等跨境基础设施，Accio 天然站在了“内外贸一体化”的枢纽上。 技术层面，AI Agent 的本质是大模型能力与电商场景的深度结合。阿里在大模型上的持续投入为 Accio 提供了底座，更重要的是，千万商家真实的使用反馈正在反哺模型迭代。技术可以被追赶，但场景、数据与迭代的飞轮，无法速成。 目前全球电商领域的同类 Agent，大多还停留在非常初期的起步阶段，而 Accio 已经迅速在国内外市场爆红，商家使用者规模可观。 除了 1000 万全球中小企业用户，过去 12 个月中，阿里国际站上的中小企业 Token 消耗量翻了 10 倍。与此同时，Accio 单次任务的使用成本下降了50%。 数字背后，是真实生意场景对 AI Agent 的强烈饥渴 —— 商家不是在尝鲜，而是在把它当成日常运营的基础设施。 相比于跨境场景，内贸的交易链路更短、决策链条更紧凑。Accio 在外贸场景的能力已经得到了充分验证，打通内贸场景后，同样的方法论会更加得心应手&nbsp;—— 外贸练出来的“硬功夫”，放到内贸就是“降维打击”。 从这个角度来说，未来做电商，也许真的一个 Accio 就够了。 雷峰网 (公众号：雷峰网) 雷峰网原创文章，未经授权禁止转载。详情见 转载须知 。\", \"published\": \"Thu, 20 Aug 2026 08:53:00 GMT\", \"source\": \"雷峰网\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"ai_tools\", \"level\": \"A\", \"why\": \"Accio打通国内多平台，提供AI工作台，可能影响电商运营效率\", \"action\": \"研究Accio功能，评估是否接入自身电商业务\", \"opportunity\": \"利用AI工作台提升多平台运营效率\", \"risk\": \"依赖第三方工具可能带来数据安全风险\"}, {\"title\": \"Harness 神器 J-Space 造假案背后，思维链作者暴论，小模型 + 工具干不掉顶级大模型\", \"link\": \"https://www.leiphone.com/category/yanxishe/EwXFwuIZiBRqbgCs.html\", \"summary\": \"导语：外挂补不了模型智商，《苦涩的教训》再次上演。 外挂补不了模型智商，《苦涩的教训》再次上演。 &nbsp; &nbsp; 作者丨 高允毅 &nbsp; &nbsp; 编辑丨 岑 &nbsp; 峰 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 这两天在 X 上，一款蹭 DeepSeek 热度的 Harness 工具被打假了。 这是一个名为 &nbsp;J-Space Cognition Suite&nbsp; 的开源项目，它声称无需修改模型权重，仅靠 DeepSeek V4 Flash 加其精巧的外部 Harness，就能在 Agent 任务中追平 GLM-5.3；若换成 DeepSeek V4 Pro，甚至能直接超越Claude Fable 5。同时速度提升 2.53倍，Token 效率提升 2.21倍。 如果这是真的，这无疑是 AI 工程史上的奇迹。这意味着J-Space能用几十分之一的成本复刻顶级大模型的效果。 然而，泡沫破裂的速度比想象中更快。 GitHub 用户 GoForceX 严格按照项目说明，使用 Terminal Bench 完成了独立复测，最终结果与宣传完全相反。加入 J-Space 后，基准测试分数不升反降，Token 消耗量明显增加，推理速度也比原生模型更慢。 当社区进一步要求公开完整原始实验数据时，作者承认数据 \\\"确实夸张\\\"，却始终拿不出可复现的运行日志，反而开始删除质疑的 issue。 几乎在同一时间，Open AI 思维链（CoT）核心发明者 Jason Wei &nbsp;在 X 上发布了一篇长文，精准戳破了 \\\"小模型 + 万能工具\\\" 的幻想。 他用自己学羽毛球的经历做比，“在球场上，我就像一个 1B 参数的认知核心。教练教的每个击球动作我都能做，但要在高速回合里把架拍、转体、击球点、随挥这些要点全部串联起来，几乎要耗尽全部精力。这跟那些练了上万次、将动作化为肌肉记忆的专业选手完全不是一个级别。” Jason Wei隐喻的正是“小模型+ 工具”与“大模型内化能力”的本质区别。 他强调“模型不依赖外部工具，自然且快速地完成任务，这件事至关重要”。 一旦承认高维认知应该以内生的方式处理，那么 1B、甚至 10B 的核心显然都是不够的。 01 J-Space 神话切中的行业焦虑 J-Space之所以能在 48 小时内引发全行业狂欢，在于它精准地切中了当前 AI 产业的两大行业焦虑： 大模型太贵，算力烧不起怎么办？大模型要落地，端侧设备太弱怎么跑？ 事实上，业内一直在寻找一种可能，小模型 + 工具也能干掉顶级大模型。 AI大牛吴恩达正是这一路线支持者之一。他曾多次在公开演讲中展示数据：用版本更早、参数量更小的 GPT-3.5，搭配包含反思、工具调用、任务规划的迭代式 Agent 工作流，在很多基准测试上的表现能够超越当时最强的 GPT-4。 微软 Phi-4、Mistral 等小模型，也靠着高质量数据训练，在代码、数学等垂直任务上，以 3B 到 14B 的体量击败过上一代千亿参数模型。这让很多开发者产生了一种错觉： Scaling Law 的边际效应正在递减，只要工具配得好，小模型就能逆袭。 今年 7 月，卡内基梅隆大学发布的一篇论文《Better Harnesses, Smaller Models》，更是把这种讨论推向了高潮。 论文用详实的测试数据提出，经过高度优化的 Harness 框架，小模型在特定任务上可以恢复大模型 90% 以上的性能，而成本却可以忽略不计。 在 “Scaling 撞墙论” 此起彼伏、端侧 NPU 刚刚普及的当下，这场围绕 \\\"小模型 + 工具能否干掉顶级大模型\\\" 的集体讨论成为 AI 行业最核心的路线之争之一。毕竟，行业急需一个能把“高智能”和“低成本”同时落实的工程解法。 02 &nbsp;小模型+工具三大硬伤： 速度、深度、可靠性 Jason Wei 用他多年的技术直觉，直接点破了 \\\"小模型 + 万能工具\\\" 幻想的三个软肋。 最直观的差距是速度。 你问一个常识问题，肯定希望 AI 立刻给出答案，而不是等它先去搜三五个网页、再花十几秒整理归纳。大模型把知识内化在数万亿参数的连接中，端到端直接输出，延迟最低。 而小模型 + 工具的路径，注定要经历“判断是否调用工具→构造查询指令→等待工具返回→筛选有效信息→整合最终答案” 的完整链路。每多一步，延迟就增加一截。如果是多步推理任务，工具调用还要反复进行，耗时更是指数级上升。 J-Space 宣称的 “速度提升 2.53 倍” 本身就违背基本逻辑，Harness 本质上是在模型外面加了一层控制逻辑，每一轮推理都要多做判断、多走流程。它怎么可能反而比原生模型更快？ 社区复测的结果验证了这个常识：加装 J-Space 后，Token 消耗更多，推理速度更慢。因为所谓的 \\\"外部控制\\\" 本身就需要消耗计算资源和 Token 预算。 比速度更本质的差距，是思维的深度与归纳能力。 很多人以为，大模型知道的东西网上都有，让小模型去搜就行了。但 Jason Wei 举了一个例子：如果你问 \\\"大家对香巴拉音乐节的普遍看法是什么\\\"，小模型可能只翻热帖下面的前三条评论，而大模型却能像一个真正的业内专家，在看完几万条各种各样的评价后，给你提炼出一个客观、综合的总体印象。 这就是大模型预训练的真正价值，它可以在海量数据中，把海量的知识消化成了自己的见识和常识。这种对世界的洞察力，也是我们要追求的终极智能之一。 J-Space 这类 Harness 工具，恰恰在这个层面最无力。它可以优化搜索路径、规范调用格式，但它没法凭空赋予小模型更高维的抽象归纳能力。 第三重差距，还在于处理复杂长任务的可靠性上。 Jason Wei 提到，在复杂的长周期任务中，每一步的微小误差，会像滚雪球一样越滚越大。到最后，整个任务会彻底跑偏甚至崩溃。 大模型因为有全局的语义理解和自我纠错能力，能感知路线是否偏移，并对局部偏差进行修正。但小模型本身元认知能力就弱，再加上它每干一个活儿都要层层转接外部工具，这种“现学现卖”的模式，出错的概率更高。 J-Space 复测中出现的 “性能小幅下降”，就是典型表现。复杂的外部 Harness 不仅没帮上忙，反而把本就不强的小模型绕得更混乱。 说到底，工具只是放大器，不是发动机。 在限定 Benchmark、限定提示词、人工筛选样本的条件下，小模型+工具能跑出漂亮的数字，但在真正的开放任务、长任务、模糊约束、多工具协作的真实场景呢？内化的本能，永远比临场查手册更快、更稳、更准。 03 从工程派到规模论， Jason Wei 的认知转变 很有趣的一件事是， Jason Wei 当初也是“大模型规模论”的怀疑者 ，而今天，他坚定站在 \\\"大模型不可替代\\\" 这一边。 他的认知转变之路，几乎就是过去五年大模型行业发展的缩影。 2021年时，Jason Wei 在 Google Brain 还是一个 典型的工程派 。 他和团队发现，只要在提示词中给出逻辑推导的示例，让大模型学会“把思考过程一步步写出来”，模型的推理能力就会大幅提升，这就是后来改变行业的“思维链（Chain-of-Thought）”。 那段时间，他沉迷于通过精巧的 Prompt 设计、指令微调来挖掘模型潜能，试图用轻量化的工程手段撬动更大的智能产出。 但随着研究深入，两个关键发现彻底改变了他的看法。 第一个发现是涌现能力。 在他那篇里程碑式的论文《Emergent Abilities of Large Language Models》里，他将“涌现能力”定义为“An ability is emergent if it is not present in smaller models but is present in larger models.”（即小模型不具备而大模型具备的能力），这个定义已成为模型扩展定律研究的经典基石。 他用数据证明了，很多高级能力，比如三位数加法、多步推理，在小模型上无论你怎么调提示词、怎么加外挂，正确率都几乎是零。但一旦参数规模跨过某个临界点，大约 100B 量级，许多高阶能力开始涌现。 这意味着，小模型没有高阶智商。 第二个发现是思维链只在大模型上有效。 在思维链论文《Chain-of-Thought Prompting Elicits Reasoning in Large Language Models》中，很多人只记得思维链能提升推理能力，却忽略了论文里一个关键结论：在小模型上使用思维链，不仅不会提升性能，反而会因为引出错误的中间推理步骤而导致成绩下降。 因为逻辑推理本身，就是规模的产物。 这两个发现彻底堵死了 \\\"小模型靠精巧 Prompt或者Harness 实现高阶推理\\\" 的幻想。 在 OpenAI 期间，他作为核心成员参与了 o1 系列等前沿推理项目的研发，对大模型内生能力的价值有了更深的理解。他在一篇博客里写道： “想让大模型超越人类老师，就必须用强化学习，去逼出它内生的高阶思考能力。” 04 DSPy 框架之父的数学呼应 Jason Wei 的观点也得到了另一位技术大牛的呼应。 DSPy 框架的作者，MIT 助理教授Omar Khattab在 Jason 发推后不久，从学术和系统层面的视角，再次佐证了 “内化优于外挂” 这一核心判断。 他用底层数学逻辑，精准指出了两者的计算差异。 他认为大模型使用的是 注意力机制 。 它将所有上下文完整保留在显存中，每次以“全知视角”重新审视所有信息。这对应的正是 Jason 说的大模型的“内化能力” 而小模型+工具本质上是一种 压缩与递归 。 它必须把复杂的外部世界塞进工具的输入输出里，在这种一轮一轮强行“信息脱水”和往下传递的过程中，大量高维信息丢失了。 Omar 指出，“虽然我们在工程上可以用各种‘外挂’来模拟出智能的表象，但在数学层面上，靠一轮轮压缩的‘递归’，永远无法完美模拟‘注意力机制’对全局的掌控力。” 不仅如此，Omar 团队还在其重磅论文 《 Machine Studying 》 中，重新定义了 什么是 AI 的“专业能力” 。 他们认为，判断一个系统专不专业，不该看它闭卷考试拿了多少分，要看 它用多少推理计算量，能换来多高的准确率。 对于新手型 Agent 来说，它必须靠疯狂搜索、反复试错，消耗大量 Token 才能勉强答对；而专家型 Agent 搜索次数少、命中率高，在低计算预算下就能有很好的表现。 05 《苦涩的教训》的回响 这场争论走到最后，终究绕不开 AI 领域那个经典之作，来自强化学习教父、人工智能先驱 Rich Sutton 的《苦涩的教训》 “人类在 AI 领域的所有精巧工程设计，最终都会被绝对的算力和数据规模碾得粉碎。” 从这个视角来看，小模型加工具本质上就是一种精巧工程，试图用人类擅长的工程链路去弥补模型本身容量的不足，而大模型则是纯粹规模定律的胜利。 回顾 AI 发展史，这样的故事已经上演过无数次。 七十年代专家系统盛行，人们相信把人类专家的知识写成规则就能造出智能，最终走向失败；九十年代到 2010 年代，自然语言处理依赖精心设计的特征工程与统计模型，语言学家们一点点打磨系统性能，直到深度学习出现，端到端的大规模训练直接重构了整个领域；2010 年代末知识图谱再度兴起，人们以为结构化的实体关系能让 AI 真正 “理解” 世界，结果预训练大模型证明，从海量数据中自发学到的隐式知识，远比人工构建的结构化知识更强大。 每一次，人们都试图用巧思走捷径；每一次，最终胜出的都是更简单、更吃算力的方法。 既然苦涩的教训一再应验，为什么人们还是一次次地投入 \\\"工程派\\\" 的怀抱？因为太贵了。万亿参数模型的训练成本是天文数字，不是每家公司都能承担得起，而且每个日常场景也并不都需要顶级智能。 比如开发者 Matthew Auburn 曾公开表示，“对于小模型，Harness 就是一切”。他认为在商业场景里，90% 的任务只需要 60 分的智能 + 100 分的执行。性价比才是王道，顶级智能反而是浪费。 也有开发者提出了更折中的未来方向： 行业最终会走向一种中间状态，核心认知能力会被拆分为多个十亿级的专家模型协同工作，就像混合专家（MoE）架构的延伸。 这些专家模块更灵活、可替换、可审计，而不是现在这样用一个粗放的 Harness 试图包打天下。 事实上 Omar Khattab 本人就是 Harness 优化的重要推动者，他的 DSPy 框架、Meta-Harness 研究，本质都是在提升工具链的自动化水平，他不认为 Harness 能替代模型本身的能力，却从未否认 Harness 的工程价值。 参考链接： https://x.com/maxforai/status/2089734195002445912?s=46 https://x.com/_jasonwei/status/2089429555371024577?s=46 https://x.com/lateinteraction/status/1909011076605518124 上车，雷峰网 (公众号：雷峰网) 带你看遍全球 AI 顶会精华 可独家畅览： 专家演讲PPT 大会报告全文 热门论文解读 学术新星访谈 扫描上方二维码 或点击 「 阅读原文 」 关注专区。 雷峰网原创文章，未经授权禁止转载。详情见 转载须知 。\", \"published\": \"Thu, 20 Aug 2026 03:53:00 GMT\", \"source\": \"雷峰网\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"industry\", \"level\": \"B\", \"why\": \"了解小模型+工具的真实能力，避免被虚假宣传误导\", \"action\": \"关注大模型能力边界，不盲目跟风小模型方案\", \"opportunity\": \"无\", \"risk\": \"被夸大宣传误导，投资错误技术方向\"}, {\"title\": \"独揽 IJCAI 2026 两大 Tutorial！清华王鑫团队如何用「OOD泛化」夺取生成式 AI 的国际定义权？\", \"link\": \"https://www.leiphone.com/category/private/ad3iWKJ0l4yOlUCS.html\", \"summary\": \"导语：当大模型困于“见光死”与“幻觉”，他们提前五年埋下的学术草蛇灰线开始爆发。 当大模型困于“见光死”与“幻觉”，他们提前五年埋下的学术草蛇灰线开始爆发。 &nbsp; &nbsp; 编辑丨岑峰 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 在近日公布的国际人工智能联合会议（IJCAI 2026）Tutorial（讲习班）录用名单中，出现了一个极其罕见的现象：清华大学王鑫教授团队，凭借 T9《Beyond Graph Distribution Shifts》与 T11《OOD Generalized Generative AI》同时包揽两席。 在全球顶尖高校与科技巨头云集的 IJCAI 赛场，同一团队拿下“双杀”，不仅彰显了清华在 AI 领域的强势话语权，更向全行业释放了一个强烈的信号： 生成式 AI 的下一场技术战役，已经从“大力出奇迹的 IID（独立同分布）拟合”，全面转向了“应对真实物理世界的 OOD（分布外泛化）挑战”。 为什么是王鑫团队？这两场看似独立、实则底层相通的 Tutorial，究竟藏着怎样的学术野心与产业图景？ 01 大模型的“阿喀琉斯之踵” 大语言模型（LLM）与生成式 AI 在过去几年高歌猛进，但产业界很快撞上了一堵无形的墙： 模型在训练数据（分布内，IID）上表现如神，一旦面对真实世界中前所未见的新场景、新结构或罕见提示词（分布外，OOD），就会瞬间智商断崖式下跌，甚至产生严重的幻觉。 这种“见光死”的窘境，源于传统深度学习对“数据同分布”的脆弱依赖。而打破这一魔咒，正是清华大学王鑫团队长期以来深耕的硬核领地。 早在生成式 AI 彻底爆发前，王鑫团队就已敏锐地察觉到：真实的物理世界永远是动态变化的。他们没有随波逐流地去卷模型的“参数规模”，而是死磕底层逻辑，将研究重心死死锚定在“OOD 泛化（Out-of-Distribution Generalization）”这一 AI 皇冠上的明珠。 此次 IJCAI 2026 的两场 Tutorial，正是其多年扎根这一领域积淀的厚积薄发。 02 T9：图网络与 LLM 的交汇， 用“因果”与“持续学习”打破 I.D. 假说 入选的 T9 讲习班主题为《Beyond Graph Distribution Shifts》（超越图分布偏移）。这并非传统的图神经网络（GNN）基础授课，而是精准切中了当前最前沿的交叉领域： Graph（图）与 LLM（大语言模型）的泛化融合。 现实世界的数据往往是高度结构化且动态演进的（例如动态知识图谱、不断进化的生物医学网络）。官方介绍中犀利地指出，绝大多数现有图学习方法都建立在“同分布（I.D.）假说”的温室里，而真实场景无情地打破了这一假说。 为了跨越这道天堑，王鑫与朱文武教授团队在 T9 中抛出了一套系统性的“三维解法”： 1.Graph LLMs（图大语言模型）： &nbsp;将 LLM 强大的表征能力与图结构深度绑定，让模型在图数据上也能实现灵活的上下文学习（In-context）和小样本学习（Few-shot）。 2.动态适应（Adaptation）： &nbsp;针对不断进化的数据，引入图神经网络架构搜索（NAS）与持续学习（Continual Learning）策略，让模型拥有“自我进化”的能力。 3.因果与不变性（Causality and Invariance）： &nbsp;这是最硬核的底层重构——将因果推断原则引入图模型，剥离虚假关联，从而在从未见过的分布（Unseen Distributions）下构建真正鲁棒的图网络。 这套从大模型表征到因果底层逻辑的组合拳，不仅是对图机器学习理论的升维，更是直接为金融风控、医药发现等复杂结构化场景在 LLM 时代的落地指明了航向。 03 T11：多模态与后训练突围， 定义 OOD 生成式 AI 的国际标准 如果说 T9 是在结构化数据上的深耕，那么 T11《Out-of-distribution Generalized Generative AI》（OOD泛化的生成式AI）则是对当下生成式大模型主流赛道的“降维打击”。 当前业界谈论生成式 AI，往往陷入参数规模的内卷。而王鑫团队在 T11 中，直接将视野拔高到了 多模态大语言模型（MLLMs）的理解与基于扩散（Diffusion-based）模型的视觉生成 。 在官方介绍中，他们不仅系统拆解了这些多模态巨兽的概率公式、架构设计与交互机制，更直击产业界最痛的软肋：如何让这些模型在 OOD 环境下安全部署？ 为此，团队重点探讨了当前 AI 界最前沿的博弈高地——通用化的后训练策略（Post-training strategies）。通过后训练阶段的对齐与统一框架设计，让模型在面对分布偏移和全新涌现的应用场景时，依然能保持极高的鲁棒性。能够在 IJCAI 这样的顶会开办此类 Tutorial，说明国际学术界已高度认可清华团队在该交叉领域的开创性与领导力——他们不仅在解题，更在“定义问题”。 04 结语：中国学派 在 AI 国际生态中的话语权进阶 从 Graph+LLM 到 OOD Generative AI，王鑫与朱文武教授团队在 IJCAI 2026 上的“双星闪耀”，绝非偶然。它代表了一种长期主义学术哲学的胜利：不追逐短暂的技术泡沫，而是敏锐捕获智能进化的底层命题。 当算力与参数的暴力美学遭遇边际收益递减时，拥有极高 OOD 泛化能力的模型，才是通往 AGI（通用人工智能）的真正入场券。而在这张入场券上，清华大学与中国学者的名字，正在被刻在最显眼的位置。 盛会即将启幕，前沿碰撞在即。 为了零距离捕捉这场定义下一代 AI 范式的学术风暴，雷峰网 (公众号：雷峰网) AI科技评论将正式派出特派编辑团队，远赴德国不莱梅，在一线为您带来 IJCAI 2026 的深度现场报道。 我们不仅会持续追踪、深度还原王鑫教授团队在 Tutorial 现场的精彩论道，更将全景展现全球顶尖学者在这场盛会上的思想激荡。 目前， 雷峰网“IJCAI 2026 顶会专区”已全面上线 。 欢迎点击（或收藏）：https://ijcai26.leiphone.com/ ，与我们一同跨越时差，见证生成式 AI 下半场的破局之战！ 上车，带你看遍全球 AI 顶会精华 可独家畅览： 专家演讲PPT 大会报告全文 热门论文解读 学术新星访谈 扫描上方二维码 或点击 「 阅读原文 」 关注专区。 雷峰网原创文章，未经授权禁止转载。详情见 转载须知 。\", \"published\": \"Wed, 19 Aug 2026 10:31:00 GMT\", \"source\": \"雷峰网\", \"biz_tags\": [\"industry\", \"ai_tools\"], \"category\": \"industry\", \"level\": \"B\", \"why\": \"了解生成式AI前沿方向，可能影响未来工具开发\", \"action\": \"关注OOD泛化技术进展，评估应用潜力\", \"opportunity\": \"无\", \"risk\": \"无\"}, {\"title\": \"Temu在欧洲推‘砍一刀’引发热潮，其他跨境电商跟风做却没效果，问题出在哪？\", \"link\": \"https://www.baijing.cn/question/638468\", \"summary\": \"跨境电商出海欧洲市场竞争激烈，营销玩法创新是一大难题。Temu推出‘砍一刀’社交裂变玩法，成功提升了平台流量和销售额，但不少同行跟风后却效果不佳。这一模式虽在国内成熟，但在欧洲面临社交隐私等争议。那其他跨境电商跟风失败的原因究竟是什么呢？\", \"published\": \"Thu, 13 Aug 2026 08:17:54 +0000\", \"source\": \"白鲸出海\", \"biz_tags\": [\"short_drama\", \"industry\"], \"category\": \"short_drama\", \"level\": \"A\", \"why\": \"了解社交裂变玩法在欧洲的适用性，避免盲目跟风\", \"action\": \"分析Temu玩法成功要素，测试自身产品是否适用\", \"opportunity\": \"借鉴成功裂变策略提升海外用户增长\", \"risk\": \"文化差异导致玩法失效，浪费营销预算\"}, {\"title\": \"Temu靠性价比挑战亚马逊，咱们中小跨境电商企业该跟进低价策略还是另寻出路？\", \"link\": \"https://www.baijing.cn/question/638462\", \"summary\": \"在跨境电商领域，亚马逊长期占据主导地位。但近期Temu凭借超高性价比策略，在美国市场份额持续攀升，对亚马逊构成挑战。这让众多中小跨境电商企业犯了难，是跟着打价格战，还是另想办法突出重围呢？该如何抉择才好？\", \"published\": \"Tue, 11 Aug 2026 09:34:53 +0000\", \"source\": \"白鲸出海\", \"biz_tags\": [\"short_drama\", \"industry\"], \"category\": \"short_drama\", \"level\": \"A\", \"why\": \"低价策略影响中小卖家竞争策略，需明确自身定位\", \"action\": \"评估自身成本结构，决定是否跟进低价或差异化\", \"opportunity\": \"寻找细分市场避免直接价格战\", \"risk\": \"盲目低价导致利润压缩，难以持续\"}, {\"title\": \"国产AI大模型在东南亚为电商做智能客服，如何平衡成本与服务效果，实现盈利最大化？\", \"link\": \"https://www.baijing.cn/question/638459\", \"summary\": \"当下国产AI大模型出海加速，诸多科技企业凭借技术和成本优势在海外开展合作，像在东南亚为电商提供智能客服。不过在实际操盘里，出海企业既要控制成本，又得保证服务效果以实现盈利，这中间的平衡是个大难题。那到底该怎么把握这个平衡，达成盈利最大化呢？\", \"published\": \"Mon, 10 Aug 2026 11:34:47 +0000\", \"source\": \"白鲸出海\", \"biz_tags\": [\"short_drama\", \"industry\"], \"category\": \"ai_tools\", \"level\": \"A\", \"why\": \"智能客服可降低运营成本，但需平衡效果与投入\", \"action\": \"调研东南亚智能客服市场，评估合作机会\", \"opportunity\": \"提供AI客服服务给东南亚电商，赚取服务费\", \"risk\": \"成本控制不当导致亏损\"}, {\"title\": \"国内AI大模型出海面对欧美与亚洲文化差异，怎样进行针对性优化才能提升用户接受度？\", \"link\": \"https://www.baijing.cn/question/638457\", \"summary\": \"国内AI大模型发展势头猛，出海成了新风口。不过呢，不同区域市场文化差异大，像欧美和亚洲，文化偏好和价值观都不一样，导致大模型在内容生成、语言理解上适配困难。这严重影响用户接受度和使用体验，该怎么针对性优化呢？\", \"published\": \"Mon, 10 Aug 2026 00:00:54 +0000\", \"source\": \"白鲸出海\", \"biz_tags\": [\"short_drama\", \"industry\"], \"category\": \"ai_tools\", \"level\": \"B\", \"why\": \"文化适配影响AI产品海外接受度，需关注优化方向\", \"action\": \"研究目标市场文化，调整AI内容生成策略\", \"opportunity\": \"开发文化适配的AI工具，满足本地化需求\", \"risk\": \"忽视文化差异导致产品失败\"}, {\"title\": \"我们中小跨境电商没Temu那么多营销预算，咋靠低价策略在美国市场分一杯羹？\", \"link\": \"https://www.baijing.cn/question/638455\", \"summary\": \"跨境电商竞争激烈，Temu在美国靠低价策略、持续营销投入和高效供应链管理，销售额再创新高。但咱们中小跨境电商没那么多营销预算，也想靠低价策略在美国市场有所斩获，该咋做呢？怎样才能突破资金限制，走出自己的低价营销之路呢？\", \"published\": \"Sun, 09 Aug 2026 04:17:46 +0000\", \"source\": \"白鲸出海\", \"biz_tags\": [\"short_drama\", \"industry\"], \"category\": \"short_drama\", \"level\": \"A\", \"why\": \"中小卖家需低成本营销策略，低价策略需谨慎\", \"action\": \"探索低成本营销渠道，如社交媒体和内容营销\", \"opportunity\": \"利用AI工具降低营销成本，提升效率\", \"risk\": \"低价策略可能损害品牌形象\"}, {\"title\": \"国产手游出海拉美市场，怎样制定出像这款游戏一样有效的买量和运营计划？\", \"link\": \"https://www.baijing.cn/question/638454\", \"summary\": \"在国产手游出海浪潮中，拉美市场潜力巨大但竞争也激烈。不少出海企业面临买量效果不佳、运营本地化不足等问题。近期一款国产手游在拉美凭借独特买量策略和本地化运营获巨大成功，给其他企业带来希望。那究竟怎样制定出有效的买量和运营计划，才能在拉美市场分得一杯羹呢？\", \"published\": \"Sun, 09 Aug 2026 03:17:52 +0000\", \"source\": \"白鲸出海\", \"biz_tags\": [\"short_drama\", \"industry\"], \"category\": \"short_drama\", \"level\": \"B\", \"why\": \"拉美市场买量策略可借鉴到短剧出海\", \"action\": \"研究该手游买量案例，提炼可复用打法\", \"opportunity\": \"拉美短剧市场蓝海机会\", \"risk\": \"无\"}, {\
