ools\", \"industry\"], \"category\": \"other\", \"level\": \"C\", \"why\": \"硬件新闻与业务无关\", \"action\": \"忽略\", \"opportunity\": \"无\", \"risk\": \"无\"}, {\"title\": \"AI货架上的人脸，100元到10000元\", \"link\": \"https://www.huxiu.com/article/4884663.html\", \"summary\": \"打开Demo（样片）的那一刻，楚婷第一次看到了数字世界里的自己。屏幕里的人有着和她一样的脸，却又处处陌生。她穿着正式的职业装，手挽起袖子，在讲课室里走动，神态从容，举手投足间带着一种职业女性的精英感。15秒的视频很快结束。楚婷盯着屏幕看了一会儿，突然觉得，那个AI形象并不像现在的自己，更像是她想象中的未来。“...... 本文来自微信公众号： 镜相工作室 ，编辑：胡苗，作者：镜相作者 打开Demo（样片）的那一刻，楚婷第一次看到了数字世界里的自己。 屏幕里的人有着和她一样的脸，却又处处陌生。她穿着正式的职业装，手挽起袖子，在讲课室里走动，神态从容，举手投足间带着一种职业女性的精英感。 15秒的视频很快结束。楚婷盯着屏幕看了一会儿，突然觉得，那个AI形象并不像现在的自己，更像是她想象中的未来。 “有点像《新闻女王》里的角色。”她说。那一刻，她看到的不只是一个AI形象，也是一种新的可能——一个演员、一个普通人，或许可以拥有另一个存在于数字世界里的自己。 这样的“AI数字人”，正在影视行业越来越频繁地出现。 今年4月20日，爱奇艺在世界大会上提出AI艺人库，推动艺人AI授权，已有超过100位艺人进入。 明星也开始把脸交给AI。今年7月，王祖贤授权AI广告片《倩影》；62岁的吴启华将20岁时期的肖像授权给AI电影制作公司；8月6日，戚薇推出个人官方数字分身，出演AI短剧《末日盛夏》，成为“内娱首位主动开放形象规范化AI授权的艺人”；唐国强也把自己的数字分身带进了课堂，以“诸葛亮”的形象讲解《出师表》...... 英剧《黑镜》里曾预言过类似的情形：一个普通人交出了形象使用权限，然后发现数字世界中的自己再也不受控制。如今，这个虚构情节正在变成现实里的商业问题—— 当人的脸、声音甚至表演能力都可以被复制，一张脸究竟属于谁？谁有权决定它被卖多少钱、出演什么角色、出现在哪部作品里？以及更重要的，当脸离开主人之后，主人还能不能控制自己的脸？ 一张脸，是如何成为生意的？ 正面、左侧面、右侧面、背面……摄影棚里，一位百万粉丝的校园博主按照摄影师的指令转身、抬头、看向镜头，完成了一次特殊的“试镜”。没有剧本，没有角色，她正在为自己的数字分身采集素材。不久前，她与一家AI人脸授权公司签署了独家协议。 把脸上传到赛博世界，只需要1个小时：到线下采集点，拍摄正面、侧面、背面等七八张高清照片，形成完整四视图，一个基础数字人模型就可以生成。如果线上操作，上传3张照片，也可以完成基础模卡制作。 但决定卖掉这张脸，花了这位博主两个月时间。 今年5月，楚婷第一次联系她时，发送了一段以她的数字人为主角制作的AI视频Demo，并询问是否愿意授权自己的脸。博主看完后，只简单回复了一句：“哦。” 直到7月16日，AI版王祖贤出现在网易《天下》的广告片中。楚婷将这条消息转发到朋友圈后，这位博主主动联系她：“这个是不是你们正在做的事情？”之后，双方很快完成了签约。 楚婷是浦光星奕公司打造的AI人脸授权平台Mirafans镜界的负责人，找上这些网红们“买脸”的，就是类似这样的新中间商，她形容为“AI时代的选角公司”。从5月开始推进AI形象授权业务至今，平台已经签约近十位千万粉丝博主、近百位百万粉丝博主、近千位KOL及素人。 ●图源：截图 这家公司的前身是MCN机构。去年9月份，团队开始转向AI内容发行。 AI让影视制作成本大幅下降。按业内口径，过去起步资金就要80~100万元以上的真人短剧，用AI制作后，简单作品成本只要几千元，精品项目也可能只需要20万至40万元。但成本降下来之后，一张合法的脸成了新的门槛。 此前，AI漫剧行业习惯直接生成角色，甚至有人参考明星照片或公开视频，再通过模型换脸、拟声。技术把制作成本压低之后，也把肖像权和声音权的问题迅速放大。 2026年第一季度，红果短剧累计下架违规漫剧1718部，专项核查约1.5万部；易烊千玺、邓为、龚俊、李沁、张婧仪、檀健次等多位艺人也在同一时期批量维权，要求下架未经授权使用其形象的侵权短剧；一些素人博主也开始维权，他们发现自己的照片被直接抓取，生成了短剧角色，有人甚至莫名其妙成了反派。 到了7月，红果平台进一步提出AI剧角色需要避免雷同，治理“千人一面”和高频人脸复用；抖音短剧创作者中心也在8月上线预检工具，让AI剧版权方和制作机构可以在成片发布前，对包括肖像权在内的潜在风险进行筛查。 对制作方而言，人脸的使用从一个伦理问题变成了商业问题。 一部据称已经在平台获得两三亿播放量的短剧，因为主角形象被审核认定与杨洋、肖战等艺人高度相似，最终全集下架——这是楚婷了解到的、发生在合作公司身上的真实案例。 谭润华是一家AI漫剧公司的合伙人。从去年年底至今，他们已经制作了上千部B级、C级AI漫剧。 今年春节以后，谭润华第一次因人脸合规，被平台退回项目。此后，大约10%至20%的项目，都因疑似肖像侵权被要求修改。如果只是配角出现问题，重新生成后，还能继续上线。最严重的一次，问题出在主角脸上，整部剧只能放弃。 ●图源：受访者 5月份，楚婷所在公司第二次转向，开始聚焦AI形象的合规授权领域，一边签约明星、网红、演员和素人，一边寻找有需求的工具方、制作方和项目方。交易完成后，公司按照金额抽取一定比例的分成。 需求带动市场。想合规发布的剧方要买脸，交易脸的贸易商出现了，提供脸的卖家也找到了。一张数字脸作为商品的生产与销售就此跑通。 进入这门生意的并不只有小公司。今年4月20日，#爱奇艺AI艺人库#登上热搜。爱奇艺在世界大会上宣布，AI影视制作平台纳逗Pro正式开放商用，同时宣布已有超过100位艺人进入AI艺人库，可以递交AI影视合作申请，写明项目详情，再由艺人方确认是否同意合作。截至8月20日，库中已有118位艺人，陈哲远、丞磊、毛林林、马苏、沈羽洁、曾舜晞等演员均在其中。 ●图源：纳逗Pro官网 现在，楚婷明显感觉到同赛道的公司开始增多。有的专门签素人；有的抓明星资源；有的先搭一个选脸平台，让制作方直接选脸；有的先做出爆款案例，再反过来吸引艺人签约；还有公司直接宣布签约大量艺人，用规模降低市场教育门槛。 市场仍然很早期，商业模式也没有定型。但从一张随手生成的AI脸，到一张有姓名、有粉丝、有授权合同、可以被制作方挑选的脸，人的形象第一次如此清晰地进入了一套新的交易体系。 买方买不起，卖方不放心 一张真人脸可以解决合规风险，但新的问题也随之出现：买不起。 楚婷介绍，目前市场上，同样授权一部60至80分钟的AI影片，千万粉博主的报价可以达到万元以上，百万粉博主大约在千元级，普通素人，多为百元左右。一部剧往往有二三十个角色。 对A级、S级AI短剧项目来说，一张经过授权、形象稳定的脸几乎变成必要投入。但对于靠低成本、规模化生产赚钱的B级、C级AI漫剧而言，这笔账很难算。谭润华所在的公司从去年底开始制作AI漫剧，一部相对简单的剧，成本最低只有几千元。即使购买最便宜的素人授权，成本也接近制作费用的一半。 行业环境也在变差。过去半年，谭润华明显感受到，进入这一行的人越来越多，收益每个月都大约下降20%至30%。低门槛让AI漫剧快速起量，也让竞争迅速饱和。 ●一部AI漫剧的制作设计。图源：受访者 于是，矛盾在买卖双方的交易中出现。 邓以勒是国内AI“图生图”第一案的代理律师，也是较早参与AI人脸授权协议制定的律师之一。在她看来，制作方和艺人天然站在利益的两端。制作方们想要尽可能地扩大使用的空间，而艺人方则想尽可能地限制使用的范围与边界。 这种博弈落在合同条款里。在授权范围上，制作方通常倾向于开放式表达。比如，只规定哪些情况不能使用，通过负面清单划定底线。 艺人方则更倾向于正面清单，把允许使用的场景逐项列明。例如：“授权用途仅限AI短剧、AI动漫作品的策划、AI建模、成片制作、修改、剪辑、翻译、二次加工、全平台发布、直播挂载、流量变现、广告分成、平台收益结算等合法商业运营用途。” 今年找到邓以勒咨询的AI内容制作方，最关心的问题是：“如果参考几个艺人的形象，但最终生成的人脸并不完全一样，这算侵权吗？”“拿到授权之后，使用范围能不能扩大？” 而艺人的问题刚好相反：“别人这样使用我的脸，算不算侵权？”“授权之后，怎么保证对方不会滥用？” 卖方的不安，不只是条款问题。 楚婷公司的主要签约目标，是有流量、且需要维持流量的网红们。 在她接触的网红里，仍有约70%没有立即签约。他们问得最多的问题是“粉丝会怎么看？”“他们喜欢看什么？”“他们会不会觉得奇怪？”等等与粉丝接受度相关的话题。她还接触过一些模特，在他们的圈层里，签约AI会被认为是一种“背叛”。 不过，随着模型技术的提升，人物、画面越来越逼真，行业教育成本越来越低，大家的恐慌情绪逐渐减弱。 楚婷已经接触到一批主动找上门的小演员，他们没有网红的流量，却拥有更专业的表演能力。一位短剧演员表示，过去曾有人找她购买人脸授权，她当时拒绝了。但如果未来作品本身足够好，而且能够在内容里明确挂上自己的个人账号，她并不排斥授权。 在楚婷的设想里，这些演员未来甚至可能拥有一个新的身份，AI的“演技老师”。现在的视频模型已经越来越强，不过模型仍然不知道一个具体的人应该怎么笑、怎么哭、怎样表达愤怒。而演员可以参与训练自己的数字分身：调整提示词，提供表演参考，让AI学习一个真实的人如何完成表情和动作。 明星们的态度也开始松动。王祖贤的AI广告片上线后，楚婷接触过一位70后明星，艺人本人用豆包生成了一张自己的AI图片，发给楚婷：“这是不是就是你们想做的事情？”团队随后给他制作了几版Demo。看到年轻版本的自己重新出现在画面里，艺人很喜欢。 8月15日，《天下》玩家生态大会上，王祖贤也首次回应AI授权。她表示，自己喜欢尝试新事物，这也是一次面对新世界的选择。看到荧幕中的自己，也让她感受到一种“人生仿如隔世”的岁月感。 楚婷代理过的一位艺人，甚至愿意免费授权一个项目。原因是她认可剧本，据公司判断，这部短剧如果上线，可能获得4000万播放量，能够反向提升自己的曝光度。但由于制作方不符预期，最终没有合作成功。 网红们的问题也变了。现在他们更常是：“我的AI形象可以参与什么内容？”“怎么让AI出演更好的作品？”“什么项目更适合我？” 但决定这个市场的，并不只有买卖双方，还有平台。 对于谭润华这样的制作方来说，平台的审核机制依然像是“黑箱”。他们必须一边制作，一边猜规则：什么样的脸容易被退回，哪些明星形象风险高，哪些生成方式相对安全。“我们自己看不出来像谁，但平台会告诉你，像易烊千玺、像白鹿。” 更麻烦的是，这种“像”有时连制作方自己都无法提前控制。8月16日，配音演员马正阳公开质疑，某剧及其插播广告中出现了与自己高度相似的AI声音。制作方解释，声音来自即梦AI自动生成，并未使用真人声音定向训练。但用户听出来了。 问题在于：如果制作方没有主动复制某个人，模型生成的结果就是“像他”，责任该如何判断？ 一旦进入法律纠纷，关键标准是“可识别性”。邓以勒解释，如果普通公众能够从这个AI形象或声音中识别出某个具体的人，侵权风险就会提高。许多人呼吁在疑似侵权作品下留言“感觉像某某明星才点进来”，这类评论对审核方来说，确实可能成为判断可识别性的参考。 制作方购买一张脸，很大程度上不是为了满足自己的审美，而是为了保证作品能够上线。但花出去的钱，并不总能买来这个保证——平台有平台的判定，模型有模型自己的倾向。 脸被卖出去之后 “我用300块钱，买你三年的脸。” 几个月前，这样的人脸购买方式并不少见。价格很低，使用范围模糊，权益保障几乎没有。卖脸的人，大多是普通素人、群演或者小网红。他们只知道可以拿到一笔授权费，却很难想象，这张脸离开自己之后，会被放在哪里，又会以什么样的方式出现。 一张脸被卖出去之后，它可以成为短剧主角，也可以成为广告演员，甚至可以出演一个真人无法完成的角色。 技术已经把脸的生产链跑通了，规则才开始追上来。 邓以勒接到第一个咨询艺人形象授权的案例后，很快意识到，成为商品的不仅仅是脸，还是一个涉及自然人数字分身以及后续衍生开发的综合体，以肖像权、声音权为基础，涵盖人格权益，但又不仅限于人格权益。 经过对国内外理论的研究，邓以勒在合同里将这一系列业务定位为“数字形象经纪业务”，尝试把传统艺人的授权拆解成多个部分：肖像、姓名、声音、数据，以及具体使用方式，再根据AI场景重新组合。 AI授权与传统肖像授权最大的不同在于：传统艺人授权主要围绕肖像使用，但AI时代，授权内容可能还包括面部数据、声音数据等生物特征信息。 传统代言结束，海报、视频等物料定期回收；而面部数据、声音数据一旦被储存，甚至进入后续生成流程，项目结束后究竟怎样删除，能否真正删除，删除到什么程度，都成了新的问题。 于是，在协议中，艺人方可以要求项目结束后删除相关数据资产，并提供截图等证明。但楚婷认为，合同和删除机制，本质上都是“防君子不防小人”，如果有人恶意保留数据，技术上仍然存在风险，目前只能通过数据最小化采集、仅限项目周期内调用、分级存储、审核合作方资质等机制设置保障。 即使最基础的侵权问题能够通过合同、诉讼解决，更模糊的风险仍然存在——AI里的“自己”，不一定会按照脸主人的意愿生活。 8月6日，戚薇授权形象的AI漫剧宣传片上线后，其中一段自下而上推进拍摄人物的镜头引起争议。部分观众认为，这种镜头存在不必要的凝视，甚至带有擦边嫌疑。 楚婷介绍，目前一些AI短剧项目会先制作前五集，再交给授权方审阅。授权方可以提出修改意见，但一般只允许两轮，不可能无限修改。等到全集完成之后，如果出现明显低俗、违规的内容，可以要求调整或下架；但一些更主观的争议，例如一个镜头是否冒犯，一个表情是否符合本人，一个拍摄角度是否影响形象……很难全部写进合同。 ●AI生成的人物参考图。图源：受访者 在人脸审核收紧后，谭润华与合伙人们尝试过制作一部AI短剧，角色都用他们自己的脸。谭润华的脸被用作“男反一”，角色存在调戏女性等行为。谭润华看得不舒服，他还担心，如果这部剧恰好被家里人刷到，会不会影响现实中别人对自己的看法。 这也是很多艺人最初考虑AI授权时反复追问的问题：“AI里的我如果塌房了，真人会不会一起塌？” 楚婷表示，很难把“脸不能塌”“人设不能塌”清晰地写进合同。一个明星授权AI形象出演游戏广告，如果本人过去就有游戏合作，用户与粉丝群体也高度重叠，可能反而强化原有形象。但如果同一张脸被拿去做与本人调性完全不一致的内容，结果就很难预测。 即使这些规则都能被写清楚，回到脸作为商品本身，它究竟值多少钱也是未知数。 那部用谭润华与合伙人们自己的脸制作的AI漫剧，播放效果没达到预期。谭润华后来总结，或许是因为主角们不是“俊男美女”。 据海报新闻，在一些人脸授权交易里，颜值直接被量化成价格：普通人脸一年只值100至200元，而更上镜、更有辨识度的脸可以卖到200至700元，“出众抢眼型”的最高档价格达到800元。 当颜值变成定价依据，脸的价值就彻底交给了市场审美。 如今，邓以勒接触的客户中，已经有人通过MCN一次性签约数千名艺人。人脸买卖市场里，有人拿脸换钱，有人拿脸换流量，有人希望借AI重新获得工作，还有人只是希望自己的数字分身能够出演特别的角色。楚婷设想，未来或许“每个人都能演5分钟戏”。 只是，当所有人的脸都可以被摆上同一个货架，被明码标价、被挑选之后，你仍然很难完全控制数字世界里的自己说什么、做什么、被怎样拍摄，也很难让现实中的自己与它彻底分开。 （应受访者要求，谭润华为化名）\", \"published\": \"Thu, 20 Aug 2026 11:37:35 GMT\", \"source\": \"虎嗅资讯-全部\", \"biz_tags\": [\"industry\"], \"category\": \"short_drama\", \"level\": \"S\", \"why\": \"AI数字人授权模式直接影响短剧制作成本\", \"action\": \"研究Mirafans平台授权流程和价格\", \"opportunity\": \"低成本获取合法数字人形象\", \"risk\": \"授权合规风险\"}, {\"title\": \"梁文锋的阳谋：开源框架，模型涨价\", \"link\": \"https://www.huxiu.com/article/4884654.html\", \"summary\": \"一边将框架免费开源、对接入模型不设限制，一边给自家模型涨价、放弃广受关注的价格优势，作为头部模型厂商，DeepSeek没有跟随其他厂商，用闭源成品争夺入口，而是选择以不同的姿态进入智能体赛道。8月20日，DeepSeek Harness（以下简称DSH）发布v0.1.0-rc.8预发布版本，与此前首发版本相比...... 本文来自微信公众号： 经济观察报 ，作者：刘思璇 一边将框架免费开源、对接入模型不设限制，一边给自家模型涨价、放弃广受关注的价格优势，作为头部模型厂商，DeepSeek没有跟随其他厂商，用闭源成品争夺入口，而是选择以不同的姿态进入智能体赛道。 8月20日，DeepSeek Harness（以下简称DSH）发布v0.1.0-rc.8预发布版本，与此前首发版本相比，新版本增强了多模态支持度、搜索能力，并优化了与外部编程智能体产品Claude Code和Codex的协作模式，让多Agent（智能体）协同更加顺畅。 此次更新距离DSH与大众见面，已经过去了一周。8月13日，DeepSeek这家以模型能力见长的公司在发布DeepSeek-V4-Pro正式版模型的同时，将智能体运行框架DSH的开发者预览版开源。这与国内外多数编程智能体路径不同：后者是对C端大众用户开箱即用的成品，而DSH面向开发者，需要用户自行搭建插件来提供Agent各项能力，上手门槛更高，自由度和定制空间更大。 开源动作之后，8月17日0时DeepSeek新版API价格正式生效。此次调价首次引入峰谷分时计价机制：工作日高峰时段(9:00-12:00、14:00-18:00)的价格为其余时段的2倍。以旗舰模型V4-Pro为例，高峰时段每百万Tokens（词元）输出价格升至27元，较调价前上调约350%。 一边将框架免费开源、对接入模型不设限制，一边给自家模型涨价、放弃广受关注的价格优势，作为头部模型厂商，DeepSeek没有跟随其他厂商，用闭源成品争夺入口，而是选择以不同的姿态进入智能体赛道。 把“满血”DeepSeek交给开发者 DSH并非新模型。在智能体完成任务过程中，模型扮演着脑的角色，DSH等框架扮演着手脚。 一位开发者介绍，智能体能否正确调用工具、连续执行任务，如何验证结果、处理错误，这些都是框架提供的能力。在不同的框架下，同一模型性能表现存在差异。DSH的开源吸引较多关注，与DeepSeek的模型能力关系密切，因为模型本身就是在自家框架下训练的，“理论上说，只有用DSH才能体验到真正满血的DeepSeek模型。” GitHub官方数据显示，截至8月18日，DSH仓库收藏已突破15万、Fork（复制）逾1.6万。 前述开发者告诉经济观察报，DSH的热度在一定程度上只局限于开发者群体。DSH主打“一切皆插件”，用户需要的功能都可以通过写插件来实现，如页面视觉装饰、基础仪表盘、支持识别的文件类型等，自由度高。对于技术背景的用户而言，DSH更像一个创意工作台，可以在产品经理给定的选项之外探索。 一位从事营销工作的用户告诉经济观察报，她体验了半天后便退出了DSH。她需要的是更聚焦专业流程、开箱即用的产品，而不是一切都要手搓的“车间”。由于缺乏相关知识，她在使用过程中需要大量参考社交媒体上其他用户分享的教程，这种对外部教程的依赖，让她对信息安全产生了顾虑，“DSH部署在本地，会不会有恶意插件读我的文件上传到外部？我辨别不了。” “价格屠夫”收刀 使用DSH，用户要自行搭建各类插件，智能体在反复读写项目文件、上下文与系统提示之间，消耗的Token远多于开箱即用式产品，模型涨价让这款免费框架的使用成本显著上升。 一位视频策划领域的DeepSeek模型用户介绍，调用同一模型API、执行同样的工作，涨价前他的日均模型成本在20元以内，涨价当日，他的单日成本上涨到近200元，成本原因让他不愿叠加使用DSH；另一方面，不同框架解决问题的逻辑存在差异，相比于新框架，他更倾向于选择熟悉的产品，Token消耗量更加可控。 把调价后的DeepSeek放进整个模型市场横向对比，曾经显著的低价优势已经减弱。对照各家旗舰模型每百万Tokens的输出价格：国产同梯队里，智谱GLM-5.2为28元、字节豆包2.1 Pro为30元、阿里通义千问Qwen3.8-Max为36元；涨价后，DeepSeek-V4-Pro高峰时段定价27元，价格相对优势明显摊薄。但由于DeepSeek实行峰谷计价，而上述其他厂商为同一定价，综合全时段均值，DeepSeek仍是国产模型中较具性价比的选择。 模型相对低价、且有更能发挥模型能力的DSH加成，是否能吸引Claude Code、Codex等编程智能体产品的部分用户迁移？ 一位大模型公司研发人士认为，现在讨论这一点还为时过早，当前的DSH更像是一个充满想象力的提议，还需要更多来自复杂、高强度生产环境的反馈。在官方发布的内测说明中，DeepSeek将此次开源定义为0.1版本，圈定用户为Harness开发者，并表示产品将“快速迭代、持续演化”。 不抢C端入口，押注框架层生态 DeepSeek不是唯一把执行层开源的公司。国外，谷歌、微软等巨头早已发布过开源框架，另有一款名为Pi的开源编码智能体与DSH存在官方层面的深度适配与集成，双方都对彼此生态表达过认可。 2025年7月，字节跳动旗下火山引擎将智能体开发平台Coze（扣子）的两大核心项目以Apache 2.0协议开源，向开发者开放其智能体编排与运行能力；更早时间，阿里通义千问团队将Qwen-Agent框架面向开发者开源并持续迭代。 前述开发者认为，和其他厂商的开源动作相比，DSH最大的不同在于极致：一切皆插件的底层逻辑让DSH所提供的各项能力可被修改、替换，插件间彼此独立、可以单独升级，“这很适合发展生态，用户有需求就自己写插件来解决，别的用户在此基础上继续扩展。” DSH开源后，多家券商密集讨论，关注智能体执行层开源对商业化与生态竞争的改写。其中，招商证券国际8月17日报告判断，DSH开源的战略意图是从模型层向框架层上移，做\\\"Agent时代的安卓\\\"，通过定义“动态可组合Agent”的运行标准增强生态定义权与开发者绑定度。 前述大模型公司研发人士称，行业内部对待DSH的态度会比行业外更为谨慎，各家不缺让人耳目一新的东西，但这些想法是不是市场需要的，有待验证，“如果DSH真能跑出来、被更广泛的市场用起来，其他厂商跟进的速度会很快。”\", \"published\": \"Thu, 20 Aug 2026 11:17:12 GMT\", \"source\": \"虎嗅资讯-全部\", \"biz_tags\": [\"industry\"], \"category\": \"ai_tools\", \"level\": \"A\", \"why\": \"DeepSeek涨价影响AI工具成本，开源框架带来机会\", \"action\": \"测试DSH框架，评估成本影响\", \"opportunity\": \"基于DSH开发定制工具\", \"risk\": \"模型成本上升\"}, {\"title\": \"阿里+腾讯，一个季度在AI上砸了1000亿\", \"link\": \"https://www.huxiu.com/article/4884645.html\", \"summary\": \"上个星期，腾讯公布财报，资本开支达到了史无前例的527.84亿元，创造了中国互联网大厂最高的单季度资本开支纪录。当时我还以为：“本季度腾讯会不会是国内在AI方面砸钱最多的大厂？”但今天公布的阿里财报，证明我当时完全想错了——阿里的资本开支达到了676.60亿，同比增长75%，让包括腾讯在内的所有竞争对手相形见...... 本文来自微信公众号： 互联网怪盗团 ，作者：怪盗团团长裴培，原文标题：《阿里+腾讯，一个季度在AI上砸了1000亿！》 上个星期，腾讯公布财报，资本开支达到了史无前例的527.84亿元，创造了中国互联网大厂最高的单季度资本开支纪录。当时我还以为：“本季度腾讯会不会是国内在AI方面砸钱最多的大厂？”但今天公布的阿里财报，证明我当时完全想错了——阿里的资本开支达到了676.60亿，同比增长75%，让包括腾讯在内的所有竞争对手相形见绌…… 根据阿里财报原文：“我们持续投入AI基础设施，以满足强劲且不断增长的客户需求。（资本开支）同比增长显著，受多项因素驱动，包括采购周期波动、预期客户持续采购AI智能体导致的CPU算力增加，以及各类芯片组件价格上涨。” 阿里和腾讯的单季度资本开支之和达到了1204.44亿，我认为，其中至少80%与AI直接相关，包括但不限于数据中心建设、服务器和芯片采购，等等。换句话说，仅仅这两家大厂，一个季度之内就在AI上面砸了1000亿。由于字节跳动没有公布财报，我们不知道其资本开支情况如何，但我估计至少与腾讯处于一个量级。这三家大厂加起来，与AI相关的资本开支，可能接近1500亿大关！ 相比之下，百度、快手等其他互联网大厂，单季度资本开支只有60-80亿人民币，被拉开了接近一个数量级的差距。当然，这并不意味着资本市场会不高兴，因为最近两个月趋势有所反转，大家反而更看重现金流。“提高资本开支=提高目标价”的逻辑，似乎正在过时。 短短1-2年前，如果有人说，腾讯、阿里这个级别的消费互联网平台，自由现金流居然会变成负数，那肯定会被人嗤笑。然而，这就是现在出现的事情：腾讯本季度的自由现金流为负138亿，阿里则为负446.7亿。这完全是因为资本开支的上升速度远远超过了经营现金流的上升速度，而且只要AI热潮持续下去，这个趋势恐怕也会持续。 作为上市公司，这也就意味着暂时削减以回购为主的股东回报。今年上半年，一贯以积极回购著称的腾讯，仅回购了价值244亿的股份，同比下滑三分之一；而阿里上个季度仅回购了价值1.6亿美元的股份。 资本市场可能会担心，这种情况持续下去，腾讯和阿里或许需要通过股权融资获得发展AI业务所需的资金。这种现象在美国也不算稀奇了，一贯以现金充裕著称的谷歌，最近就进行了股权融资。不过幸运的是，阿里和腾讯的资本结构目前还算正常，负债率很低，还有较大的腾挪空间。我认为它们在短期内还是会以债权融资为主，如果资本市场环境有利，也不排除发股。 从本季度的财报当中，我们不难得出如下三个基本结论： AI军备竞赛已经进入了一个绝大部分人都负担不起的阶段，在国内，只有阿里、腾讯、字节跳动三家大厂，还留在“AI全产业链布局”的牌桌上；其他大厂和中厂已经自觉退居二线，或聚焦于个别环节。 这场竞赛不太可能在一年内停下来，“三巨头”谁先收手，就意味着落后于另两方；而且需要竞逐的赛道太多了，包括公有云、文本模型、视频模型、办公应用、消费应用……等等等等。 对于算力和存储供应商来说，这是最好的时代，只要你能做出产品，不管水平如何、不管性价比高低，恐怕都会被全球大厂疯抢，唯一的悬念是谁赚的更多，反正大部分人都有钱赚。 阿里和腾讯的财报还进一步破除了一种迷思：硅谷大厂的AI烧钱竞赛是因为它们“不聪明”，“买贵了”，“没有掌握低成本推理技术”，“水电和基建成本高”，等等。按照这些人的观点，在DeepSeek和Kimi走红之后，英伟达和海力士都早已被验证为骗局，在AI行业确实存在低成本的“弯道超车”途径，而且不知道为什么，这种“弯道超车”策略只适用于少数中国企业。 现在的局面很清楚了：在AI基建领域，低成本的“弯道超车”战略并不存在。无论国内的水电和基建成本有多低，无论国内企业掌握了什么样的“低成本推理技术”（注：实为模型激活参数不同导致的推理成本差异），该投的钱总归要投，该买的芯片总归要买。就连很多人心目中“戳破了AI基建泡沫”的DeepSeek，融资之后的第一件事情，都是建设大型数据中心。 目前最大的悬念，是AI模型及应用收入迅速增长的局面还能持续多久。今年年初以来，全球AI行业的收入增量绝大多数来自Agentic Coding&amp;Workflow,一小部分来自以视频为主的多模态任务。这个势头进入7月似乎有所减缓，有人认为Vibe Coding的渗透率已经够高了，随时可能见顶；但也有人认为AI主导的协同办公浪潮才刚开始。 如果全球AI应用收入增长的势头能持续，那么不但硅谷巨头砸钱的决策是合理的，国内大厂砸钱的决策也是合理的。但是如果这个势头在今年下半年或明年年初出现了反转，那么大家可能就要重新检讨资本开支计划了。 我期待着未来新的变化。生活在这个科技进步一日千里的时代，我们是幸福的，但人与人的幸福并不相通——此时此刻最幸福的显然是算力和存储产业链的投资人，而不是平台大厂的投资人。 本文没有获得阿里、腾讯或任何国内或国外互联网大厂的资助或背书。\", \"published\": \"Thu, 20 Aug 2026 10:56:19 GMT\", \"source\": \"虎嗅资讯-全部\", \"biz_tags\": [\"industry\"], \"category\": \"industry\", \"level\": \"B\", \"why\": \"巨头资本开支增加，AI基础设施成本可能上升，影响短剧制作成本。\", \"action\": \"关注AI算力成本变化，评估对短剧制作成本的影响。\", \"opportunity\": \"无\", \"risk\": \"AI工具成本可能上升，挤压利润空间。\"}, {\"title\": \"“火车让座之争”牵出的关键议题：异质化社会如何“共同生活”\", \"link\": \"https://www.huxiu.com/article/4884589.html\", \"summary\": \"8月18日，据媒体报道，江苏一趟列车上，两名女孩购买了三张火车硬座票，其中一张座位用来放置零食。旁边的一名无座女乘客想坐，商量无果找来列车员调解。女乘客称“大家都在一个车上，互相体谅对不对”，列车员则表示“座位是她们的，跟我说没用”。8月20日，话题&amp;ldquo...... 本文来自微信公众号： 探索与争鸣杂志 ，作者：贺来（吉林大学哲学基础理论研究中心暨哲学社会学院教授，教育部长江学者特聘教授），题图来自：AI生成 8月18日，据媒体报道，江苏一趟列车上，两名女孩购买了三张火车硬座票，其中一张座位用来放置零食。旁边的一名无座女乘客想坐，商量无果找来列车员调解。女乘客称“大家都在一个车上，互相体谅对不对”，列车员则表示“座位是她们的，跟我说没用”。8月20日，话题“12306回应买票占座放零食这座位能让吗”登上热搜第一，引发网友热议。部分网友表示，座位空着放零食，人却在旁边站着，不仅不近人情，而且属于浪费公共资源；另一部分网友则强调，让是情分，不让是本分，买票者有权决定是否让座。 该事件中，网友们关于“不让他人坐自己买下的空座，算不算缺乏公德？”这一问题产生了较大的分歧，并在道德绑架与反道德绑架的立场之争中相持不下。而这一事件背后，更为关键的是，面对这种道德分歧与社会团结的矛盾，如何妥善处理二者之间的关系？如何重新审视权利在道德生活中的地位？如何在异质化的现代社会寻求“共同生活”的伦理之道？本刊曾于2024 年第 5 期发表相关圆桌笔谈，目的是回应现代化进程中伦理道德发展的新方向、新问题、新挑战。该组笔谈对此事件亦有启示，本公众号特推出此组文章，供读者参考。 现代化是人类近几百年来最为重大的历史变迁，它开拓了一个传统社会无法比拟的更广阔和开放的空间，并对人与人的伦理关系产生了深远影响。在异质化的现代社会寻求“共同生活”的伦理之道，是西方和中国现代化进程都难以回避的重大伦理挑战之一。 异质化的现代社会“共同生活”何以可能 人的伦理生活在深层总是受到其生存方式的制约和规定。马克思曾指出：“我们越往前追溯历史，个人，从而也是进行生产的个人，就越表现为不独立，从属于一个较大的整体”，“人的依赖关系（起初完全是自然发生的），是最初的社会形式”。也就是说，无论是“亚细亚”“古代”，还是“日尔曼”类型的传统社会，人对共同体的无条件依赖构成了生存方式的根本特质。这一点决定了传统社会人们的伦理生活必然是以共同体为中心的。然而，现代化的进程不可逆转地终结了这一生存方式，社会生活的分化和异质化趋势导致传统共同体的全面解体，从而使人们的伦理生活面临全新的境遇。 在哲学史上，黑格尔曾从“个人主观性的自由”的角度深入阐发了现代社会的这种分化和异质化趋势，以及由此产生的重大伦理后果。黑格尔认为：“一般说来，现代世界是以主观性的自由为其原则的，这就是说，存在于精神整体中的一切本质的方面，都在发展过程中达到它们的权利的”，正是这种个人“主观性的自由”，打破了传统社会以共同体为中心的直接的、非反思的有机整体，导致希腊城邦那种“优美的统一性”不可避免地走向解体。基于这一自觉认识，黑格尔把如何实现“主观性”的个体自由与普遍性的“伦理实体”的协调、和解与统一视为“现时代”最为根本的伦理任务，并在其《精神现象学》《法哲学原理》等著作中系统阐发了他对现代社会所面临的这一特殊伦理处境的解读、反思和回应。 如果说黑格尔是以一种哲学思辨的方式对此进行了探讨，那么，社会理论家对此的阐发则更为直接和具体。滕尼斯、韦伯、涂尔干等现代社会理论家以理解现代社会相对于传统社会的重大变迁为己任，虽然他们立论的出发点和思考进路不尽相同，但他们均指出，“分化”和“异质化”构成了现代社会的本质性特征。滕尼斯以“共同体”，韦伯以“目的论的世界秩序”，涂尔干以“机械团结”等核心概念概括传统社会的“未分化性”和“同质性”，并以“社会”“有机团结”“诸神的争斗”等概念来描述现代社会“异质化”和“分化”的特质。在这种异质化和分化趋势形成过程中，“个人主体性”的兴起被视为最为核心的因素和力量。如滕尼斯指出，与“共同体”不同，在现代社会，社会的基础是个人、个人的思想和意志。涂尔干认为，与“机械团结”不同，“集体意识”的弱化和由社会分工所形成的个体人格是现代社会的根本特征。而在韦伯看来，与“目的论世界秩序”不同，随着现代社会工具理性占据主导地位以及“世界的祛魅”，个人而非共同体成为价值的出发点与归宿。当代另一个社会理论家鲍曼对上述趋向作了简洁而深刻的提炼：“把社会成员铸造成个体，这是现代社会的特征。” 现代社会的异质化和分化给现代人带来全新的伦理境遇和伦理课题。它意味着，人们的伦理生活不再以同质的、未分化的、前现代的共同体为中心，而是要直面现代社会的异质化和分化这一基本现实并回答：在“个人主体”成为新的伦理主体的条件下，人们共同的伦理生活如何成为可能？传统社会以前现代的共同体为中心，人们共同的伦理生活具有无需质疑的自明性，但是，在现代社会的异质化和分化的背景下，这种自明性已不复存在。当人的身份不再基于“与生俱来”的共同体依赖关系，而是通过个体自觉的选择和活动实现自我决定，那么，人们共同的伦理生活如何成为可能？如何在这种异质化和分化的条件下探求“共同生活”的伦理之道？ 这一伦理课题的复杂性在于，现代社会的异质化和分化凸显了传统社会的伦理生活所不存在的伦理挑战：以个体化原则为出发点，如何能通向他人，与他人建立一种具有“共同感”的伦理关系？对此，哲学家和社会思想家们从多方面进行了深入的揭示。例如，麦金泰尔等哲学家指出，个体化原则必然导致伦理价值上的个体主义兴起，从而使社会团结失去所必需的内在精神纽带；黑格尔等哲学家指出，个体化原则内蕴的“对象化逻辑”必将导致人与人之间的隔离、分裂和对立，进而使伦理共同体面临解体的危险；托克维尔等思想家指出个体化原则容易助长社会成员对公共利益和公共事物的怀疑和冷漠态度，从而使人们失去对社会团结的愿望和信心；等等。 回应这一伦理挑战，意味着要克服现代社会的异质化和分化所形成的“异质化”与“统一性”、“分歧性”与“一致性”、“特殊性”与“普遍性”、“个人自由”与“伦理秩序”等之间的一系列深层矛盾。现代社会的异质化和分化，突破了传统社会封闭、僵化的抽象共同体的专制，尤其它为个人的主体性和独立开辟了前所未有的发展空间，这是现代社会巨大的历史成就。现代社会人们的伦理生活对此必须予以积极的保留和肯定，但另一方面，如同前述思想家们所深刻反思并揭示的那样，如果个人主体性膨胀为实体化的、绝对化的存在，并使现代社会的异质化和分化趋势丧失了必要的约束和限制，那么，人们伦理生活共同体就将因此瓦解、崩溃。 以“家”“国”为中心的中国传统伦理体系的限度 在异质化的现代社会寻求人们“共同生活”的伦理之道，这是每个追求和推动现代化的社会都需面对的伦理课题，中国社会的现代化也不例外。为此，我们需要对中国传统伦理体系进行批判性反思，既吸取其有益的资源，同时对其局限性有充分的自觉。 摒弃抽象的观念主义立场，从现实生活出发来理解中国传统伦理体系。可以看到，在这一体系中，“家”以及作为其扩充的“国”具有中心的地位。其中，“家庭”最为基础，“家族”是“家庭”伦理在宗法层面的扩大，“国家”则是“家族”宗法伦理在国家治理层面的进一步扩大，这也是被诸多学者所概括并阐发的传统中国社会组织结构的“家国同构”特征。在“家庭”中，父子关系具有根本性的意义，从父子关系出发，进一步延伸到兄弟、夫妻关系；君臣关系虽然是国家制度层面的臣属关系，但由于“国”与“家”具有同构性，君臣如同父子，就此而言，君臣关系实质是父子关系在国家层面的映射和放大。以家庭伦理关系为基础向外类推，形成传统中国社会最为重要的伦理规范，所谓“三纲五常”“三纲六纪”“五伦八德”即构成这些伦理价值规范的核心内容。在所有这些关系中，父子关系与兄弟关系是最为重要的“两伦”，其他各伦皆是由这两伦演化和类推出来的。在此意义上，以自然血缘亲族关系为中心并向外扩展，把家庭伦理、家族宗法伦理和国家政治伦理贯通，构成了这一伦理体系的特质。无论是“修身齐家治国平天下”所蕴含的“外推式”伦理进路，还是“以孝治天下”所代表的伦理纲领，等等，均从不同方面体现了这一特质。 立足于今天现代化的历史坐标反观上述传统伦理体系，我们必须承认它在几千年的历史长河中对于增强中华民族凝聚力、提升文化认同、促进社会和谐和民族团结等所发挥的不可替代的重要作用。在今天，它所蕴含的诸多伦理价值，经过批判性继承和创造性转化，在现代文明的建设中仍具有重要的意义。与此同时，我们也需要反思它在现代社会异质化和分化的新的历史语境中所面临的巨大挑战。 中国传统伦理体系是与中国传统社会以自然经济为基础的生活世界紧密关联在一起的。林安梧先生曾将这一生活世界的特点概括为“三性”，即土根性、血缘性与道德性，并指出这三者不是彼此独立的，而是相互融合、捆绑在一起的，乡土性社会也是血缘性社会，同时也是道德性社会。费孝通先生则从社会学和人类学的视角出发指出，“从基层上看去，中国社会是乡土性的”，这样的社会是区别于“法理社会”的礼俗社会。虽然学科视角不同，但他们均揭示了中国传统伦理体系与中国传统的以血缘共同体和地缘共同体为基础组成的生活世界之间的内在亲和性。 正是基于这一深层根源，中国传统伦理体系中以“家”和“国”为中心的伦理意义与黑格尔在《法哲学原理》中从现代性反思的语境出发所讨论的“家”和“国”的伦理意义有着显著的区别。在后者那里，家庭虽以自然血缘关系为纽带，但其目的是培养合格的、具有社会公德的公民，家庭最终要走向分化并进入社会，而“市民社会”以“个体的自由”为基本原则，以“个人主观性”的充分发展为基础。黑格尔所谓“国家”也非未分化的共同体，而是通过对市民社会的扬弃所实现的“特殊性”与“普遍性”相统一的伦理实体。与之不同，中国传统伦理体系是以自然血缘为基础外推而成。对于这种通过类推所建立的伦理关系，费孝通先生曾以“差序格局”概念为核心进行阐发。所谓“差序格局”，“是一个‘一根根私人联系所构成的网络”，因此形成的道德是一种“维系私人的道德”，“从己向外推以构成的社会范围是一根根私人联系，每根绳子被一种道德要素维持着。社会范畴是从‘己’推出去的，而推的过程里有着各种路线，最基本的是亲属：亲子和同胞……向另一路线推是朋友”，“中国的道德与法律，都因之得看所施的对象和‘自己’的关系而加以程度上的伸缩”。“以‘己’为中心，像石子一般投入水中，和别人所联系成的社会关系，不像团体中的分子一般大家立在一个平面上的，而是像水的波纹一般，一圈圈推出去，愈推愈远，也愈推愈薄”，所谓“人伦”，“就是从自己推出去的和自己发生社会关系的那一群人里所发生的一轮轮波纹的差序”。如同波纹所及的距离是有限的一样，这种伦理关系往外类推的限度就在于，它随时随地以“自己”为中心，只有与“自己”具有血缘亲情关系，至少也是“亲近”和“熟悉”的人，才能进入自己的伦理关系网络中。“波纹”的运动距“自己”这一中心越远，其力量越小，最终消失于无形。 然而，正如前面所述，现代社会形成了一个与传统社会有着巨大差异的生活世界，其异质化和分化的性质使之根本不同于乡土性、血缘性以及以此为根据形成的前现代共同体。人与人之间的互动大大超出了以亲人、熟人等私人关系为轴心的关系网络，取而代之的是流动的现代性中陌生的个人主体之间极为广泛的社会交往关系。无法进入这一伦理网络之中的他人、生人、外人、路人等将被排斥在外，成为“被遗忘者”甚至“被遗弃者”而无法获得其应有的伦理价值。无论在口头上多强调“推己及人”“四海之内皆兄弟”，只要维持这种“差序格局”，它对异质性的他人的承认必然是有限度的。 毋庸讳言，中国传统以“家”和“国”为中心的伦理体系与异质性和分化的现代社会之间的确存在着巨大的冲突。费孝通先生说得颇为中肯：这种伦理秩序在“陌生人面前是无法应用的”。观察今天人们的现实生活，诸如“小悦悦事件”“老太太摔倒了要不要扶”等争论，我们也许可以从一个侧面看到在异质性和分化的现代社会中，上述传统伦理体系在面对现代社会不存在“私人关系”的他人时所具有的深层局限性。 “为他人的个人主体性”：在异质化中实现“共同生活”的辩证中介 在异质化的现代社会寻求“共同生活”的伦理之道，需要关注两种抽象的伦理原则并克服其带来的实践困境：一是现代化进程中日益凸显的抽象的个人主体性原则，其无限制的膨胀将导致伦理共同体的瓦解，从而使“共同生活”变得不可能；二是前现代的抽象共同体原则，前述中国传统中的“家”“国”伦理体系是其体现，它以个人对共同体的依赖和对外在于共同体的他者的排斥为条件，这使得它无法应对异质化的现代生活。面对现代世界以及由此所导致的“异质化”与“统一性”、“分歧性”与“一致性”、“特殊性”与“普遍性”、“个人自由”与“伦理秩序”等之间的矛盾，这二者各自固执于其中的一极，均无法找到推动这一系列矛盾关系辩证和解的现实出路。 为此，我们需要找到调和上述矛盾关系、推动矛盾双方良性互动的辩证中介。在我们看来，这种辩证中介就是“为他人的个人主体性”的培育和生成。 “为他人的主体性”是对异质化和分化的现代社会所形成的“个人主体性”的一种改良方案。它充分意识到，要克服现代化进程中社会异质化所造成的新的矛盾，决不能以一种浪漫主义态度退回到未分化的、同质性的传统共同体。正如马克思所批评的那样：“留恋那种原始的丰富，是可笑的”，否则，所确立的所谓“共同生活的伦理之道”将以抑制个人主体性的充分伸展为代价，它所确立的只能是一种虚假的、抽象的“共同性”。但另一方面，也不能停留于实体化的、自我中心主义的个人主体性，如阿多诺所言：这种“主体”“永远锁闭在它的自我中”，只能“通过堡垒墙上的瞭望孔来注视夜空”，在这种意义上，这是一种“为己”的、把他人视为“客体”的“个人主体”，从此出发，只能导致人与他者之间的对抗和分裂，从而使得“共同生活”成为不可能。“为他人的主体性”正是基于上述自觉理解，要求在保留现代社会“个人主体性”积极成果的条件下，克服其离心和排他倾向。如果说“留恋那种原始的丰富，是可笑的”，那么，“相信必须停留在那种完全的空虚化之中，也是可笑的”，只有在“为他人”的开放性之中，“个人主体性”才能避免其陷入“完全空虚”而成为沟通上述矛盾关系的辩证中介。 “为他人的个人主体性”与近代以来的“为己”的、自我中心的“个人主体性”相比，有两个根本区别。 第一，它要求在与他人的“共在”中理解“自我”的存在。按照麦克弗森等人的观点，现代社会的个体自我实质上是“占有式个体”，这种占有性既表现为“自我所有”，也表现为“物的所有”，前者意味着“对自己的支配和控制权”，后者意味着“对物质财产的支配和控制权”，其深层信念是“我占有故我在”。马克思曾深刻地指出，这种“占有性个体”并非建立在人与人的结合之上，而是以人与人相分离为基础。它不仅不能确证人的真实存在，相反，只有超越和扬弃这种占有性和隔离性，在与他人的“共在”中，人才能确立自身真实的存在。马克思从人作为“社会存在物”的角度出发，对此进行了深入的阐述：人的生命表现，“即使不采取共同的、同他人一起完成的生命表现这种直接形式，也是社会生活的表现和确证。人的个体生活和类生活不是各不相同的，尽管个体生活的存在方式是——必然是——类生活的较为特殊的或者较为普遍的方式，而类生活是较为特殊的或者较为普遍的个体生活”。在马克思看来，个人生活与类生活具有内在的统一性，二者的分裂所体现的是人的自我异化。扬弃这种自我异化，使得每个人既是“他自己为别人的存在”，同时这个别人的存在，“也是这个别人为他的存在”。这意味着，不是排他性的自我占有，而是在这种与他人的“共在”中，每个人才确立和获得其真实的存在。 第二，它强调每一生命个体通过与他人建立能动的创造性关系，生成共同的生活世界并从中获得存在的意义和生活的幸福感。“为己”的个人主体性之所以坚持“我占有故我在”，在于它把自我利益和欲望的满足视为存在的意义和生活幸福的终极根源。这是现代人对个人存在意义和价值的一种片面化和抽象化理解。事实上，人作为社会性的存在，其生存状况、生命品质和生活前景均深受人与他人之间社会共同生活的影响和制约。因此，只有通过实践活动，创造一种合理的社会关系，每个人的存在意义和幸福生活才能获得根本的保障。因此，投身和贡献于这种社会关系的创造，是个人真实的主体性得以生成的重要内容和标志。对此，近代以来的不少哲学家已做过深刻的反思和阐发。例如，美国哲学家杜威把现代社会以占有为目的的个人主义称为“旧个人主义”，认为其极端膨胀恰恰使个人失去了真正的主体性。他强调：“个性的稳步恢复伴随着旧的经济和政治个人主义的废除——它将解放我们的想象力和干劲，从而使合作的社会有助于丰富其成员的自由文化”，区别于“旧人本主义”，这种着力于“个性恢复”的个人主义是一种“新的个人主义”，它意在消除个人与社会之间的对立，因而可称为“社会的个人主义”。再如，法国哲学家列维纳斯通过对近代以来狭隘的“主体性”观念的反省，强调应把人的“主体”描述为“同中之他”，把与“他者”的相遇视为“主体”的内在构成要素，把对“他人”的责任视为“主体性”的确证与自觉。这种区别于“自我中心主义”的“主体性”，列维纳斯称之为“为他人”的“人本主义”。尽管这些哲学家的出发点和思路有区别，但在强调对他人的开放性和在创造性关系中重塑“个人主体性”的努力上，他们展现出共同的旨趣。 从上述简要阐发可以看出，“为他人的个人主体性”体现出内在统一的双重关切：一方面，它对异质化和分化以及由此所形成的现代个人主体性这一历史成果充分肯定和珍视；另一方面，它对个人与社会以及与之内在关联的“异质化”与“统一性”、“分歧性”与“一致性”、“特殊性”与“普遍性”、“个人自由”与“伦理秩序”等之间相辅相成、相互渗透的辩证关系给予注重和伸张。它要拆除个人与他人之间截然分隔的藩篱，沟通上述一系列矛盾关系，推进它们的辩证和解，并强调只有在这种辩证关系中，那种既充满个性，同时又通过自由的交往、合作和联合而形成的共同生活才成为可能。 “为他人的个人主体性”为异质化的现代社会中人们追求“共同生活”的伦理之道提供了一种辩证中介。其出发点虽是“个人主体性”，但着眼点和落脚点在于探求“主体间”良性互动的合理伦理关系。我们相信，通过人们的实践活动，不断培育和生成这种新型“主体性”的过程，也将是人们共同生活的伦理之道的创造和呈现过程。 本文来自微信公众号： 探索与争鸣杂志 ，作者：贺来\", \"published\": \"Thu, 20 Aug 2026 10:45:15 GMT\", \"source\": \"虎嗅资讯-全部\", \"biz_tags\": [\"industry\"], \"category\": \"other\", \"level\": \"B\", \"why\": \"社会议题，与业务无直接关联。\", \"action\": \"无需行动。\", \"opportunity\": \"无\", \"risk\": \"无\"}, {\"title\": \"LV在中国“大撤退”：西南门店腰斩，贵州唯一门店也关了\", \"link\": \"https://www.huxiu.com/article/4884640.html\", \"summary\": \"近期，LV在中国掀起了商标维权风暴，同时，其在中国西南地区加速了撤退步伐。LV贵阳荔星中心门店对外宣布将于2026年8月31日起停止运营。据《贵圈》栏目统计，LV已经在中国西南地区接连关闭三处关键点位，西南五省的门店网络数量已腰斩过半，仅剩3家门店正常运营。事实上，近一年以来，LV在华的门店网络正经历一次残酷...... 本文来自微信公众号： 新浪财经 ，作者：闫妍 近期，LV在中国掀起了商标维权风暴，同时，其在中国西南地区加速了撤退步伐。 LV贵阳荔星中心门店对外宣布将于2026年8月31日起停止运营。据《贵圈》栏目统计，LV已经在中国西南地区接连关闭三处关键点位，西南五省的门店网络数量已腰斩过半，仅剩3家门店正常运营。 事实上，近一年以来，LV在华的门店网络正经历一次残酷的“修剪”，包括北京首都机场店等门店都已宣布关闭。关于本轮门店调整的真实考量，《贵圈》栏目向LVMH集团发起问询，截至发稿暂无回应。 与门店退潮几乎同步，LV在中国掀起的商标维权风暴，亦将品牌推上了舆论的风口浪尖。 关闭唯一门店， 撤出贵州市场 2022年8月18日，LV正式揭幕位于贵阳荔星中心的全新专卖店。这是LV位于中国贵州的首家门店，也是其进入中国市场三十年来在西南腹地布下的重要一子。 贵阳地处中国西南内陆地区腹地，是贵州省省会及连接川、渝、滇等省份的重要交通枢纽。贵阳荔星中心于2022年8月18日正式启幕，定位为贵阳首座奢侈品购物中心，承载着填补贵州高端商业空白的使命。 据媒体报道，LV门店落位于该商场一层核心位置，分别开设男装与女装独立专卖店，总营业面积逾700平方米。开业当天，门店销售业绩即突破1000万元，显示出贵阳乃至贵州市场对高端消费的强劲需求。 然而，仅四年光景，局面已发生根本性转变。 近日，LV贵阳荔星中心门店宣布将于2026年8月31日正式停止运营。这是LV在贵州省的唯一一家门店，此番关停也意味着LV将彻底退出贵州市场。对于关停的理由，官方给出的说法是“根据现有规划，为持续优化零售网络布局以提供更具创新性与沉浸式的品牌体验”。 一位贵阳本地消费者不无遗憾地向《贵圈》栏目表示，“2025年卡地亚和GUCCI等奢牌已经先后撤离了荔星中心，LV成为这座商场奢侈品‘最后的堡垒’。如今，这个堡垒也要撤走了。” 针对贵阳门店的关闭原因及未来贵州市场是否有新开店计划，LV官方客服回应称：“暂时没有相关门店闭店的具体理由和相关信息。”当被问及门店关闭后，消费者售后服务和VIP权益要如何保障时，客服表示：“我们线上有维修入口，如有需要可以在线提交申请。” 鞋服行业品牌战略咨询专家、上海良栖品牌管理有限公司创始人程伟雄向《贵圈》栏目表示，LV贵州撤店是多重因素叠加的结果，本质是放弃低效网点，把资源向核心市场集中。 他进一步分析表示，“宏观层面，整体消费环境承压，替代品类也分流了不少其潜在客群；其次，城市商业格局迭代，原有优质商圈位置价值发生偏移，部分门店区位优势已经不复存在；渠道层面，随着线上渠道成熟，像贵州这类区域，线上即可承接需求，线下开店投入产出并不划算。” 西南版图“腰斩”， 全国门店加速收缩 LV撤出贵州，并非孤立的个案，而是其在西南市场一场系统性撤退的缩影。 据《贵圈》栏目统计，仅半年时间内，LV在中国西南地区已接连关闭三处关键门店。今年2月，运营超过15年的昆明金格百货时光店正式关门；6月中旬，开业仅五年的成都天府国际机场店也宣告歇业。随着贵阳门店的谢幕，LV在西南五省的门店网络数量已腰斩过半，仅剩3家仍在运营。 具体来看，这三家门店各有其代表性。2026年2月28日，LV昆明金格百货时光店正式关闭。据悉，这家门店于2011年开业，是LV布局云南市场的重要落子，运营时长超过15年。 紧随其后的是，6月中旬LV成都天府国际机场门店宣布正式关闭。公开信息显示，这家门店开业于2021年，是LV继北京大兴机场、上海虹桥机场之后在中国内地布局的第三家机场门店。 如今，轮到了贵阳，这座曾被视作西南最后一块拼图的门店，在开业四年后也走到了终点。从昆明到成都再到贵阳，LV在西南五省的门店网络数量已腰斩过半，仅剩3家门店正常运营。关于本轮门店调整的真实考量，《贵圈》栏目向LVMH集团发起问询，截至发稿暂无回应。 西南收缩，只是LV中国整体战略调整的一个切面。近两年来，LV在华门店网络的“修剪”是系统性的，且收缩速度明显加快。 在此之前，LV北京首都机场店也宣布关闭。这些门店的关闭，涵盖了一线城市核心商圈、交通枢纽、概念型门店等多个业态类型。这也意味着，这轮关店并非只针对西南区域，而是一场覆盖全国的零售网络优化行动。 值得关注的是，在多地门店收缩的同时，LV也在进行着另一种形式的扩张。2025年，LV在上海兴业太古汇开出巨型概念空间“路易号”。去年年底，北京三里屯太古里LV之家也正式亮相。这一收一放之间，战略意图清晰可见——LV正在将资源集中投向一线及新一线城市中最具影响力的商业体。 奢侈品专家、要客研究院院长周婷向《贵圈》栏目表示，西南区域的调整确实是全国渠道优化的前奏，后续其他区域会逐步跟进同款的“精简网点、升级单店”策略，这是门店结构的分级升级策略。“这是一次明确的战略性主动取舍，而非业绩承压下的被动收缩，核心判断逻辑很简单，若因业绩压力调整，奢侈品品牌的常规动作是下沉拓店、增加触点冲规模，而非主动收缩网点。LV选择主动关店，恰恰说明它无需靠门店数量换业绩，而是要靠渠道质量守住品牌溢价。” 在她看来，后续全国范围的调整不会是大面积闭店，而是精准优化。“核心城市保留并升级旗舰大店，非核心点位、低效百货店、交通枢纽店会逐步出清，最终形成核心城市标杆店+线上全域服务+私域深度运营的全新渠道格局。” 年内股价已累计下跌28% 7月27日，LVMH集团交出了2026上半年的成绩单，营收达386.44亿欧元，有机增长2%，净利润达56.97亿欧元，与去年同期几乎持平。 从表面看，这份成绩单尚属稳健，但细拆之下，隐忧已然浮现。具体来看，时装与皮具业务有机下降1%，第二季度1%的增长低于市场预期的1.52%；包括中国在内的亚洲市场增速从第一季度的7%滑落至第二季度的4%。反映在资本市场上，财报发布之前LVMH股价年内已累计下跌28%，投资者信心明显承压。 在财报业绩会上，面对“上半年在中国业绩没有好转”的提问，该公司首席财务官塞西尔·卡巴尼斯坦言，中国本地及旅游客群需求上半年“基本持平”，中国消费者正日益围绕购物节点集中消费。但这也意味着，非促销周期的日常动销依然疲软。 然而，LV在中国市场面临的挑战远不止于销售数据的疲软。近年来，品牌密集发起的商标维权行动，同样引发了舆论与市场的广泛关注。 公开数据显示，近5年LV在中国发起的商标维权诉讼高达1691起，仅2026年上半年就新增56起。被告对象覆盖面极广，从新茶饮品牌茉莉奶白到南京街头的鸭血粉丝店，从珠宝首饰、葡萄酒到厦门某小区沿街服装店，甚至连国家知识产权局也已被LV起诉了6次。维权范围之广、起诉频次之高，在奢侈品行业内实属罕见。 密集的诉讼行动迅速引发了舆论反弹。社交媒体上，“吃相难看”“货卖不动捞偏门”等批评声浪渐起。据媒体消息，受此次舆论影响，上海等多地LV门店客流出现明显下滑，部分热门款二手市场价格也随之“跳水”。 在业绩会上，法国巴黎银行分析师直接发问：“LV集团上半年在中国业绩没有好转，与茉莉奶白的诉讼是否有关？”其首席财务官回应称，知识产权是“绝对的核心资产”，但以案件仍在司法流程中为由未正面作答。 在周婷看来，“密集维权与渠道收缩，本质上都是LV维护顶奢品牌价值、巩固品牌壁垒的一体两面，前者面向品牌资产，后者面向渠道终端。长期来看，LV在中国市场仍具备明确增长空间，一是消费升级底层逻辑未变，奢侈品消费向头部集中的趋势仍在延续，越处于金字塔顶端的品牌，抗周期能力越强；二是品牌护城河稳固，箱包、成衣、珠宝多品类均有布局，多元产品矩阵足以持续挖掘高净值客群的消费潜力；三是运营逻辑已从渠道运营转向客户资产运营，私域与会员体系的逐步成熟，会成为未来业绩增长的新支撑。” 但她也表示，随着中式奢侈品牌快速崛起，以老铺黄金为代表的本土高端品牌正分流高端客群的注意力与消费预算，对传统国际奢牌形成差异化竞争，此外年轻群体中“去logo化”“轻品牌化”消费趋势显现，符号化消费吸引力下降，对靠标识辨识度起家的LV构成长期挑战。“本轮维权引发的舆论反噬，一定程度上损害了品牌大众好感度，如何平衡知识产权保护与公众情绪，是其接下来需要处理的重要课题。”\", \"published\": \"Thu, 20 Aug 2026 10:31:08 GMT\", \"source\": \"虎嗅资讯-全部\", \"biz_tags\": [\"industry\"], \"category\": \"other\", \"level\": \"B\", \"why\": \"奢侈品行业动态，与AI内容出海无直接关联。\", \"action\": \"无需行动。\", \"opportunity\": \"无\", \"risk\": \"无\"}, {\"title\": \"长内容的AI难题，影视公司怎么解\", \"link\": \"https://www.huxiu.com/article/4884636.html\", \"summary\": \"长内容观众对劣质AI内容的抵触，倒逼着制作方必须坚守精品化路线。不追求全盘AI化，而是利用AI深度参与真人实拍的流程制作，同时发展多元产品条线，是目前真正能跑通且口碑站得住脚的做法。多位漫剧人士曾对我们表示，长视频平台与传统头部影视公司的AI动作「非常慢」，长周期的制作流程制约了产出速度。与微短剧赛道的狂飙突...... 本文来自微信公众号： 叁拾代 ，作者：叁拾代 长内容观众对劣质AI内容的抵触，倒逼着制作方必须坚守精品化路线。不追求全盘AI化，而是利用AI深度参与真人实拍的流程制作，同时发展多元产品条线，是目前真正能跑通且口碑站得住脚的做法。 多位漫剧人士曾对我们表示，长视频平台与传统头部影视公司的AI动作「非常慢」，长周期的制作流程制约了产出速度。与微短剧赛道的狂飙突进相比，全流程AI制作在横屏长内容领域的渗透实际上要慢得多。 这种「慢」的背后有着根本的市场逻辑：横屏长剧与竖屏短剧面对的受众截然不同。短剧观众往往为情绪付费，对画面的包容度较高；而长剧及电影观众则是为品质付费，对精品化感有着极其明确的要求。 因此，市面上那些试图尝试全流程AI制作的长内容，或是呈现出明显低质AI元素的作品，几乎都遭到了观众的负面反馈。无论是首部上星播出的AI中剧《桃花潭记》，还是国内首部拿到公映许可的AI长片《奇谭》，播出后激起的水花均十分有限，未能孕育出真正的破圈之作。长剧《这一秒过火》更是因为片头使用了AI技术，就被观众强烈吐槽充满廉价的「网游感」，最终迫使制片方出面致歉重制。 相比之下，不追求全盘AI化，而是利用AI深度参与真人实拍的流程制作，是目前真正跑通且口碑站得住脚的做法。 华策影视出品的历史正剧《太平年》有着AI特效的深度参与：可灵AI承担了部分虚拟场景和特效镜头的制作，将原本需要两个月的传统海浪流体特效缩短至两周完成。总导演杨磊划下了一条不可逾越的红线：「剧中绝不会直接用AI视频画面作为最终完成画面。」这种克制的人机协同保住了剧集的品质，观众也并未感到视觉上的违和。 透过过去一年间密集的行业动作，影视公司的AI布局落点已逐渐清晰：一方面，是将AI视为底层的工业基建，渗透进真人实拍的制作流程。Netflix的做法可以作为参考，看不出AI痕迹的特效画面是一条精品化的基准线。 另一方面，则是在内容创作端寻找只有在AI时代才真正成立的新形态。无论是在容错率更高的赛道试水纯AI制作，还是资深制片人跨界签约技术极客孵化独立系列，行业都在试图打破单一的传统范式，探寻下一代内容的可能。 长内容需要更谨慎 有行业调查显示，近六成影视长剧观众明确表示在观看剧集时，仍会优先选择传统的真人实拍剧。 首部上星的AI剧《桃花潭记》收到了一波争议反馈。当观众在手机端观看时，注意力往往集中在剧情推进和人物情绪上，此时AI画面的细微瑕疵容易被忽略；但一旦搬上电视大屏，所有不自然的细节都会被成倍放大。有细心的观众逐帧分析后发现，剧中人物在场景切换时会突兀地「变脸」，配角之间更是像复制粘贴一样频频「撞脸」。 观众对劣质AI内容的抵触，倒逼着长内容必须坚守精品化路线。但从精品制作的维度来看，若想依靠AI在长剧中达到严苛的优良质感，其背后所需的成本与试错代价实际上非常高昂。 今年6月，欢娱影视高调发布「AI万象剧库」，一次性放出了三部AI剧的先导片，创下了单日阅读量2.3亿的热搜成绩。然而，于正随后在媒体采访里算的一笔细账却并不容乐观。 欢娱探索的模式是「真人动捕实拍结合AI后期处理」，AI只负责宏大场景的渲染生成、批量群演的填充和特效细节的精修，最核心的情感戏依然留给真人演员。由此带来的效益是单集资金成本大幅下降了三分之一，但付出的沉重代价却是制作周期反而被拉长了：海量的4K素材需要排队等待算力渲染，后期环节更是变成了类似「抽卡」式的反复试错与返工重做。 于正提到曾尝试把40多部成熟剧本和5万字的小说语料喂给AI，得出的最终结论却是「人工改稿修正的时间，甚至比自己从头重写还要长」。此外，欢娱重金请来操盘的AI导演试图用模型还原春秋时期的历史盔甲，结果AI直接生成的图像全都是张冠李戴的错误示范，不是混淆成了明代的山文甲，就是充满廉价的影楼风道具感，最后团队只能无奈地翻查历代甲胄的专业拆解图进行纯手工建模。事实证明，让AI生成「看起来似乎是对的」东西很容易，但要让它生成「在历史考据上绝对严谨的」东西却极其困难。 灵河文化创始人白一骢给出的判断更技术派。他做了十几年剧集，对AI的态度一度是「学慢点就不用学了」，工具迭代太快，追着学反而浪费时间；落到实操，他的路线是「60%真人实拍+30~40%AI」，AI被明确限定在真人做不到、或者做了不划算的环节里。 向来以品质著称的正午阳光，其表态则相对更为谨慎与克制。董事长侯鸿亮坦然承认，AI技术必定会最先无情取代那些「批量化生产的低质量同质化作品」。但他内心更担忧的却是另一件事：如果创作者在算法的无形裹挟下逐渐走向深度的审美同质化，「那么AI给行业带来的就根本不是创作的解放，而仅仅是沦为一条更高效、更冰冷的流水线」。 更好工作的可能性 但这并不意味着横屏长剧市场会拒绝一切AI元素。归根结底，长内容观众抵制的从来不是AI技术本身，而是那些肉眼看得见的、粗制滥造的低质量AI画面。 《太平年》整体视觉特效由业界顶尖的时光坐标全案负责把控，他们走的正是一条「由AI快速生成核心视觉元素+由专业人工团队精雕细琢补全质感细节」的成熟人机协同策略。全剧长达481天的制作周期中，团队共计交付了2515个4K电影级高难度特效镜头。在同等画质下，整体制作效率被提升了3到4倍之多。 华策影视集团总裁傅斌星在今年3月的2026中国电视剧制作产业大会上表达过：未来产业的竞争，不仅是作品之争，更是生态体系之争，「一部顶级作品的诞生，越来越取决于其背后体系化的工业能力。」华策集团是AI动作最为密集的一家。其AIGC应用研究院自研的「有风」「国色」两个影视垂类大模型，已经顺利进入剧本评估、概念生成、角色塑造和视觉预演等核心环节；在桐庐的富春江影视科技产教示范区，AI被系统性地写入制片管理、虚拟资产、自动质检的全流程体系。此外，华策还投资了视频生成模型公司智象未来，后者的产品「帧赞」直接面向影视制作的实际场景。 今年7月，备受期待的《十日终焉》宣布杀青。这是一部由柠萌影视与腾讯视频联合出品的S+级长剧，总投资超过2亿元，约四成预算流向特效。剧组在调研会上详细介绍的核心不再是演员与档期，而是AI在这部剧里究竟做了什么。 具体而言，AI被严格限定在三个幕后辅助环节：利用AI生成3D故事板的场景预演；修补穿帮与替换绿幕的动态修图；以及训练神经网络识别逻辑漏洞的辅助质检。剧组给出的口径是，这种AI混合制作的意义「并非单纯降本，而是增效、提质」。 柠萌的整体思路比单部作品的AI用法更成体系。联合创始人陈菲在3月的上海电视剧制播年会上给出了一套战略框架：以IP价值为纵轴、AI替代性强弱为横轴，划分出四个象限——高IP价值、低AI替代的「核心壁垒区」要坚守真人原创；高IP价值、高AI赋能的「AI增效区」用技术放大IP效率；低独特性的「标准化内容区」用AI提效降本；AI尚未覆盖的「远景培育区」做前瞻储备。持续下注的方向是前两个象限。 长远来看，在AI的实际应用与工作流改造方面，海外流媒体巨头Netflix为全行业提供了一份极具价值的参照。 在7月16日发布的二季度股东信里，Netflix首次官方披露，2026年平台约有300部作品深度使用了生成式AI技术。其核心用法高度集中在后期视效环节：例如在印度剧《Glory》中用于逼真地扩充体育场看台上的人群数量、在巴西纪录片《Brasil 70》中用于精准重建上世纪70年代特有的复古历史氛围、以及在众多奇幻项目中用于高效生成宏大世界观的建立镜头。 其联席CEO泰德·萨兰多斯对此时的评价原话是：「AI代表着一个不可思议的巨大机会，它能够切实帮助创作者把影视作品做得更为精良震撼，而绝对不仅仅是为了让制作变得更便宜廉价。」同时他也强调，这是「真实的人类，在使用更好的趁手工具，去完成真实且有意义的工作」。 在阿根廷科幻剧《永生者》的制作过程中，布宜诺斯艾利斯市中心一栋大楼轰然倒塌的震撼镜头，完全是由AI直接生成了最终的成片级画面。这比采用传统的视效流程足足快了十倍之多，且制作成本远远低于达到同等震撼效果所需的传统预算。该剧播出后拿到了96%的超高烂番茄新鲜度，并顺利斩获了第二季的续订合同。有资深的海外媒体人在观看后表达了最为真实的观感：「如果不是提前被明确告知画面里使用了AI技术并让我特意去寻找，我根本就不可能注意到它的存在。」 Netflix推行这项技术的底层逻辑是追求极致的增量，而非存量替代。与之相对应的严谨配套动作是，平台强制要求所有的合作制作伙伴，必须主动且透明地申报AI技术在项目中的具体使用情况。 AI时代的多元形态 从目前实际落地的成果来看，影视公司自己交出的纯AI生成内容，大部分停留在「短」的那一头，例如网络电影与中短剧领域。 这与长视频平台的AI规划有关，率先推行的是短片与网络电影业务。爱奇艺自2025年9月起便与奥斯卡奖得主鲍德熹携手，开设了国内首个AI剧场，并在今年3月集中上线了16部AI短片；随后在5月，将其全面升级为「鲍德熹·爱奇艺电影剧场」商业电影创投计划，从超百个报名项目中精挑细选出10部时长60分钟以上的AIGC商业电影，并于8月起正式进入成片制作环节。 长信传媒把AI团队直接编进了剧组的C组。郭靖宇在世界人工智能大会上给出了「多元共生」的四条清晰路径：纯AI探索内容边界、真人授权加AI激活经典IP、真人迁移加AI实现规模化、传统实拍加AI打造精品。他同时明确指出，长短剧完全是两套逻辑：短剧遵循的是产品逻辑，长剧坚守的则是作品逻辑。其旗下《灵魂摆渡》AI版三部曲的第一部目前已经顺利进入后期制作阶段。 在短剧侧，柠萌影视的旗下厂牌「好有本领」今年宣布转型AI制作板块。总经理郑安迪列举的案例是AI微短剧版《西游记》，由于传统文化IP对历史知识储备和视觉审美的要求极高，AI恰好把其中相当一部分的制作门槛降了下来。 除了把AI放进真人实拍的辅助环节，还有另一条解法：签下会用AI的人，去探索AI时代真正成立的内容形态。 曾一手打造过高口碑长剧《新生》与《棋魂》的资深制片人、伴山文化创始人郑林，便极具前瞻性地签下了当下炙手可热的头部AI创作者DiDi_OK，两人确立的合作模式被称为平等的「创意合伙人」。DiDi_OK的AI短片《牌子》在B站的播放量2000万，系列《垃圾站》破千万，郭帆是追更观众之一。 两人的分工是，DiDi_OK负责核心创作，郑林提供市场判断，不干预创作方向。他们用Figma共享同一个创作空间，每周五固定电话会跨越七小时时差。郑林给自己的定位是「球场边的饮水机管理员」，「像一面镜子」，只照问题，不改打法。 郑林看人的标准是「垄断性」。「看他做的东西，用户找得到替代品吗？找得到，无论流量多大，也跑在零利润赛道上。如果找不到，哪怕只有几万个观众，内容也是具有垄断性的。」这个标准解释了他为什么绕开了流量更大的AI爆款创作者。在他看来，稀缺的不是播放量，是不可替代性。而判断什么不可替代，靠的仍然是做了二十年内容的眼光。 《垃圾站》系列暂定每集约12分钟、8集一季，用传统三维补足AI在空间稳定性上的不足。郑林对内容形态的判断走得更远：「40分钟长剧本身，可能不是AI时代的主流形态。」 在这个大时代里，不同禀赋的从业者，各自拿着不同的方法论，都在奋力寻找属于自己的破局之路。传统的横屏长剧不会轻易消失，只是它不再是这个市场上唯一正统的标准答案。\", \"published\": \"Thu, 20 Aug 2026 10:28:17 GMT\", \"source\": \"虎嗅资讯-全部\", \"biz_tags\": [\"industry\"], \"category\": \"short_drama\", \"level\": \"A\", \"why\": \"长内容AI应用趋势，对短剧出海精品化有参考价值。\", \"action\": \"研究长内容AI制作案例，借鉴精品化路线。\", \"opportunity\": \"短剧精品化可提升付费率。\", \"risk\": \"全AI制作可能遭观众抵触，需平衡质量。\"}, {\"title\": \"[GitHub] HBAI-Ltd/Toonflow-app: Toonflow 是开源一站式 AI 短剧创作工具，将小说、剧本快速转化为动画短剧。集成 AI 编剧、智能分镜、角色与视频生成，跨平台桌面端轻量部署，助力创作者\", \"link\": \"https://github.com/HBAI-Ltd/Toonflow-app\",   // 迷你走势图（SVG 折线）
  function sparklinePoints(values, width, height) {
    if (!values || values.length < 2) {
      return '0,' + (height / 2) + ' ' + width + ',' + (height / 2);
    }
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    var range = (max - min) || 1;
    var pts = [];
    for (var i = 0; i < values.length; i++) {
      var x = (width / (values.length - 1)) * i;
      var y = height - 4 - ((values[i] - min) / range) * (height - 8);
      pts.push(x.toFixed(1) + ',' + y.toFixed(1));
    }
    return pts.join(' ');
  }

  App.prototype.mount = function (selector) {
    var el = typeof selector === 'string' ? document.querySelector(selector) : selector;
    if (!el) throw new Error('未找到容器: ' + selector);
    this.container = el;
    this.load();
  };

  App.prototype.load = function (force) {
    var self = this;
    // 优先使用内嵌数据（页面自带，打开即显示，零网络请求）
    if (!force && window.__EMBEDDED_STATS__ && typeof window.__EMBEDDED_STATS__ === 'object' && Object.keys(window.__EMBEDDED_STATS__).length > 0) {
      self.data = window.__EMBEDDED_STATS__;
      self._retry = 0;
      self.render();
      self.bind();
      return;
    }
    self._retry = self._retry || 0;
    fetch(_base() + 'data/stats.json?t=' + Date.now() + (force ? '&f=' + Math.random() : ''), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        self.data = d;
        self._retry = 0;
        self.render();
        self.bind();
      })
      .catch(function () {
        // 自动重试最多 3 次（网络抖动容错）
        if (self._retry < 3) {
          self._retry++;
          setTimeout(function () { self.load(force); }, self._retry * 2000);
          return;
        }
        self._retry = 0;
        self.container.innerHTML = '<div style="color:#fff;padding:40px;text-align:center;font-family:sans-serif;">' +
          '<div style="font-size:40px;margin-bottom:10px;">📡</div>' +
          '<div style="font-size:15px;color:#fff;margin-bottom:6px;">数据加载失败</div>' +
          '<div style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:20px;">请检查网络后重试，或确认云端已构建</div>' +
          '<button onclick="location.reload()" style="padding:10px 28px;border-radius:20px;background:#CCFF00;color:#0A0A0A;border:none;font-size:14px;font-weight:700;cursor:pointer;">🔄 重新加载</button>' +

  };

      '<div style="background:rgba(204,255,0,0.06);border:1px solid rgba(204,255,0,0.2);border-radius:10px;padding:10px 12px;margin-bottom:12px;">' +
      '<div style="font-size:11px;color:' + C + ';font-weight:600;">🔊 语音正在播报的内容（对照）</div>' +
      '<div style="font-size:12px;color:rgba(255,255,255,0.75);line-height:1.8;margin-top:8px;">' + (d.speech_text || '（暂无语音稿）') + '</div>' +
      '</div>' +
      (actionsData.daily_focus ? '<div style="border-radius:14px;padding:14px 16px;margin-bottom:12px;background:linear-gradient(135deg,' + rgba(C,0.10) + ',rgba(255,255,255,0.02));border:1px solid ' + rgba(C,0.25) + ';">' +
        '<div style="font-size:10px;color:' + C + ';font-weight:700;letter-spacing:1px;margin-bottom:6px;">🎯 今日最重要</div>' +
        '<div style="font-size:14px;font-weight:700;color:#fff;line-height:1.5;">' + actionsData.daily_focus + '</div>' +
      '</div>' : '') +
      '<h3 style="font-size:14px;font-weight:700;margin-bottom:10px;color:#fff;">🛠️ 今天要测试的工具</h3>' +
      (toolsList.length ? toolsList.map(function (t, i) {
        var done = self.state.doneTools[i];
        return '<div class="w3-tool-item" data-tool="' + i + '" style="display:flex;gap:12px;background:rgba(255,255,255,0.04);border:1px solid ' + (done ? rgba(C,0.4) : 'rgba(255,255,255,0.06)') + ';border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;">' +
          '<div style="width:22px;height:22px;flex-shrink:0;border-radius:50%;border:2px solid ' + (done ? C : 'rgba(255,255,255,0.3)') + ';display:flex;align-items:center;justify-content:center;font-size:12px;color:' + C + ';margin-top:2px;">' + (done ? '✓' : '') + '</div>' +
          '<div style="flex:1;">' +
          '<div style="font-size:14px;font-weight:700;color:#fff;' + (done ? 'text-decoration:line-through;opacity:0.5;' : '') + '">' + t.name + '</div>' +
          '<div style="font-size:11px;color:rgba(255,255,255,0.6);margin-top:3px;">' + (t.what || '') + '</div>' +
          '<div style="font-size:11px;color:' + C + ';margin-top:5px;">📌 ' + (t.why_today || '') + '</div>' +
          '<div style="font-size:10px;color:rgba(255,255,255,0.4);margin-top:4px;">⏱ ' + (t.time_est || '') + (t.source ? ' | 📎 ' + t.source.slice(0, 30) : '') + '</div>' +
          '</div></div>';
      }).join('') : '<div style="padding:16px;color:rgba(255,255,255,0.4);text-align:center;font-size:12px;background:rgba(255,255,255,0.03);border-radius:12px;">今日暂无需要测试的工具</div>') +

      (watchList.length ? '<h3 style="font-size:14px;font-weight:700;margin:16px 0 10px;color:#fff;">👀 持续关注</h3>' +
        watchList.map(function (w) {
          return '<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:10px 14px;margin-bottom:8px;">' +
            '<div style="font-size:13px;font-weight:600;color:#fff;">' + (w.item || '') + '</div>' +
            '<div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:3px;">' + (w.reason || '') + '</div></div>';
        }).join('') : '') +

      (researchList.length ? '<h3 style="font-size:14px;font-weight:700;margin:16px 0 10px;color:#fff;">🔍 要研究的主题</h3>' +
        researchList.map(function (r) {
          return '<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:10px 14px;margin-bottom:8px;">' +
            '<div style="font-size:13px;font-weight:600;color:#fff;">' + (r.topic || '') + '</div>' +
            '<div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:3px;">' + (r.why || '') + '</div></div>';
        }).join('') : '') +
      '</div>';

    var moreView =
      '<div style="margin-bottom:16px;">' +
      '<h3 style="font-size:14px;font-weight:700;margin-bottom:10px;color:#fff;">关于</h3>' +
      '<div style="border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);padding:16px;">' +
      '<div style="font-size:12px;color:rgba(255,255,255,0.6);line-height:2;">' +
      '📡 AI 情报雷达站 v3<br/>' +
      '🔔 每日简报自动推送飞书<br/>' +
      '🔊 语音播报（晓晓自然音）<br/>' +
      '📈 数据更新于 ' + d.generated_at + '<br/>' +
      '👥 本站访问 <span id="busuanzi_value_site_pv" style="color:' + C + ';">--</span> 次 · ' +
      '访客 <span id="busuanzi_value_site_uv" style="color:' + C + ';">--</span> 人' +
      '</div></div></div>' +
      '<div style="text-align:center;margin-top:10px;font-size:10px;color:rgba(255,255,255,0.3);">页面计数由不蒜子提供 · 每日自动更新</div>';

    var viewMap = { home: homeView, actions: actionsView, trend: trendView, brief: briefView, more: moreView };
    var viewContent = viewMap[this.state.activeTab] || homeView;

    this.container.innerHTML =
      '<div style="width:100%;height:100%;background:#050505;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;">' +
      '<div style="position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,' + rgba(C, 0.12) + ' 0%,transparent 60%);pointer-events:none;"></div>' +

      // 顶栏
      '<div style="padding:12px 18px 0;position:relative;z-index:10;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">' +
      '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,' + C + ',' + dim(C, 0.6) + ');display:flex;align-items:center;justify-content:center;color:#0A0A0A;box-shadow:0 0 12px ' + rgba(C, 0.3) + ';">' + icon('radar', 18, '#0A0A0A') + '</div>' +
      '<div style="flex:1;margin:0 10px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);">' +
      '<div style="color:rgba(255,255,255,0.4);display:flex;">' + icon('search', 15) + '</div>' +
      '<span style="font-size:11px;color:rgba(255,255,255,0.35);">更新于 ' + d.generated_at + '</span></div>' +
      '<div style="display:flex;align-items:center;gap:12px;">' +
      '<div style="color:rgba(255,255,255,0.6);display:flex;">' + icon('bell', 17) + '</div>' +
      '<div class="w3-voice-btn" style="display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:18px;background:' + voiceBg + ';color:' + voiceColor + ';border:1px solid ' + (this.state.playing ? C : rgba(C, 0.3)) + ';cursor:pointer;">' +
      icon(voiceIcon, 13, voiceColor) + '<span style="font-size:10px;font-weight:600;">' + voiceText + '</span></div>' +
      '</div></div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">' +
      '<span style="font-size:17px;font-weight:800;color:' + C + ';text-shadow:0 0 20px ' + rgba(C, 0.3) + ';letter-spacing:1px;">RADAR</span>' +
      '<span style="font-size:11px;color:rgba(255,255,255,0.4);">AI 情报雷达站</span>' +
      '</div></div>' +

      // 内容区
      '<div class="w3-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 90px;position:relative;z-index:1;scrollbar-width:none;-ms-overflow-style:none;">' +
      '<style>.w3-scroll::-webkit-scrollbar{display:none;}.w3-scroll{-webkit-overflow-scrolling:touch;}</style>' +
      viewContent +
      '</div>' +

      // 底部 Tab
      '<div style="position:absolute;bottom:0;left:0;right:0;padding:10px 16px 24px;background:rgba(10,10,10,0.85);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-around;align-items:center;z-index:100;">' +
      tabBar +
      '</div>' +
      '<div style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:2px;background:rgba(255,255,255,0.3);z-index:101;"></div>' +
      '</div>';

    // 渲染图表
    this.renderCharts();
  };

  App.prototype.renderCharts = function () {
    var d = this.data;
    if (!d) return;
    try {
      this._renderChartsInner();
    } catch (e) {
      // 图表渲染失败不影响页面其他内容
    }
  };

  App.prototype._renderChartsInner = function () {

    // 图表渲染容错：Chart.js 未加载时跳过，不导致页面白屏
    if (typeof Chart === 'undefined') return;

    // 日总量柱状图
    var dailyEl = document.getElementById('chartDaily');
    if (dailyEl && d.daily_counts) {
      var dc = d.daily_counts;
      var c1 = new Chart(dailyEl, {
        type: 'bar',
        data: {
          labels: dc.dates,
          datasets: [{
            data: dc.counts,
            backgroundColor: 'rgba(204,255,0,0.4)',
            borderColor: '#CCFF00',
            borderWidth: 1,
            borderRadius: 4,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false },
            tooltip: { backgroundColor: '#111', titleColor: '#fff', bodyColor: '#aaa' } },
          scales: {
            x: { ticks: { color: 'rgba(255,255,255,0.4)', maxTicksLimit: 7, font: { size: 9 } }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { color: 'rgba(255,255,255,0.4)', precision: 0, font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
          }
        }
      });
    }

    // 关键词趋势折线
    var trendEl = document.getElementById('chartTrend');
    if (trendEl && d.keyword_trends) {
      var kt = d.keyword_trends;
      var kws = Object.keys(kt.series);
      var palette = ['#CCFF00','#38BDF8','#F472B6','#A78BFA','#4ADE80','#FBBF24','#FB923C','#22D3EE','#F87171','#F9A8D4','#818CF8','#FCD34D','#6EE7B7','#93C5FD','#BEF264'];
      var datasets = kws.map(function (kw, i) {
        return {
          label: kw,
          data: kt.series[kw],
          borderColor: palette[i % palette.length],
          borderWidth: 1.5,
          pointRadius: 1,
          tension: 0.35,
          fill: false,
        };
      });
      new Chart(trendEl, {
        type: 'line',
        data: { labels: kt.dates, datasets: datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: 'rgba(255,255,255,0.6)', boxWidth: 8, font: { size: 9 } }, position: 'bottom' },
            tooltip: { backgroundColor: '#111', titleColor: '#fff', bodyColor: '#aaa' }
          },
          scales: {
            x: { ticks: { color: 'rgba(255,255,255,0.4)', maxTicksLimit: 7, font: { size: 9 } }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { color: 'rgba(255,255,255,0.4)', precision: 0, font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
          }
        }
      });
    }
  };

  App.prototype.bind = function () {
    var self = this;

    // Tab 切换
    var tabs = this.container.querySelectorAll('.w3-tab');
    tabs.forEach(function (el) {
      el.addEventListener('click', function () {
        self.state.activeTab = el.getAttribute('data-tab');
        self.render();
        self.bind();
      });
    });

    // 今日行动：勾选/取消工具
    var toolItems = this.container.querySelectorAll('.w3-tool-item');
    toolItems.forEach(function (el) {
      el.addEventListener('click', function () {
        var idx = el.getAttribute('data-tool');
        self.state.doneTools[idx] = !self.state.doneTools[idx];
        self.render();
        self.bind();
      });
    });

    // 语音稿展开/收起
    var speechScript = this.container.querySelector('.w3-speech-script');
    if (speechScript) {
      speechScript.addEventListener('click', function () {
        var body = speechScript.querySelector('.w3-script-body');
        var isOpen = body.style.display !== 'none';
        body.style.display = isOpen ? 'none' : 'block';
      });
    }

    // 展开/收起简报内容
    var toggles = this.container.querySelectorAll('.w3-toggle-item');
    toggles.forEach(function (el) {
      el.addEventListener('click', function () {
        var idx = el.getAttribute('data-idx');
        self.state.expandedItems[idx] = !self.state.expandedItems[idx];
        self.render();
        self.bind();
      });
    });

    // 语音播报（服务端晓晓生成音频，网页播放）
    var voiceBtn = this.container.querySelector('.w3-voice-btn');
    if (voiceBtn) {
      voiceBtn.addEventListener('click', function () { self.playVoice(); });
    }
    var voiceAction = this.container.querySelector('[data-action="voice"]');
    if (voiceAction) {
      voiceAction.addEventListener('click', function () { self.playVoice(); });
    }

    // 刷新（强制绕过缓存）
    var refreshBtn = this.container.querySelector('[data-action="refresh"]');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', function () {
        self.load(true);
      });
    }

    // 选题（跳转简报页，AI 生成选题）
    var ideasBtn = this.container.querySelector('[data-action="ideas"]');
    if (ideasBtn) {
      ideasBtn.addEventListener('click', function () {
        self.state.activeTab = 'brief';
        self.render();
        self.bind();
      });
    }

    // 周报（跳转简报页）
    var weeklyBtn = this.container.querySelector('[data-action="weekly"]');
    if (weeklyBtn) {
      weeklyBtn.addEventListener('click', function () {
        self.state.activeTab = 'brief';
        self.render();
        self.bind();
      });
    }
  };

  App.prototype.playVoice = function () {
    var self = this;
    if (this.state.playing) {
      if (this.audio) { this.audio.pause(); this.audio = null; }
      this.state.playing = false;
      this.render();
      this.bind();
      return;
    }
    // 播放云端预生成的晓晓自然语音（GitHub Actions 每天生成 briefing.mp3）
    var audio = new Audio(_base() + 'data/briefing.mp3?t=' + Date.now());
    self.audio = audio;
    self.state.playing = true;
    self.render();
    self.bind();
    audio.onended = function () {
      self.state.playing = false;
      self.render();
      self.bind();
    };
    audio.onerror = function () {
      alert('语音文件不存在，请先运行云端构建');
      self.state.playing = false;
      self.render();
      self.bind();
    };
    audio.play();
  };

  global.RadarApp = {
    mount: function (selector, options) {
      var app = new App(options);
      app.mount(selector);
      return app;
    }
  };
})(window);

window.addEventListener('DOMContentLoaded', function () {
  // 用 replaceState 替换当前历史，防止手机侧滑退回到引导页
  try { history.replaceState(null, '', location.href); } catch (e) {}
  var app = RadarApp.mount('#radar-app');
  window.__radarReload = function () { app.load(); };
  // 离线版：不请求版本文件
  // 注册 Service Worker（PWA 离线支持）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
  // 每 60 秒刷新
  setInterval(function () {
    if (window.__radarReload) { window.__radarReload(); }
  }, 60000);
});
</script>
