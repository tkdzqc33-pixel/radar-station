<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>📡 AI 情报雷达站</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="情报雷达站" />
<meta name="theme-color" content="#050505" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./data/icons/icon-192.png" />
<link rel="icon" type="image/png" href="./data/icons/icon-192.png" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:#050505;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  display:flex;align-items:center;justify-content:center;
}
#radar-app{width:100%;height:100%;max-width:430px;max-height:932px;}
@media (max-width:480px){#radar-app{max-width:100%;max-height:100%;}}
@media (min-width:481px){
  body::before{
    content:'';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle,rgba(204,255,0,0.1) 0%,transparent 60%);
    filter:blur(30px);pointer-events:none;
  }
  body::after{
    content:'';position:fixed;inset:0;
    background-image:linear-gradient(rgba(204,255,0,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(204,255,0,0.03) 1px,transparent 1px);
    background-size:50px 50px;
    -webkit-mask-image:radial-gradient(ellipse at center,black 0%,transparent 70%);
    mask-image:radial-gradient(ellipse at center,black 0%,transparent 70%);
    pointer-events:none;
  }
  #radar-app{
    border-radius:44px;overflow:hidden;
    box-shadow:0 50px 100px rgba(0,0,0,0.6),0 0 0 10px #1a1a1a,0 0 0 12px rgba(255,255,255,0.05);
    position:relative;z-index:1;
  }
}
</style>
</head>
<body>
<div id="radar-app"></div>

<script>
(function (global) {
  'use strict';

  var C = '#CCFF00';
  var UP = '#CCFF00';
  var DOWN = '#FF6B6B';

  function dim(hex, pct) {
    var num = parseInt(hex.slice(1), 16);
    var r = Math.round((num >> 16) * pct);
    var g = Math.round(((num >> 8) & 0x00FF) * pct);
    var b = Math.round((num & 0x0000FF) * pct);
    return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
  }
  function rgba(hex, alpha) {
    var num = parseInt(hex.slice(1), 16);
    var r = (num >> 16) & 0xFF;
    var g = (num >> 8) & 0xFF;
    var b = num & 0xFF;
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
  }
  function icon(name, size, color) {
    var paths = {
      radar: 'M12 2a10 10 0 0 1 10 10M12 6a6 6 0 0 1 6 6M12 10a2 2 0 0 1 2 2M12 22a10 10 0 0 0 10-10M2 12a10 10 0 0 0 10 10',
      volume: 'M11 5L6 9H2v6h4l5 4V5z M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07',
      mute: 'M11 5L6 9H2v6h4l5 4V5z M23 9l-6 6M17 9l6 6',
      search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35',
      bell: 'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0',
      home: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10',
      trend: 'M3 3v18h18 M7 14l4-4 4 4 5-5',
      list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z',
      refresh: 'M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15',
      arrow: 'M5 12h14M12 5l7 7-7 7',
      doc: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8',
      light: 'M12 18v-5a3 3 0 0 0-3-3H6a4 4 0 0 1 4-4h2a3 3 0 0 1 3 3v9M6 14h.01M6 18h.01',
    };
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="' + (paths[name] || paths.home) + '"/></svg>';
  }

  // 迷你走势图（SVG 折线）
  function sparklinePoints(values, width, height) {
    if (!values || values.length < 2) {
      return '0,' + (height / 2) + ' ' + width + ',' + (height / 2);
    }
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    var range = (max - min) || 1;
    var pts = [];
    for (var i = 0; i < values.length; i++) {
      var x = (width / (values.length - 1)) * i;
      var y = height - 4 - ((values[i] - min) / range) * (height - 8);
      pts.push(x.toFixed(1) + ',' + y.toFixed(1));
    }
    return pts.join(' ');
  }

  // ---------- 应用 ----------
  function App(opts) {
    opts = opts || {};
    this.container = null;
    this.data = null;
    this.state = {
      activeTab: 'home',
      showBalance: true,
      expandedItems: {},
      playing: false,
      audio: null,
    };
    this.catLabel = { short_drama: '短剧出海', ai_tools: 'AI工具', industry: '行业动态', other: '其他' };
    this.catColor = { short_drama: '#F472B6', ai_tools: '#38BDF8', industry: '#A78BFA', other: '#64748B' };
    this.levelLabel = { S: '立刻行动', A: '今天处理', B: '了解即可' };
    this.levelColor = { S: '#FF4757', A: '#FFA502', B: '#64748B' };
  }

  App.prototype.mount = function (selector) {
    var el = typeof selector === 'string' ? document.querySelector(selector) : selector;
    if (!el) throw new Error('未找到容器: ' + selector);
    this.container = el;
    this.load();
  };

  App.prototype.load = function (force) {
    var self = this;
    fetch('./data/stats.json?t=' + Date.now() + (force ? '&f=' + Math.random() : ''), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        self.data = d;
        self.render();
        self.bind();
      })
      .catch(function () {
        self.container.innerHTML = '<div style="color:#fff;padding:40px;text-align:center;">加载失败：数据还没生成，请先运行云端构建或确认 data/stats.json 存在</div>';
      });
  };

  App.prototype.render = function () {
    var self = this;
    var d = this.data;
    if (!d) { this.container.innerHTML = '<div style="color:#666;padding:40px;text-align:center;">加载中...</div>'; return; }
    var s = d.summary;
    var brief = d.morning_brief || {};
    var sCount = s.s_count || 0;
    var aCount = s.a_count || 0;

    // 概览卡
    var totalDir = s.total_dir === 'up' ? UP : (s.total_dir === 'down' ? DOWN : 'rgba(255,255,255,0.4)');
    var totalArrow = s.total_dir === 'up' ? '▲' : (s.total_dir === 'down' ? '▼' : '—');
    var totalText = s.total_dir === 'up' ? ('较昨日 +' + s.total_pct + '%') : (s.total_dir === 'down' ? ('较昨日 ' + s.total_pct + '%') : '较昨日持平');

    // 关键词升降（今日 vs 昨日）排行
    var kwRows = '';
    var changes = d.keyword_changes || [];
    var maxToday = 1;
    changes.forEach(function (c) { if (c.today > maxToday) maxToday = c.today; });
    changes.forEach(function (c) {
      var color = c.direction === 'up' ? UP : (c.direction === 'down' ? DOWN : 'rgba(255,255,255,0.4)');
      var arrow = c.direction === 'up' ? '▲' : (c.direction === 'down' ? '▼' : '—');
      var pctText = c.yesterday === 0 ? (c.today > 0 ? '新增' : '—') : (c.pct > 0 ? '+' + c.pct + '%' : c.pct + '%');
      var barW = Math.max((c.today / maxToday) * 100, 4);
      kwRows += '<div class="row" style="display:flex;align-items:center;padding:11px 16px;gap:12px;border-bottom:1px solid rgba(255,255,255,0.04);">' +
        '<div style="width:72px;font-size:13px;font-weight:600;color:#fff;flex-shrink:0;">' + c.keyword + '</div>' +
        '<div style="flex:1;height:20px;background:rgba(255,255,255,0.06);border-radius:6px;overflow:hidden;">' +
        '<div style="height:100%;width:' + barW + '%;background:linear-gradient(90deg,' + rgba(color, 0.3) + ',' + color + ');border-radius:6px;"></div></div>' +
        '<div style="text-align:right;flex-shrink:0;">' +
        '<div style="font-size:13px;font-weight:600;color:' + color + ';">' + arrow + ' ' + c.today + '</div>' +
        '<div style="font-size:10px;color:rgba(255,255,255,0.4);">昨' + c.yesterday + ' (' + pctText + ')</div>' +
        '</div></div>';
    });
    if (!changes.length) kwRows = '<div style="padding:20px;color:rgba(255,255,255,0.4);text-align:center;font-size:12px;">数据积累后自动显示对比</div>';

    // 业务分类分布
    var dist = d.category_distribution || {};
    var distKeys = Object.keys(dist);
    var distTotal = distKeys.reduce(function (a, k) { return a + dist[k]; }, 0) || 1;
    var distRows = distKeys.map(function (k) {
      var pct = Math.round(dist[k] / distTotal * 100);
      return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">' +
        '<span style="width:64px;font-size:12px;color:rgba(255,255,255,0.7);flex-shrink:0;">' + self.catLabel[k] + '</span>' +
        '<div style="flex:1;height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;">' +
        '<div style="height:100%;width:' + pct + '%;background:' + self.catColor[k] + ';border-radius:4px;"></div></div>' +
        '<span style="font-size:12px;color:#fff;font-weight:600;width:36px;text-align:right;">' + pct + '%</span>' +
        '</div>';
    }).join('');

    // 简报列表
    var items = d.report_items || [];
    var itemHtml = items.map(function (it, idx) {
      var lv = it.level || 'B';
      var lvColor = self.levelColor[lv];
      var cat = self.catLabel[it.category] || '其他';
      var isExpanded = self.state.expandedItems[idx];
      var summary = it.summary || '';
      var shown = isExpanded ? summary : summary.slice(0, 120);
      var hasMore = summary.length > 120;
      var why = it.why ? '<div style="font-size:12px;color:' + self.levelColor.A + ';margin-top:8px;">💡 ' + it.why + '</div>' : '';
      var opp = it.opportunity && it.opportunity !== '无' ? '<div style="font-size:12px;color:#4ADE80;margin-top:4px;">💰 机会: ' + it.opportunity + '</div>' : '';
      var risk = it.risk && it.risk !== '无' ? '<div style="font-size:12px;color:#FF6B6B;margin-top:4px;">⚠️ 风险: ' + it.risk + '</div>' : '';
      var action = it.action ? '<div style="font-size:12px;color:' + C + ';margin-top:4px;">👉 ' + it.action + '</div>' : '';
      var link = it.link ? '<div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:6px;">🔗 <a href="' + it.link + '" target="_blank" style="color:rgba(255,255,255,0.4);text-decoration:none;">' + (it.source || '原文') + '</a></div>' : '';
      return '<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-left:3px solid ' + lvColor + ';border-radius:12px;padding:14px;margin-bottom:10px;">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
        '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;color:' + lvColor + ';background:' + rgba(lvColor, 0.15) + ';">' + lv + '</span>' +
        '<span style="font-size:11px;color:' + (self.catColor[it.category] || '#64748B') + ';font-weight:600;">' + cat + '</span>' +
        '<span style="font-size:13px;font-weight:600;color:#fff;flex:1;min-width:180px;">' + it.title + '</span>' +
        '</div>' +
        (summary ? '<div style="font-size:12px;color:rgba(255,255,255,0.65);line-height:1.7;margin-top:8px;border-left:2px solid rgba(255,255,255,0.08);padding-left:10px;">' + shown + (hasMore && !isExpanded ? '...' : '') + '</div>' : '') +
        (hasMore ? '<div class="w3-toggle-item" data-idx="' + idx + '" style="font-size:11px;color:' + C + ';margin-top:6px;cursor:pointer;font-weight:600;">' + (isExpanded ? '收起 ▲' : '展开全文 ▾') + '</div>' : '') +
        why + opp + risk + action + link +
        '</div>';
    }).join('');
    if (!items.length) itemHtml = '<div style="padding:20px;color:rgba(255,255,255,0.4);text-align:center;font-size:12px;">暂无简报，运行 main.py daily 生成</div>';

    // 语音按钮状态
    var voiceIcon = this.state.playing ? 'mute' : 'volume';
    var voiceText = this.state.playing ? '停止' : '语音播报';
    var voiceBg = this.state.playing ? C : 'rgba(255,255,255,0.06)';
    var voiceColor = this.state.playing ? '#0A0A0A' : C;

    // 底部 Tab
    var tabs = [
      { id: 'home', label: '首页', icon: 'home' },
      { id: 'trend', label: '行情', icon: 'trend' },
      { id: 'brief', label: '简报', icon: 'list' },
      { id: 'more', label: '更多', icon: 'gear' },
    ];
    var tabBar = tabs.map(function (t) {
      var active = self.state.activeTab === t.id;
      var color = active ? C : 'rgba(255,255,255,0.4)';
      return '<div class="w3-tab" data-tab="' + t.id + '" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;">' +
        '<div style="color:' + color + ';display:flex;">' + icon(t.icon, 20) + '</div>' +
        '<span style="font-size:9px;color:' + color + ';font-weight:' + (active ? 600 : 400) + ';">' + t.label + '</span></div>';
    }).join('');

    // 视图内容（Tab 切换）
    // 晨报卡片
    var briefHtml = '';
    if (brief && brief.top_story) {
      briefHtml =
        '<div style="position:relative;border-radius:16px;padding:16px 18px;margin-bottom:16px;background:linear-gradient(135deg,rgba(204,255,0,0.06) 0%,rgba(255,255,255,0.02) 60%);border:1px solid rgba(204,255,0,0.2);overflow:hidden;">' +
        '<div style="font-size:10px;color:' + C + ';font-weight:700;letter-spacing:1px;margin-bottom:8px;">📊 分析师晨报</div>' +
        '<div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.5;">🔝 ' + (brief.top_story || '') + '</div>' +
        (brief.judgment ? '<div style="font-size:12px;color:rgba(255,255,255,0.7);line-height:1.7;margin-bottom:8px;">🧠 ' + brief.judgment + '</div>' : '') +
        ((brief.actions || []).length ? '<div style="font-size:11px;color:rgba(255,255,255,0.6);margin-bottom:4px;">✅ 今日行动：</div>' : '') +
        (brief.actions || []).map(function (a, i) {
          return '<div style="font-size:12px;color:#fff;line-height:1.8;">' + (i + 1) + '. ' + a + '</div>';
        }).join('') +
        (brief.risk_alert ? '<div style="font-size:11px;color:#FF6B6B;margin-top:8px;">⚠️ ' + brief.risk_alert + '</div>' : '') +
        '</div>';
    }

    var homeView =
      // 概览总资产卡
      '<div style="position:relative;border-radius:18px;padding:22px;margin-bottom:16px;background:linear-gradient(135deg,' + rgba(C, 0.10) + ' 0%,rgba(255,255,255,0.03) 60%);border:1px solid ' + rgba(C, 0.2) + ';overflow:hidden;">' +
      '<div style="position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,' + rgba(C, 0.25) + ' 0%,transparent 70%);"></div>' +
      '<div style="position:relative;">' +
      '<div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:6px;">今日情报情报雷达</div>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">' +
      '<span style="font-size:36px;font-weight:800;letter-spacing:-0.02em;color:#fff;text-shadow:0 0 30px ' + rgba(C, 0.3) + ';">' + s.today_items + '</span>' +
      '<span style="font-size:11px;color:' + totalDir + ';font-weight:600;">' + totalArrow + ' ' + totalText + '</span>' +
      '</div>' +
      '<div style="font-size:11px;color:rgba(255,255,255,0.4);">累计 ' + s.total_history + ' 条 | 🚨S级 ' + sCount + ' | 🔶A级 ' + aCount + '</div>' +
      '</div>' +
      '<div style="display:flex;justify-content:center;gap:5px;margin-top:14px;">' +
      '<div style="width:18px;height:5px;border-radius:3px;background:' + C + ';"></div>' +
      '<div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.2);"></div>' +
      '<div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.2);"></div>' +
      '</div></div>' +

      // 晨报
      briefHtml +
      // 快捷操作
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;">' +
      '<div class="w3-action" data-action="refresh" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;">' +
      '<div style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;color:#fff;">' + icon('refresh', 18) + '</div>' +
      '<span style="font-size:10px;color:rgba(255,255,255,0.5);">刷新</span></div>' +
      '<div class="w3-action" data-action="voice" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;">' +
      '<div style="width:42px;height:42px;border-radius:12px;background:' + (this.state.playing ? rgba(C, 0.2) : 'rgba(255,255,255,0.05)') + ';border:1px solid ' + (this.state.playing ? rgba(C, 0.4) : 'rgba(255,255,255,0.06)') + ';display:flex;align-items:center;justify-content:center;color:' + (this.state.playing ? C : '#fff') + ';">' + icon('volume', 18) + '</div>' +
      '<span style="font-size:10px;color:rgba(255,255,255,0.5);">播报</span></div>' +
      '<div class="w3-action" data-action="weekly" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;">' +
      '<div style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;color:#fff;">' + icon('doc', 18) + '</div>' +
      '<span style="font-size:10px;color:rgba(255,255,255,0.5);">周报</span></div>' +
      '<div class="w3-action" data-action="ideas" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;">' +
      '<div style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;color:#fff;">' + icon('light', 18) + '</div>' +
      '<span style="font-size:10px;color:rgba(255,255,255,0.5);">选题</span></div>' +
      '</div>' +

      // 关键词升降排行
      '<div style="margin-bottom:16px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
      '<h3 style="font-size:14px;font-weight:700;margin:0;color:#fff;">关键词热度 · 今日vs昨日</h3>' +
      '<span style="font-size:11px;color:' + C + ';">对比</span></div>' +
      '<div style="border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);overflow:hidden;">' + kwRows + '</div></div>' +

      // 分类分布
      '<div style="margin-bottom:16px;">' +
      '<h3 style="font-size:14px;font-weight:700;margin-bottom:12px;color:#fff;">业务分类分布</h3>' +
      '<div style="border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);padding:16px;">' + distRows + '</div></div>';

    var trendView =
      '<div style="margin-bottom:16px;">' +
      '<h3 style="font-size:14px;font-weight:700;margin-bottom:12px;color:#fff;">情报总量趋势（近14天）</h3>' +
      '<div style="border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);padding:14px;"><canvas id="chartDaily" style="width:100%;height:180px;"></canvas></div></div>' +
      '<div style="margin-bottom:16px;">' +
      '<h3 style="font-size:14px;font-weight:700;margin-bottom:12px;color:#fff;">关键词趋势对比（近14天）</h3>' +
      '<div style="border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);padding:14px;"><canvas id="chartTrend" style="width:100%;height:220px;"></canvas></div></div>';

    var briefView =
      '<div style="margin-bottom:10px;">' +
      '<h3 style="font-size:14px;font-weight:700;margin-bottom:10px;color:#fff;">今日简报</h3>' + itemHtml + '</div>';

    var moreView =
      '<div style="margin-bottom:16px;">' +
      '<h3 style="font-size:14px;font-weight:700;margin-bottom:10px;color:#fff;">关于</h3>' +
      '<div style="border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);padding:16px;">' +
      '<div style="font-size:12px;color:rgba(255,255,255,0.6);line-height:2;">' +
      '📡 AI 情报雷达站 v3<br/>' +
      '🔔 每日简报自动推送飞书<br/>' +
      '🔊 语音播报（晓晓自然音）<br/>' +
      '📈 数据更新于 ' + d.generated_at + '<br/>' +
      '👥 本站访问 <span id="busuanzi_value_site_pv" style="color:' + C + ';">--</span> 次 · ' +
      '访客 <span id="busuanzi_value_site_uv" style="color:' + C + ';">--</span> 人' +
      '</div></div></div>' +
      '<div style="text-align:center;margin-top:10px;font-size:10px;color:rgba(255,255,255,0.3);">页面计数由不蒜子提供 · 每日自动更新</div>';

    var viewMap = { home: homeView, trend: trendView, brief: briefView, more: moreView };
    var viewContent = viewMap[this.state.activeTab] || homeView;

    this.container.innerHTML =
      '<div style="width:100%;height:100%;background:#050505;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;">' +
      '<div style="position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,' + rgba(C, 0.12) + ' 0%,transparent 60%);pointer-events:none;"></div>' +

      // 顶栏
      '<div style="padding:12px 18px 0;position:relative;z-index:10;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">' +
      '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,' + C + ',' + dim(C, 0.6) + ');display:flex;align-items:center;justify-content:center;color:#0A0A0A;box-shadow:0 0 12px ' + rgba(C, 0.3) + ';">' + icon('radar', 18, '#0A0A0A') + '</div>' +
      '<div style="flex:1;margin:0 10px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);">' +
      '<div style="color:rgba(255,255,255,0.4);display:flex;">' + icon('search', 15) + '</div>' +
      '<span style="font-size:11px;color:rgba(255,255,255,0.35);">更新于 ' + d.generated_at + '</span></div>' +
      '<div style="display:flex;align-items:center;gap:12px;">' +
      '<div style="color:rgba(255,255,255,0.6);display:flex;">' + icon('bell', 17) + '</div>' +
      '<div class="w3-voice-btn" style="display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:18px;background:' + voiceBg + ';color:' + voiceColor + ';border:1px solid ' + (this.state.playing ? C : rgba(C, 0.3)) + ';cursor:pointer;">' +
      icon(voiceIcon, 13, voiceColor) + '<span style="font-size:10px;font-weight:600;">' + voiceText + '</span></div>' +
      '</div></div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">' +
      '<span style="font-size:17px;font-weight:800;color:' + C + ';text-shadow:0 0 20px ' + rgba(C, 0.3) + ';letter-spacing:1px;">RADAR</span>' +
      '<span style="font-size:11px;color:rgba(255,255,255,0.4);">AI 情报雷达站</span>' +
      '</div></div>' +

      // 内容区
      '<div class="w3-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 90px;position:relative;z-index:1;scrollbar-width:none;-ms-overflow-style:none;">' +
      '<style>.w3-scroll::-webkit-scrollbar{display:none;}.w3-scroll{-webkit-overflow-scrolling:touch;}</style>' +
      viewContent +
      '</div>' +

      // 底部 Tab
      '<div style="position:absolute;bottom:0;left:0;right:0;padding:10px 16px 24px;background:rgba(10,10,10,0.85);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-around;align-items:center;z-index:100;">' +
      tabBar +
      '</div>' +
      '<div style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:2px;background:rgba(255,255,255,0.3);z-index:101;"></div>' +
      '</div>';

    // 渲染图表
    this.renderCharts();
  };

  App.prototype.renderCharts = function () {
    var d = this.data;
    if (!d) return;

    // 日总量柱状图
    var dailyEl = document.getElementById('chartDaily');
    if (dailyEl && d.daily_counts) {
      var dc = d.daily_counts;
      var c1 = new Chart(dailyEl, {
        type: 'bar',
        data: {
          labels: dc.dates,
          datasets: [{
            data: dc.counts,
            backgroundColor: 'rgba(204,255,0,0.4)',
            borderColor: '#CCFF00',
            borderWidth: 1,
            borderRadius: 4,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false },
            tooltip: { backgroundColor: '#111', titleColor: '#fff', bodyColor: '#aaa' } },
          scales: {
            x: { ticks: { color: 'rgba(255,255,255,0.4)', maxTicksLimit: 7, font: { size: 9 } }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { color: 'rgba(255,255,255,0.4)', precision: 0, font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
          }
        }
      });
    }

    // 关键词趋势折线
    var trendEl = document.getElementById('chartTrend');
    if (trendEl && d.keyword_trends) {
      var kt = d.keyword_trends;
      var kws = Object.keys(kt.series);
      var palette = ['#CCFF00','#38BDF8','#F472B6','#A78BFA','#4ADE80','#FBBF24','#FB923C','#22D3EE','#F87171','#F9A8D4','#818CF8','#FCD34D','#6EE7B7','#93C5FD','#BEF264'];
      var datasets = kws.map(function (kw, i) {
        return {
          label: kw,
          data: kt.series[kw],
          borderColor: palette[i % palette.length],
          borderWidth: 1.5,
          pointRadius: 1,
          tension: 0.35,
          fill: false,
        };
      });
      new Chart(trendEl, {
        type: 'line',
        data: { labels: kt.dates, datasets: datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: 'rgba(255,255,255,0.6)', boxWidth: 8, font: { size: 9 } }, position: 'bottom' },
            tooltip: { backgroundColor: '#111', titleColor: '#fff', bodyColor: '#aaa' }
          },
          scales: {
            x: { ticks: { color: 'rgba(255,255,255,0.4)', maxTicksLimit: 7, font: { size: 9 } }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { color: 'rgba(255,255,255,0.4)', precision: 0, font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
          }
        }
      });
    }
  };

  App.prototype.bind = function () {
    var self = this;

    // Tab 切换
    var tabs = this.container.querySelectorAll('.w3-tab');
    tabs.forEach(function (el) {
      el.addEventListener('click', function () {
        self.state.activeTab = el.getAttribute('data-tab');
        self.render();
        self.bind();
      });
    });

    // 展开/收起简报内容
    var toggles = this.container.querySelectorAll('.w3-toggle-item');
    toggles.forEach(function (el) {
      el.addEventListener('click', function () {
        var idx = el.getAttribute('data-idx');
        self.state.expandedItems[idx] = !self.state.expandedItems[idx];
        self.render();
        self.bind();
      });
    });

    // 语音播报（服务端晓晓生成音频，网页播放）
    var voiceBtn = this.container.querySelector('.w3-voice-btn');
    if (voiceBtn) {
      voiceBtn.addEventListener('click', function () { self.playVoice(); });
    }
    var voiceAction = this.container.querySelector('[data-action="voice"]');
    if (voiceAction) {
      voiceAction.addEventListener('click', function () { self.playVoice(); });
    }

    // 刷新（强制绕过缓存）
    var refreshBtn = this.container.querySelector('[data-action="refresh"]');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', function () {
        self.load(true);
      });
    }

    // 选题（跳转简报页，AI 生成选题）
    var ideasBtn = this.container.querySelector('[data-action="ideas"]');
    if (ideasBtn) {
      ideasBtn.addEventListener('click', function () {
        self.state.activeTab = 'brief';
        self.render();
        self.bind();
      });
    }

    // 周报（跳转简报页）
    var weeklyBtn = this.container.querySelector('[data-action="weekly"]');
    if (weeklyBtn) {
      weeklyBtn.addEventListener('click', function () {
        self.state.activeTab = 'brief';
        self.render();
        self.bind();
      });
    }
  };

  App.prototype.playVoice = function () {
    var self = this;
    if (this.state.playing) {
      if (this.audio) { this.audio.pause(); this.audio = null; }
      this.state.playing = false;
      this.render();
      this.bind();
      return;
    }
    // 播放云端预生成的晓晓自然语音（GitHub Actions 每天生成 briefing.mp3）
    var audio = new Audio('./data/briefing.mp3?t=' + Date.now());
    self.audio = audio;
    self.state.playing = true;
    self.render();
    self.bind();
    audio.onended = function () {
      self.state.playing = false;
      self.render();
      self.bind();
    };
    audio.onerror = function () {
      alert('语音文件不存在，请先运行云端构建');
      self.state.playing = false;
      self.render();
      self.bind();
    };
    audio.play();
  };

  global.RadarApp = {
    mount: function (selector, options) {
      var app = new App(options);
      app.mount(selector);
      return app;
    }
  };
})(window);

window.addEventListener('DOMContentLoaded', function () {
  var app = RadarApp.mount('#radar-app');
  window.__radarReload = function () { app.load(); };
  // 静默记录版本（app.html 内使用，不跳转）
  fetch('./version.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (v) {
      try { localStorage.setItem('radar_version', v.trim()); } catch (e) {}
    })
    .catch(function () {});
  // 注册 Service Worker（PWA 离线支持）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
  // 每 60 秒刷新
  setInterval(function () {
    if (window.__radarReload) { window.__radarReload(); }
  }, 60000);
});
</script>
